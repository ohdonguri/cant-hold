<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>판타지 아트 플레이그라운드</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#121c20;color:#efe9db;font-family:system-ui,sans-serif}main{display:flex;gap:36px;max-width:1000px;margin:auto;padding:28px;align-items:flex-start}aside{width:290px;position:sticky;top:28px}h1{font-size:25px;line-height:1.4;margin:6px 0 18px}p{color:#a9b6ad;font-size:14px;line-height:1.7}label{display:block;margin-top:22px;margin-bottom:8px;color:#d8dfce;font-size:13px}select,button{font:inherit;color:#f0ebdf;background:#263b37;border:1px solid #5a6d5b;border-radius:9px;padding:11px;width:100%}button{cursor:pointer;margin-top:10px}button:hover{background:#355147}.pill{font-size:11px;color:#b2ca95;letter-spacing:2px}iframe{width:390px;height:844px;border:1px solid #586150;border-radius:18px;background:#14241f;flex:none}.note{font-size:12px;color:#8d9a91;border-top:1px solid #38453e;padding-top:16px;margin-top:24px}a{color:#cad9a2}#status{min-height:30px;color:#d0c09a}@media(max-width:740px){main{padding:16px;gap:18px;flex-direction:column;align-items:center}aside{position:static;width:100%;max-width:390px}h1{font-size:21px}iframe{max-width:100%}}
</style>
<main>
<aside>
<div class="pill">FANTASY ART REVIEW</div>
<h1>같은 전투,<br>새로운 세계.</h1>
<p>실제 게임의 맵·스프라이트·공격 효과를 확인하는 로컬 미리보기입니다. 모든 타워와 몬스터를 배치한 전시 전투가 반복됩니다.</p>
<label for="stage">스테이지 / 지형 테마</label><select id="stage"></select>
<label for="focus">타워 강조</label><select id="focus"><option value="">전체 보기</option></select>
<button id="pause">모션 멈추기</button><button id="replay">전투 다시 보기</button>
<p id="status">게임을 불러오는 중…</p>
<p class="note">미리보기에서는 모든 스테이지를 볼 수 있습니다. 플레이 저장·계정 동기화는 실행하지 않습니다.<br><a href="../index.html" target="_blank">일반 게임 열기 ↗</a></p>
</aside>
<iframe id="game" title="새 아트가 적용된 게임 미리보기" src="../index.html?artPreview=1"></iframe>
</main>
<script>
const frame = document.getElementById('game');
const stage = document.getElementById('stage'), focus = document.getElementById('focus');
let ready = false;
const run = code => frame.contentWindow.eval(code);
function setup() {
  run(`
    window.__artStopped = false;
    window.__artNativeUpdate = window.__artNativeUpdate || update;
    window.__artElapsed = 0;
    persist = () => {}; cloudSave = () => {}; sfx = () => {};
    window.__artScene = function(stageIndex) {
      restart(); loadStage(stageIndex);
      state.phase = 'wave'; state.wave = 13; state.life = 999; state.gold = 99999;
      state.openRows = CFG.BOARD_H; state.deck = KIND_KEYS.slice();
      state.spawnQueue = []; state.timer = 99999; state.waveT = 0;
      state.paused = false; state.selected = null; tuteMerged = true; artTime = 0;
      const spots = [];
      for (let y=0;y<CFG.BOARD_H;y++) for(let x=0;x<CFG.BOARD_W;x++)
        if (canPlace(x,y,1,occupancy())) spots.push({x,y});
      for(let i=0;i<KIND_KEYS.length;i++) {
        const p = spots[Math.min(spots.length-1,Math.floor((i+0.5)*spots.length/KIND_KEYS.length))];
        if(p) summon(KIND_KEYS[i],p.x,p.y);
      }
      for(let i=0;i<16;i++) {
        spawnEnemy(Object.keys(ENEMY)[i%8]);
        const e=state.enemies[state.enemies.length-1];
        e.dist=(i+0.5)/17*laneLen(e.lane);
        const p=posAt(e.dist,e.lane);e.x=p.x;e.y=p.y;e.hp=e.maxHp=2500;
      }
      window.__artElapsed=0;
      render();
    };
    update = function(dt) {
      if(window.__artStopped) return;
      window.__artElapsed += dt;
      state.life=999;
      window.__artNativeUpdate(dt);
      if(state.phase!=='wave'||window.__artElapsed>16) window.__artScene(state.stage);
      for(const t of state.towers) if(t.kind==='mint'&&t.artCoin<=0&&Math.floor(window.__artElapsed)%3===0) {t.artCoin=1.1;t.artIncome=6;}
    };
    document.getElementById('ebIntro')?.remove();
  `);
  const data = run(`({stages:STAGES.map((s,i)=>({name:s.name,theme:STAGE_THEMES[s.name][0],i})),towers:KIND_KEYS.map(k=>({key:k,name:KINDS[k].name}))})`);
  stage.replaceChildren(...data.stages.map(s => new Option(`${s.i+1}. ${s.name} — ${s.theme}`,s.i)));
  for(const t of data.towers) focus.add(new Option(t.name,t.key));
  ready=true; reset();
}
function reset() {
  if(!ready)return;
  run(`window.__artScene(${Number(stage.value)});`);
  document.getElementById('status').textContent='새 PNG 지형 7계열 · 20개 맵 적용 · 새 몬스터 8종';
  focus.value='';
}
stage.onchange=reset;
focus.onchange=()=>run(`state.selected=state.towers.find(t=>t.kind===${JSON.stringify(focus.value)})?.id || null;render();`);
document.getElementById('replay').onclick=reset;
document.getElementById('pause').onclick=e=>{
  const stopped=run('window.__artStopped = !window.__artStopped');
  e.target.textContent=stopped?'모션 재생하기':'모션 멈추기';
};
frame.onload=()=>{try{setup()}catch(e){document.getElementById('status').textContent='로컬 서버에서 열어주세요: node tools/art-preview-server.mjs';console.error(e)}};
</script>
</html>
