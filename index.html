// 워3식 방어력 감쇠. 음수 방어력(파쇄 분기)도 그대로 처리된다.
function armorReduction(armor) {
  return armor * 0.06 / (1 + 0.06 * Math.abs(armor));
}
function applyArmor(raw, armor) {
  return raw * (1 - armorReduction(armor));
}

function waveHp(wave) {
  return 100 * Math.pow(CFG.HP_GROWTH, wave);
}

// 현재 스테이지의 런타임 데이터. loadStage() 가 제자리에서 갈아끼운다.
// 재할당하면 밖에서 잡은 참조가 끊기므로 항상 같은 객체를 유지한다.
const lanes = [];        // [{points, seg, len}]
const pathCells = new Set();

function laneCells(points) {
  const set = new Set();
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
    let x = a.x, y = a.y;
    set.add(x + ',' + y);
    let guard = 0;
    while ((x !== b.x || y !== b.y) && guard++ < 999) {
      x += dx; y += dy;
      set.add(x + ',' + y);
    }
  }
  return set;
}

function loadStage(index) {
  const def = STAGES[Math.max(0, Math.min(STAGES.length - 1, index))];
  state.stage = STAGES.indexOf(def);

  CFG.BOARD_W = def.w;
  CFG.BOARD_H = def.h;
  CFG.OPEN_ROWS = def.openRows;
  CFG.UNLOCK_AT = def.unlockAt;
  CFG.WAVE_MAX = def.waves;

  lanes.length = 0;
  for (const points of def.lanes) {
    const seg = points.slice(0, -1).map((a, i) => Math.hypot(points[i + 1].x - a.x, points[i + 1].y - a.y));
    lanes.push({ points, seg, len: seg.reduce((s, v) => s + v, 0) });
  }

  pathCells.clear();
  for (const l of lanes) for (const c of laneCells(l.points)) pathCells.add(c);

  resize();
}

function isPath(gx, gy) { return pathCells.has(gx + ',' + gy); }

// 진행 거리(칸)를 격자 좌표로 환산.
function posAt(dist, lane) {
  const L = lanes[lane || 0] || lanes[0];
  const pts = L.points;
  let d = Math.max(0, dist);
  for (let i = 0; i < L.seg.length; i++) {
    if (d <= L.seg[i] || i === L.seg.length - 1) {
      const a = pts[i], b = pts[i + 1];
      const t = L.seg[i] === 0 ? 0 : Math.min(1, d / L.seg[i]);
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    }
    d -= L.seg[i];
  }
  return pts[pts.length - 1];
}

function laneLen(lane) { return (lanes[lane || 0] || lanes[0]).len; }

const SPEEDS = [1, 2, 4];
function cycleSpeed() {
  const i = SPEEDS.indexOf(state.speed);
  state.speed = SPEEDS[(i + 1) % SPEEDS.length];
}

// 일시정지. 웨이브가 자동으로 굴러가는 게임이라 "잠깐 멈추고 싶다"는 요구가
// 생기는데, 멈춘 채로 배치와 합성을 할 수 있으면 시간 압박이 통째로 사라진다.
// 그래서 멈추는 동안에는 화면을 도움말로 덮어 판 자체를 못 만지게 한다
// (입력은 pointerdown 첫 줄에서 통째로 먹고 화면만 되살린다).
// 겸사겸사 이 화면이 이 게임의 유일한 설명서다 — drawPause 참고.
function togglePause() {
  state.paused = !state.paused;
  // 토글 자리는 drawPause 가 매 프레임 다시 세운다. 여기서 비워 두지 않으면
  // 지난번 정지 화면의 자리가 아직 안 그려진 첫 프레임에 그대로 먹힌다.
  shakeToggleRect = null;
  soundToggleRect = null;
  if (!state.paused) return;
  // 멈추는 순간 손에 들고 있던 것들을 놓는다. 키보드 ESC 로 멈추면
  // 손가락은 아직 타워를 끄는 중일 수 있고, 그대로 두면 재개할 때
  // 놓은 적도 없는 합성이 성사된다.
  drag = null;
  state.picker = null;
  // 카메라도 원위치로 돌린다. 흔들리는 도중에 멈추면 그 진폭이 그대로 얼어붙고,
  // 재개하는 순간 남은 만큼 튀어 오른다.
  resetImpact();
}

let tuteMerged = false;
try { tuteMerged = localStorage.getItem('cant-hold-tute') === '1'; } catch { /* 무시 */ }
function markTuteMerged() {
  if (tuteMerged) return;
  tuteMerged = true;
  try { localStorage.setItem('cant-hold-tute', '1'); } catch { /* 저장 못 해도 됨 */ }

// 덱은 판 시작 전에 플레이어가 고른다. 3종이라 구멍이 4개고, 그 구멍이
// 어떤 웨이브에서 아플지가 이 게임의 첫 결정이다.
// 시뮬 기준 최고 덱과 최저 덱의 차이가 10웨이브 이상 난다.
function rollDeck() {
  const pool = KIND_KEYS.slice();
  const deck = [];
  while (deck.length < CFG.DECK_SIZE && pool.length)
    deck.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
  state.deck = deck;
}

function toggleDeckPick(kind) {
  const i = state.deckPick.indexOf(kind);
  if (i >= 0) state.deckPick.splice(i, 1);
  else if (state.deckPick.length < CFG.DECK_SIZE) state.deckPick.push(kind);
  else toast(`${CFG.DECK_SIZE}종까지만`);
}

function startRun() {
  if (state.deckPick.length !== CFG.DECK_SIZE) return;
  savedRun = null;
  state.deck = state.deckPick.slice();
  state.phase = 'build';
  state.timer = CFG.WAVE_GAP;
}

// 소환 비용. 웨이브가 넘어갈 때 누적분이 30% 감쇠한다.
function summonCost() {
  return Math.round(10 + 2 * state.summonedThisWave);
}

function towerSize(t) { return t.star >= CFG.BIG_FROM_STAR ? 2 : 1; }

// 조폐소는 5성이어도 1칸. 경제 타워가 공간까지 먹으면 아무도 안 쓴다.
function towerFootprint(t) { return t.kind === 'mint' ? 1 : towerSize(t); }

function occupancy(exclude) {
  const occ = new Map();
  for (const t of state.towers) {
    if (exclude && exclude.has(t.id)) continue;
    const s = towerFootprint(t);
    for (let dy = 0; dy < s; dy++)
      for (let dx = 0; dx < s; dx++)
        occ.set((t.gx + dx) + ',' + (t.gy + dy), t.id);
  }
  return occ;
}

function firstOpenRow() { return CFG.BOARD_H - state.openRows; }

// 다음으로 행이 열리는 웨이브. 더 열릴 게 없으면 null.
function nextUnlockWave() {
  if (state.openRows >= CFG.BOARD_H) return null;
  const w = CFG.UNLOCK_AT.find(v => v > state.wave);
  return w === undefined ? null : w;
}

function canPlace(gx, gy, size, occ, ignoreId) {
  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      const x = gx + dx, y = gy + dy;
      if (x < 0 || x >= CFG.BOARD_W || y < 0 || y >= CFG.BOARD_H) return false;
      if (y < firstOpenRow()) return false;
      if (isPath(x, y)) return false;
      const o = occ.get(x + ',' + y);
      if (o !== undefined && o !== ignoreId) return false;
    }
  }
  return true;
}

// 종류도 자리도 플레이어가 고른다. 자리를 생략하면 빈 칸 아무 데나 놓는다.
// 오라형 타워가 생긴 뒤로는 어디에 놓느냐가 곧 성능이라 자리 선택이 필요하다.
function summon(kind, atX, atY) {
  const deck = state.deck.length ? state.deck : KIND_KEYS;
  if (!kind || !deck.includes(kind)) kind = deck[(Math.random() * deck.length) | 0];

  const cost = summonCost();
  if (state.gold < cost) return toast('골드 부족');

  const occ = occupancy();
  let gx, gy;
  if (atX !== undefined) {
    if (!canPlace(atX, atY, 1, occ)) return toast('여기엔 못 놓음');
    gx = atX; gy = atY;
  } else {
    const spots = [];
    for (let y = firstOpenRow(); y < CFG.BOARD_H; y++)
      for (let x = 0; x < CFG.BOARD_W; x++)
        if (canPlace(x, y, 1, occ)) spots.push([x, y]);
    if (!spots.length) return toast('빈 칸 없음');
    [gx, gy] = spots[(Math.random() * spots.length) | 0];
  }

  state.gold -= cost;
  state.summonedThisWave++;
  const t = {
    id: nextTowerId++, gx, gy, kind, star: 1,
    b3: null, b5: null, t7: null,
    cd: 0, angle: -Math.PI / 2, flash: 0,
    streak: 0, lastTarget: null, arcKills: 0,
  };
  state.towers.push(t);
}

// ── 합성 ────────────────────────────────────────────────────
function mergeCost(star) { return 8 * star; }
function mergeIsFree() { return state.towers.some(t => t.kind === 'mint' && t.b5 === 'A2'); }

// 합성은 준비 단계에서만 된다. 웨이브 중에 합치면 결과 타워가 자리를 옮기고,
// 그러면 오라 범위와 마력로 조준선이 한복판에서 통째로 흔들린다.
function mergeAllowed() { return state.phase === 'build'; }

function canMerge(a, b) {
  return mergeAllowed() && !!a && !!b && a.id !== b.id && a.kind === b.kind
      && a.star === b.star && a.star < CFG.STAR_MAX;
}

// 지금 합칠 수 있는 타워 한 쌍. 튜토리얼이 어느 둘을 가리킬지 정하는 데 쓴다.
function mergeablePair() {
  const ts = state.towers;
  for (let i = 0; i < ts.length; i++)
    for (let j = i + 1; j < ts.length; j++)
      if (canMerge(ts[i], ts[j])) return [ts[i], ts[j]];
  return null;
}

// 합성 결과가 몇 칸을 먹는지. 5성부터 2x2 가 되는데, 이걸 합성해 보고 나서야
// 알게 되면 늦다 — 그래서 드래그 중 미리보기(drawMergePreview)도 같은 답을 봐야 한다.
// 두 곳이 갈라지면 "미리보기는 2x2 라더니 한 칸으로 됐다"가 난다.
function mergeResultSize(a) {
  const star = a.star + 1;
  return (star >= CFG.BIG_FROM_STAR && a.kind !== 'mint') ? 2 : 1;
}

// 합성 결과를 놓을 자리를 찾는다. 5성부터 2x2 라서 자리가 없으면 합성 자체가 막힌다.
// 이게 이 게임의 공간 압박이고, 조용히 우회시키면 안 된다.
//
// 순서가 중요하다. b 는 드래그를 "놓은" 타워라서 여기가 먼저다.
// a(집어든 타워)를 먼저 보면 결과가 손을 뗀 자리가 아니라 출발 자리에 생긴다.
function mergeSpot(a, b, size) {
  const occ = occupancy(new Set([a.id, b.id]));
  for (const base of [b, a]) {
    for (let dy = 0; dy > -size; dy--) {
      for (let dx = 0; dx > -size; dx--) {
        if (canPlace(base.gx + dx, base.gy + dy, size, occ)) return { gx: base.gx + dx, gy: base.gy + dy };
      }
    }
  }
  for (let gy = firstOpenRow(); gy < CFG.BOARD_H; gy++)
    for (let gx = 0; gx < CFG.BOARD_W; gx++)
      if (canPlace(gx, gy, size, occ)) return { gx, gy };
  return null;
}

// 놓을 수 있는 자리 **전부**. mergeSpot 이 "하나를 고르는" 함수라면 이건 "무엇을
// 고를 수 있었는지" 를 낸다 — 2x2 결과에서 자리를 플레이어에게 묻기 위한 목록이다.
//
// mergeSpot 을 이걸로 갈아끼우지 않는다. 그쪽의 b→a→좌상단 우선순위는 1x1 합성이
// 손을 뗀 자리에 생긴다는 규칙 그 자체이고, 배치 모드의 기본 선택(sel)도 그 값이다.
// 여기서 순서는 gy↑ → gx↑ 하나뿐이다. 화면에 후보를 그리는 순서와 같아야 하고,
// 난수를 쓰면 같은 판이 두 번 다르게 보인다(2.6 의 연출 난수 규칙과 같은 이유).
//
// 불변식: mergeSpot(a,b,s) !== null ⟺ mergeSpots(a,b,s).length > 0.
// 두 함수가 같은 occupancy(a,b 제외) 와 같은 canPlace 를 보기 때문에 성립한다 —
// mergeSpot 의 b/a 오프셋 검사가 찾는 자리는 전부 이 전체 스캔에도 걸린다.
function mergeSpots(a, b, size) {
  const occ = occupancy(new Set([a.id, b.id]));
  const out = [];
  for (let gy = firstOpenRow(); gy < CFG.BOARD_H; gy++)
    for (let gx = 0; gx < CFG.BOARD_W; gx++)
      if (canPlace(gx, gy, size, occ)) out.push({ gx, gy });
  return out;
}

// at 을 주면 그 자리에 놓는다(배치 모드). 생략하면 지금까지처럼 mergeSpot 이 고른다.
// at 이 와도 canPlace 로 다시 본다 — 호출부를 믿으면 모드를 열어 둔 사이에 판이
// 바뀐 경우(행 개방, 다른 타워 배치)에 겹쳐 놓인 타워가 조용히 생긴다.
function mergeTowers(a, b, at) {
  if (!canMerge(a, b)) return null;
  const cost = mergeIsFree() ? 0 : mergeCost(a.star);
  if (state.gold < cost) { toast('합성 비용 부족'); return null; }

  const star = a.star + 1;
  const size = mergeResultSize(a);
  const spot = at
    ? (canPlace(at.gx, at.gy, size, occupancy(new Set([a.id, b.id]))) ? { gx: at.gx, gy: at.gy } : null)
    : mergeSpot(a, b, size);
  // 성급만 말하면 왜 막혔는지 안 읽힌다. 몇 칸이 필요한지까지 붙인다.
  if (!spot) { toast(size > 1 ? `${star}성은 2x2 — 빈 자리가 없다` : '자리 없음'); return null; }

  state.gold -= cost;
  state.towers = state.towers.filter(t => t.id !== a.id && t.id !== b.id);

  const t = {
    id: nextTowerId++, gx: spot.gx, gy: spot.gy, kind: a.kind, star,
    b3: a.b3 || b.b3, b5: a.b5 || b.b5, t7: a.t7 || b.t7,
    cd: 0, angle: a.angle, flash: 0,
    streak: 0, lastTarget: null, arcKills: 0,
  };
  state.towers.push(t);
  markTuteMerged();   // 드래그 합성을 해냈으니 안내를 끈다

  // 물려받을 분기가 서로 다르면 묻는다. 예전에는 끌어당긴 쪽이 조용히 이겼는데,
  // 그러면 어느 빌드가 살아남았는지 플레이어가 알 방법이 없었다 — 3성 둘을 합친
  // 뒤에 왜 딴 분기가 붙어 있는지 설명해 줄 화면이 어디에도 없었다.
  //
  // b3 와 b5 는 한 줄기다 (5성 후보가 b3 에서 파생된다). 슬롯을 따로 물으면
  // A 줄기에 B2 가 붙은, 규칙상 있을 수 없는 빌드가 만들어진다. 그래서 부모
  // 한쪽의 줄기를 통째로 물려받는다.
  if (branchChain(a) !== branchChain(b)) {
    pushChoice({ towerId: t.id, mode: 'inherit', tier: star,
      chains: [{ b3: a.b3, b5: a.b5 }, { b3: b.b3, b5: b.b5 }] });
  }

  // 3성/5성/7성 진입은 새 분기 선택을 띄운다. 물려받기 뒤에 와야 한다 —
  // 5성 후보는 그때 확정된 b3 에서 나온다.
  if (star === 3 || star === 5 || star === 7) pushChoice({ towerId: t.id, tier: star });
  return t;
}

// 분기 줄기를 한 문자열로. 두 부모가 같은 빌드인지 비교하는 데만 쓴다.
function branchChain(t) { return (t.b3 || '-') + '/' + (t.b5 || '-'); }

// ── 2x2 결과 자리 고르기 ─────────────────────────────────────
// 5성부터는 결과가 2x2 인데, 그 자리를 mergeSpot 이 혼자 정하고 있었다. 놓은 쪽에
// 안 들어가면 보드를 좌상단부터 훑어 처음 걸리는 칸에 박히므로, 판에서 제일 중요한
// 타워가 플레이어가 안 고른 자리 — 대개 사거리가 제일 안 닿는 구석 — 에 생겼다.
//
// **아무것도 커밋하지 않는다.** 골드도 안 깎고 부모 둘도 그대로 두고 id 두 개만
// 들고 있는다. 취소가 곧 무동작이라 세이브·일시정지·ESC 어느 쪽으로 빠져나가도
// 되돌릴 것이 없다. "먼저 합쳐 놓고 자리를 물은 뒤 취소하면 되돌린다" 로 만들면
// 되돌리기가 pushChoice 큐·분기 물려받기까지 되감아야 해서 원상복구가 불가능하다.
//
// 형제 상태(state.mergePlace)를 새로 만들지 않고 state.picker 에 얹는 것도 같은
// 이유다. picker 를 지우는 경로가 이미 넷(togglePause · restoreRun · restart · ESC)
// 이고, 새 상태를 만들면 그 넷을 전부 다시 맞춰야 한다 — 하나만 빠뜨려도
// "일시정지했다 풀면 놓은 적 없는 합성이 성사된다" 가 난다. 2.7 이 beam() 에서
// 겪은 "규칙이 문법적으로 보이는 몇 줄에서만 지켜진다" 와 같은 함정이다.
function beginMergePlace(a, b) {
  // 배치를 다 시켜 놓고 마지막에 거절하는 경로가 없어야 한다. 막힐 이유는 전부 여기서 본다.
  if (!canMerge(a, b)) return null;
  const cost = mergeIsFree() ? 0 : mergeCost(a.star);
  if (state.gold < cost) { toast('합성 비용 부족'); return null; }

  const star = a.star + 1;
  const size = mergeResultSize(a);
  const spots = mergeSpots(a, b, size);
  if (!spots.length) { toast(size > 1 ? `${star}성은 2x2 — 빈 자리가 없다` : '자리 없음'); return null; }

  // 후보가 한 곳뿐이어도 연다. 어떨 땐 묻고 어떨 땐 안 묻으면 규칙이 안 읽히고,
  // 하나뿐인 그 자리가 어디인지 보여주는 것 자체가 정보다.
  // sel 기본값은 mergeSpot — 생각 없이 '배치' 를 누르면 오늘까지와 같은 결과가 된다.
  state.picker = { mode: 'mergePlace', aId: a.id, bId: b.id, size, star, spots, sel: mergeSpot(a, b, size) };
  return state.picker;
}

function mergePlaceOpen() { return !!state.picker && state.picker.mode === 'mergePlace'; }

// 후보 목록에 있는 칸만 받는다. 밖을 눌러도 sel 은 안 움직이고 모드도 안 닫힌다 —
// 배치 모드에서는 보드가 통째로 "바깥" 이라, 바깥 탭에 닫으면 빗나간 탭 한 번에
// 합성이 날아간다. 취소는 버튼으로만.
function mergePlaceSelect(gx, gy) {
  if (!mergePlaceOpen()) return false;
  const hit = state.picker.spots.find(s => s.gx === gx && s.gy === gy);
  if (!hit) return false;
  state.picker.sel = { gx: hit.gx, gy: hit.gy };
  return true;
}

function mergePlaceCommit() {
  if (!mergePlaceOpen()) return null;
  const p = state.picker;
  const a = state.towers.find(t => t.id === p.aId);
  const b = state.towers.find(t => t.id === p.bId);
  state.picker = null;
  if (!a || !b) return null;
  state.selected = null;
  // 여기서 처음으로 골드가 나가고 부모가 사라진다. 자리 재검증도 mergeTowers 안이다.
  return mergeTowers(a, b, p.sel);
}

function mergePlaceCancel() {
  if (!mergePlaceOpen()) return false;
  state.picker = null;
  return true;
}

// 읽기용 게터. 2.8 의 hitstopState() 와 같은 형태다 — 핸들러에 로직을 남기면
// 헤드리스가 원리적으로 못 보므로, 검사 창을 게임 코드 안에 둔다.
function mergePlaceState() {
  if (!mergePlaceOpen()) return { open: false, aId: null, bId: null, size: 0, sel: null, spots: [] };
  const p = state.picker;
  return { open: true, aId: p.aId, bId: p.bId, size: p.size,
    sel: p.sel ? { ...p.sel } : null, spots: p.spots.map(s => ({ ...s })) };
}

// ── 선택 대기열 ──────────────────────────────────────────────
// 합성 한 번이 선택을 둘 만들 수 있다 (물려받기 → 새 성급 분기). 그리고 뒤의
// 후보가 앞의 답에 달려 있어서, 큐에는 "무엇을 물을지"만 넣고 후보는 실제로
// 화면에 뜨는 순간에 계산한다.
const choiceQueue = [];

function pushChoice(c) {
  choiceQueue.push(c);
  if (!state.choice) pumpChoices();
}

// 큐에서 물어볼 게 나올 때까지 꺼낸다. 물을 필요가 없어진 항목은 조용히 처리한다.
function pumpChoices() {
  state.choice = null;
  while (choiceQueue.length) {
    if (activateChoice(choiceQueue.shift())) return;
  }
}

function activateChoice(c) {
  const t = state.towers.find(v => v.id === c.towerId);
  if (!t) return false;                    // 그 사이 팔렸거나 다시 합쳐졌다

  if (c.mode === 'inherit') {
    // 후보가 같아졌으면 물을 게 없다
    const [x, y] = c.chains;
    if (x.b3 === y.b3 && x.b5 === y.b5) return false;
    state.choice = { towerId: t.id, tier: c.tier, mode: 'inherit',
      chains: c.chains, options: [0, 1] };
    return true;
  }

  if (c.tier === 7) {
    const pool = TRAIT_KEYS.slice();
    const picks = [];
    for (let i = 0; i < 3 && pool.length; i++)
      picks.push(pool.splice((Math.random() * pool.length) | 0, 1)[0]);
    state.choice = { towerId: t.id, tier: 7, options: picks };
  } else if (c.tier === 3) {
    state.choice = { towerId: t.id, tier: 3, options: ['A', 'B'] };
  } else {
    const b = t.b3 || 'A';
    state.choice = { towerId: t.id, tier: c.tier, options: [b + '1', b + '2'] };
  }
  return true;
}

function openChoice(t, tier) { pushChoice({ towerId: t.id, tier }); }

// 판을 새로 세울 때. 큐에 남은 걸 안 비우면 다음 판 첫 합성에 옛 선택이 튀어나온다.
function clearChoices() {
  choiceQueue.length = 0;
  state.choice = null;
}

function applyChoice(opt) {
  const c = state.choice;
  if (!c) return;
  const t = state.towers.find(v => v.id === c.towerId);
  if (t) {
    if (c.mode === 'inherit') {
      const chain = c.chains[opt] || c.chains[0];
      t.b3 = chain.b3;
      t.b5 = chain.b5;
    }
    else if (c.tier === 3) t.b3 = opt;
    else if (c.tier === 5) t.b5 = opt;
    else t.t7 = opt;
  }
  pumpChoices();   // 남은 선택이 있으면 이어서 띄운다
}

function sellSelected() {
  const t = state.towers.find(v => v.id === state.selected);
  if (!t) return;
  state.gold += Math.round(10 * STAR_MULT[t.star] * 0.4);
  state.towers = state.towers.filter(v => v.id !== t.id);
  state.selected = null;
}

function toast(text) { state.toast = { text, t: 1.6 }; }

const sprCache = new Map();

// 명암 문자 하나를 실제 색으로 바꾼다
function shade(hex, level) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r, g, b] = p(hex);
  const mix = (v, to, t) => Math.round(v + (to - v) * t);
  // 0 은 외곽선. 어떤 배경 위에서도 실루엣이 서지도록 아주 어둡게 깐다.
  if (level === 0) return `rgb(${mix(r, 0, 0.8)},${mix(g, 0, 0.8)},${mix(b, 0, 0.8)})`;
  if (level === 1) return `rgb(${mix(r, 0, 0.55)},${mix(g, 0, 0.55)},${mix(b, 0, 0.55)})`;
  if (level === 3) return `rgb(${mix(r, 255, 0.42)},${mix(g, 255, 0.42)},${mix(b, 255, 0.42)})`;
  if (level === 4) return '#ffffff';
  return hex;
}

function sprite(key, color) {
  const id = key + '|' + color;
  let c = sprCache.get(id);
  if (c) return c;
  const rows = SPR[key];
  if (!rows) return null;
  c = document.createElement('canvas');
  c.width = rows[0].length;
  c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') continue;
      g.fillStyle = shade(color, Number(ch));
      g.fillRect(x, y, 1, 1);
    }
  });
  sprCache.set(id, c);
  return c;
}

// sizeY 를 따로 받는 이유는 처치 잔상(squash) 하나다. 한 변만 받으면 균등 축소밖에
// 안 되는데, 잔상은 가로로 퍼지면서 세로로 눌려야 "터졌다"로 읽힌다.
// 기본값이 size 라서 기존 호출부(덱 카드·피커·타워·적·HUD 덱 줄)는 한 글자도 안 바뀐다 —
// 정사각형이 압도적 다수라 그쪽에 인자를 하나 더 강제하면 다섯 군데가 전부 노이즈가 된다.
function drawSprite(key, color, cx, cy, size, sizeY = size) {
  const c = sprite(key, color);
  if (!c) return false;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(c, Math.round(cx - size / 2), Math.round(cy - sizeY / 2), size, sizeY);
  ctx.imageSmoothingEnabled = true;
  return true;
}

// ═════════════════════════════════════════════════════════════
// 전투
// ═════════════════════════════════════════════════════════════
function towerCenter(t) { const s = towerFootprint(t); return { x: t.gx + s / 2, y: t.gy + s / 2 }; }
// 사거리는 원이 아니라 정사각형이다. 격자 게임에서 원을 쓰면 모서리 칸이
// 걸치는지 아닌지를 눈으로 판단할 수 없다. 표시와 판정이 같아야 한다.
function distTo(t, e) {
  const a = towerCenter(t);
  return Math.max(Math.abs(a.x - (e.x + 0.5)), Math.abs(a.y - (e.y + 0.5)));
}

// 각인은 타워당 1개만 적용한다. 중첩되면 7성 벽 세우기가 정답이 된다.
function engraveBonus(t) {
  const s = towerFootprint(t);
  for (const o of state.towers) {
    if (o.t7 !== 'engrave' || o.id === t.id) continue;
    const os = towerFootprint(o);
    const gap = !(t.gx >= o.gx + os || o.gx >= t.gx + s || t.gy >= o.gy + os || o.gy >= t.gy + s);
    const touch = t.gx < o.gx + os + 1 && o.gx < t.gx + s + 1 && t.gy < o.gy + os + 1 && o.gy < t.gy + s + 1;
    if (touch && !gap) return 0.25;
  }
  return 0;
}

function towerRange(t) {
  let r = KINDS[t.kind].range;
  if (t.kind === 'eroder' || t.kind === 'shredder' || t.kind === 'frost')
    r *= t.b3 === 'A' ? 1.5 : t.b3 === 'B' ? 0.85 : 1;
  if (t.t7 === 'overclock') r *= 0.75;
  return r;
}

function towerCd(t) {
  let c = KINDS[t.kind].cd;
  if (t.kind === 'marksman') c /= t.b3 === 'A' ? 1.8 : t.b3 === 'B' ? 0.6 : 1;
  if (t.kind === 'mortar')   c /= t.b3 === 'A' ? 2.0 : t.b3 === 'B' ? 0.7 : 1;
  if (t.kind === 'arc')      c = t.b3 === 'A' ? 1.2 : t.b3 === 'B' ? 4.0 : 2.5;
  if (t.t7 === 'overclock') c /= 1.5;
  return c;
}

function towerDmg(t) {
  let d = KINDS[t.kind].base * CFG.DMG_SCALE * STAR_MULT[t.star];
  if (t.kind === 'marksman') d *= t.b3 === 'A' ? 0.6 : t.b3 === 'B' ? 2.5 : 1;
  if (t.kind === 'mortar')   d *= t.b3 === 'A' ? 0.55 : t.b3 === 'B' ? 1.8 : 1;
  if (t.kind === 'arc') {
    d *= t.b3 === 'A' ? 0.5 : t.b3 === 'B' ? 2.4 : 1;
    if (t.b5 === 'B2') d *= 0.65;
    if (t.b5 === 'B1') d *= 1 + Math.min(1.5, (t.arcKills || 0) * 0.15);
  }
  if (t.kind === 'shredder' && t.b5 === 'B2') d *= 1.6;
  if (t.kind === 'marksman' && t.b3 === 'A') d *= 1 + Math.min(5, t.streak || 0) * 0.08;
  d *= 1 + engraveBonus(t);
  if (t.t7 === 'resonance')
    d *= 1 + 0.08 * state.towers.filter(v => v.kind === t.kind && v.id !== t.id).length;
  return d;
}

function dmgType(t) {
  if (t.kind === 'arc' && t.b5 === 'B2') return 'pure';
  return KINDS[t.kind].dmgType;
}

// 면역몹에게 디버프가 얼마나 통하는지. 불굴 특성만 예외를 만든다.
function debuffScale(e, t) {
  if (!ENEMY[e.kind].immune) return 1;
  return t && t.t7 === 'stalwart' ? 0.3 : 0;
}

function effArmor(e) {
  const base = ENEMY[e.kind].armor;
  const floor = state.towers.some(t => t.kind === 'shredder' && t.b5 === 'B1') ? -25 : 0;
  return Math.max(floor, base - e.armorStacks * e.armorPer);
}

function effMres(e) {
  const base = ENEMY[e.kind].mres;
  const floor = state.towers.some(t => t.kind === 'eroder' && t.b5 === 'B1') ? -0.30 : 0;
  return Math.max(floor, base - e.mresCut - e.arcResonance);
}

// 증폭 계열은 가산으로 합친다. 곱연산이면 3중첩에서 밸런스가 터진다.
function ampAll(e) {
  let a = e.vulnT > 0 ? 0.25 : 0;
  if (e.markT > 0) a += 0.20;
  if (e.slowAmt > 0 && state.hasHanpa) a += 0.12;
  return a;
}
function ampMagic(e) { return (e.magicVuln || 0) + (e.inDeepAura ? 0.15 : 0); }
// 물리 취약은 마법 취약(ampMagic)의 짝이다. 파쇄자가 방깎만 쌓던 시절에는 방어력이
// 0~5 인 적(질주 0 · 군집 0 · 보병 5 · 마갑 5 — 8종 중 4종)에게 오라가 사실상
// 아무 일도 안 했다. 침식자가 같은 구멍을 이미 이렇게 메웠다(fireTower 주석 참고).
// **속성 상성이 아니다**(§7) — 새 축을 만든 게 아니라 이미 있는 마법 취약의 대칭을
// 채운 것이고, 타입은 여전히 물리/마법/순수 3종뿐이다.
function ampPhys(e) { return e.physVuln || 0; }

// tick = 매 프레임 들어가는 지속딜. 피격 플래시를 내지 않는다.
// 안 그러면 장판 안의 적이 계속 흰색이라 다른 상태 표시가 전부 묻힌다.
function damage(e, raw, type, src, tick) {
  let d = raw;
  if (type === 'physical') {
    let armor = effArmor(e);
    if (src && src.kind === 'shredder' && src.b5 === 'B2') armor = 0;
    if (src && src.kind === 'mortar' && src.b5 === 'B2') {
      armor *= 0.5;
      if (ENEMY[e.kind].elite) d *= 1.4;
    }
    d = applyArmor(d, armor);
    d *= 1 + ampPhys(e);
  } else if (type === 'magic') {
    d *= 1 - effMres(e);
    d *= 1 + ampMagic(e);
  }
  d *= 1 + ampAll(e);
  e.hp -= d;
  if (!tick) e.hitFlash = 0.08;
  if (e.hp <= 0) killEnemy(e, src, type);
  return d;
}

// type 은 처치 연출을 고르는 데만 쓴다. 즉사 경로(관측소 B1 처형, 7성 처형
// 프로토콜)는 damage() 를 안 거치므로 호출부에서 직접 넘겨야 한다.
function killEnemy(e, src, type) {
  if (e.dead) return;
  e.dead = true;

  // 전이: 스택을 최근접 적에게 넘긴다
  if (src && src.kind === 'shredder' && src.b5 === 'A2' && e.armorStacks > 0) {
    let best = null, bd = Infinity;
    for (const o of state.enemies) {
      if (o === e || o.dead) continue;
      const d = Math.hypot(o.x - e.x, o.y - e.y);
      if (d < bd) { bd = d; best = o; }
    }
    if (best) {
      best.armorStacks = e.armorStacks;
      best.armorPer = e.armorPer;
      best.armorCap = Math.max(best.armorCap || 0, e.armorCap || e.armorStacks);
    }
  }

  if (src && src.kind === 'arc' && src.b5 === 'B1') src.arcKills = (src.arcKills || 0) + 1;
  if (src && src.kind === 'marksman' && src.b5 === 'A2') src.cd = 0;   // 점사
  if (src && src.t7 === 'collector') state.gold += 2;

  // 조폐소 징수 / 현상금 / 약탈
  for (const t of state.towers) {
    if (t.kind !== 'mint') continue;
    if (t.b5 === 'B1' && ENEMY[e.kind].elite) { state.gold += 50; continue; }
    if (t.b3 !== 'B') continue;
    if (distTo(t, e) > towerRange(t)) continue;
    if (t.b5 === 'B2' && Math.random() < 0.25) state.essence++;
    else state.gold += t.star;   // 고정 +1 이면 성급을 올릴 이유가 없다
  }

  // 연출은 맨 끝이다. 전이·징수·정산보다 앞에 두면 그중 하나가 터졌을 때
  // 연출만 남고 정산이 빠진 상태가 된다. e.dead 가드보다 뒤인 것도 중요하다 —
  // 파열(A1)이 applyStacks 안에서 damage 를 다시 부르므로 앞에 두면 두 번 터진다.
  spawnKillFx(e, type);
  // 잔상은 파편과 같은 자리에서 난다. 적은 이 프레임 끝(updateCombat 의 filter)에
  // 배열에서 빠지므로, 죽어가는 그림을 남기려면 여기서 별도 목록으로 옮겨야 한다.
  // 관문 도달은 killEnemy 를 아예 안 부르므로 이 한 줄만으로 누수에는 잔상이 안 난다.
  spawnCorpse(e);
  // 충격 등급: 정예 처치만 화면을 흔들고 시간을 멈춘다. 일반 처치는 아무것도
  // 안 낸다 — 처치가 연쇄하는 구간에서 매번 멎으면 배속이 무의미해진다.
  // 자리는 spawnKillFx 와 같은 맨 끝이다. 위 주석의 이유가 그대로 적용된다.
  // 소리(2.9)는 흔들림과 달리 **일반 처치에도 낸다.** 2.8 이 일반 처치를 뺀 근거는
  // "초당 수십 번 얼어붙으면 배속이 무의미해진다"였고 그 비용은 시간축에 있었다.
  // 소리에는 그 비용이 없고, 밀도는 kill 큐의 쿨다운이 초당 6.7회로 자른다.
  // 등급은 kill / killBig 두 큐와 sfx() 안의 마스킹으로 그대로 유지된다.
  if (ENEMY[e.kind].elite) { bumpShake(KILL_SHAKE_AMP, KILL_SHAKE_DUR); bumpHitstop(); sfx('killBig'); }
  else sfx('kill');
}

function applyStacks(e, n, per, src) {
  const s = debuffScale(e, src);
  if (s <= 0) return;
  const cap = (src.b3 === 'B' ? 6 : 3) * src.star;
  e.armorPer = per;
  e.armorCap = Math.max(e.armorCap || 0, cap);
  e.armorStacks = Math.min(cap, e.armorStacks + n * s);
  e.armorFed = true;   // 이번 프레임에 오라가 닿았다

  // 방깎만으로는 방어력 0~5 인 적(8종 중 4종)에게 아무 일도 안 일어난다.
  // 침식자가 마방에서 겪은 것과 같은 구멍이고, 답도 같다 — 감소는 중갑·정예
  // 카운터로 남기고 범용 가치는 취약으로 따로 준다. 계수 모양(0.03 + 0.02*성급)을
  // 침식자와 같게 두는 것은 두 오라가 한 규칙을 쓴다는 뜻이다. 분기 배수는 안 붙인다
  // — 분기는 스택당 방깎·상한·범위에서 이미 갈리고, 여기는 그 분기와 무관하게
  // "절반의 적에게 무효"를 메우는 자리다.
  e.physVuln = Math.max(e.physVuln || 0, (0.03 + 0.02 * src.star) * CFG.SHRED_VULN * s);

  // 파열: 상한 도달 시 스택을 태워 폭발
  if (src.b5 === 'A1' && e.armorStacks >= cap) {
    const blast = e.armorStacks * 5.0 * STAR_MULT[src.star] * 0.1;
    e.armorStacks = 0;
    damage(e, blast, 'physical', src);
  }
}

function enemiesInRange(t) {
  const r = towerRange(t);
  return state.enemies.filter(e => !e.dead && distTo(t, e) <= r);
}

function fireTower(t, dt) {
  const k = KINDS[t.kind];

  // ── 오라 ──
  // 디버프는 때려서 거는 게 아니라 타워 주변에 상시로 깔린다.
  // 배치 위치가 곧 디버프 범위라서, 어디에 놓느냐가 성능이 된다.

  if (t.kind === 'shredder') {
    const per = t.b3 === 'B' ? 2.4 : 1.2;
    const rate = 1.5;                   // 초당 쌓이는 스택                   // 초당 쌓이는 스택
    for (const e of enemiesInRange(t)) applyStacks(e, rate * dt, per, t);
  }

  if (t.kind === 'frost') {
    const amt = t.b3 === 'B' ? 0.55 : 0.30;
    // 딜도 장판이다. 단일 빔이면 오라 타워인지 딜러인지 안 읽힌다.
    // 사거리 안 전원에게 동시에 들어가므로 단일 DPS 보다 훨씬 세다 → 계수로 깎는다.
    // 장판 딜은 총량이 고정이고 범위 안 인원수로 나눈다.
    // 인원수 상한을 두면 "범위 안인데 안 맞는 적"이 생기고, 누가 맞는지가
    // 스폰 순서라 눈으로 못 읽는다. 총량 고정이면 군집에서 박격포를 먹지도 않는다.
    const list = enemiesInRange(t);
    const each = list.length ? towerDmg(t) / towerCd(t) * CFG.FROST_FIELD / list.length : 0;
    for (const e of list) {
      damage(e, each * dt, 'magic', t, true);
      const s = debuffScale(e, t);
      if (s <= 0) continue;
      e.slowNext = Math.max(e.slowNext, amt * s);
      // 결빙은 오라 안에 머문 시간으로 쌓인다
      if (t.b3 === 'B') {
        e.frostStacks = (e.frostStacks || 0) + dt;
        if (e.frostStacks >= 2.5) { e.frostStacks = -2.5; freeze(e, 1, t); }
      }
    }
  }

  // 침식자와 조폐소 이자는 오라/지속형이라 쿨다운 밖에서 처리한다
  if (t.kind === 'eroder') {
    const mult = t.b3 === 'A' ? 0.7 : t.b3 === 'B' ? 2 : 1;
    const cut = (0.06 + 0.02 * t.star) * mult;
    // 마방 감소만으로는 마방 0인 적(8종 중 4종)에게 아무 일도 안 일어난다.
    // 감소는 마갑 카운터로 남기고, 범용 가치는 마법 취약으로 따로 준다.
    const vuln = (0.03 + 0.02 * t.star) * mult;
    for (const e of enemiesInRange(t)) {
      const s = debuffScale(e, t);
      if (s > 0) {
        e.mresCut = Math.max(e.mresCut, cut * s);
        e.magicVuln = Math.max(e.magicVuln, vuln * s);
        e.healCut = 0.5;
        if (t.b5 === 'A1') { e.plagueT = 3; e.plagueCut = cut * s; e.plagueVuln = vuln * s; }
        if (t.b5 === 'A2') e.slowNext = Math.max(e.slowNext, 0.15 * s);
      }
      if (t.b3 === 'B') e.inDeepAura = true;
      if (t.b5 === 'B2') damage(e, e.maxHp * 0.010 * dt, 'pure', t, true);
    }
  }

  if (t.kind === 'mint') return;

  t.cd -= dt;
  if (t.cd > 0) return;

  const targets = enemiesInRange(t);
  if (!targets.length) { if (t.kind === 'marksman') t.streak = 0; return; }

  t.cd = towerCd(t);
  // 총구 화염은 여기서 세우지 않는다. 서리탑은 바로 아래에서 아무것도 안 쏘고
  // 빠져나가므로(딜은 위 장판에서 이미 나갔다) 여기 두면 발사 안 한 타워가 화염만 낸다.
  const dmg = towerDmg(t);
  const type = dmgType(t);

  if (t.kind === 'shredder') {
    muzzle(t, targets[0].x + 0.5, targets[0].y + 0.5);
    damage(targets[0], dmg, type, t);
    beam(t, targets[0]);
    return;
  }

  if (t.kind === 'eroder') {
    const e = targets[0];
    muzzle(t, e.x + 0.5, e.y + 0.5);
    damage(e, dmg, type, t);
    beam(t, e);
    return;
  }

  if (t.kind === 'frost') return;   // 딜은 위 장판에서 이미 나갔다

  if (t.kind === 'mortar') {
    const c = towerCenter(t);
    const radius = 0.8 * (t.b3 === 'A' ? 0.8 : t.b3 === 'B' ? 1.4 : 1);
    const shots = t.b5 === 'A1' ? 3 : 1;
    // 탄막(A1)은 3발을 **경로를 따라** 늘어놓는다. 원래는 targets[0]/[1]/[2] 로 서로
    // 다른 적을 겨냥하고 거기에 가로 ±0.6칸 지터를 한 번 더 얹었는데(이중 분산),
    // **그 둘은 원인이 아니었다.** 지터만 빼도 w25 넘김이 4/12 그대로였고, 3발을 아예
    // 한 점에 모아 헛발을 0 으로 만들어도 4/12 였다. 뿌리는 방식은 범인이 아니다.
    //
    // 진짜 원인은 `dmg / shots` 다. 발당 1/3 딜 x 3발이면 **탄막의 딜 총합이 무분기
    // 1발과 정확히 같다.** 방어력이 곱연산(applyArmor)이라 쪼개도 손해는 없지만 이득도
    // 없어서, 탄막은 어떻게 뿌리든 무분기를 넘어설 수 없는 5성이었다 — 가장 좋은 경우가
    // 본전이고 한 발이라도 빈 칸에 떨어지면 그만큼 손해다. 같은 A 분기의 소이(A2)가
    // 1발 풀딜 + 3초 장판(dmg*0.5/s = 총 1.5발분)까지 받는 것과 나란히 두면, 탄막만
    // 상한이 1.0배에 걸려 있었다. DPS 표에서 소이와 똑같이 43 으로 보였던 건 3발을
    // 전부 명중으로 세었기 때문이고, 실전 절반은 거기서 갈렸다.
    //
    // 그래서 고친 것은 뿌리는 방식이 아니라 **발당 계수**다. 0.6 x 3 = 1.8발분을 주되,
    // 3발을 경로 위 -GAP / 0 / +GAP 에 놓아 **줄지어 오는 직선을 덮게** 한다 —
    // KINDS.mortar.how 가 원래 약속하던 그림이고, 간격 1.2 는 A 반경 0.64 의 지름
    // 1.28 에 맞춘 값이라 세 폭발이 거의 안 겹치고 경로 2.6칸이 연속으로 덮인다.
    // 줄이 꽉 차면 1.8배, 적이 하나뿐이면 0.6배다. 「군집에 강하고 단일에 약함」이
    // 계수가 아니라 **배치**에서 나오므로 blurb 와 how 를 그대로 지킨다.
    //
    // 계수는 손으로 안 맞췄다. 스테이지4 · 덱 박격/서리/침식 · 12판으로 재서
    // 0.45 → 6/12, 0.5 → 8/12, 0.6 → 12/12 였고, 시드를 갈아 끼운 홀드아웃 24판에서도
    // 0.6 이 22/24 로 순위가 같았다(소이 24/24, 손 안 댄 탄막 11/24). 간격도 0.9/1.2/1.5
    // 를 쟀고 1.2 가 가장 높았다. 반경 -20% 를 A1 에서만 되돌리는 안(계수 0.5 + 반경
    // 1.25배)은 홀드아웃 20/24 로 더 낮았고, A 분기가 약속한 반경 페널티를 5성에서
    // 몰래 취소하는 셈이라 버렸다.
    const aim = targets[0];
    // 착탄 지연만큼 앞을 겨냥한다. 그래도 질주몹은 놓치는데, 그게 의도된 약점이다.
    const base = aim.dist + enemySpeed(aim) * 0.5;
    for (let i = 0; i < shots; i++) {
      const lead = posAt(base + (shots > 1 ? (i - 1) * CFG.BARRAGE_GAP : 0), aim.lane);
      // 화염은 발사 1회에 하나다. 탄막(A1)의 3발은 한 번의 발사라, 발마다 내면
      // 같은 자리에서 세 번 겹쳐 밝기만 세 배가 된다.
      if (i === 0) muzzle(t, lead.x + 0.5, lead.y + 0.5);
      state.shells.push({
        x: c.x, y: c.y, tx: lead.x + 0.5, ty: lead.y + 0.5,
        t: 0, tt: 0.5, tower: t.id,
        dmg: dmg * (shots > 1 ? CFG.BARRAGE_SHARE : 1), radius,
      });
    }
    return;
  }

  if (t.kind === 'marksman') {
    targets.sort((a, b) => b.hp - a.hp);
    // HP 최고를 **매 발** 다시 고르면 관측소는 연속타격을 원리적으로 못 쌓는다.
    // 자기가 방금 깎은 놈이 그만큼 HP 가 내려가 다음 발에는 다른 놈이 1위가 되므로,
    // 표적이 계속 갈리고 streak 이 1 로 리셋된다. 실측 평균 1.21(최대 5) — 설계 최대
    // +40% 인 속사 딜 보너스가 +9.7% 로만 나오고, 표식(A1)의 「5연타 시 전체 딜 +20%」는
    // 시간의 3% 만 켜졌다. 그래서 A 계열 기여도가 −1.51 로 혼자 음수였다.
    // 수치(streak 계수 8%)로 메우면 3% 확률로 터지는 5연타만 4배가 되어 분산만 커진다.
    // 고칠 것은 계수가 아니라 조건이다 — **직전 표적이 아직 사거리 안에 살아 있으면
    // 그놈을 계속 노린다.** 사거리 이탈·사망은 targets(= enemiesInRange, !dead)에서
    // 빠지므로 find 가 undefined 를 내고 자동으로 재조준된다. 새로 고를 때의 규칙은
    // 그대로 HP 최고다 — 바뀐 것은 "고르는 기준"이 아니라 "언제 다시 고르는가"다.
    const held = targets.find(e => e.id === t.lastTarget);
    const main = held || targets[0];
    muzzle(t, main.x + 0.5, main.y + 0.5);
    t.streak = (t.lastTarget === main.id) ? (t.streak || 0) + 1 : 1;
    t.lastTarget = main.id;

    let d = towerDmg(t);
    if (t.b3 === 'B' && Math.random() < 0.25) d *= 2;

    // 관통사격(B2)은 main 이 반드시 첫 칸이라야 한다. HP 정렬 상위 4개를 그대로
    // 쓰면 표적을 유지하는 동안 main 이 5위 밖으로 내려가는 순간 총구·빔이 겨눈 적이
    // 피해 목록에서 빠진다 — 겨냥한 놈만 안 맞는 그림이 된다.
    const hits = t.b5 === 'B2' ? [main, ...targets.filter(e => e !== main)].slice(0, 4) : [main];
    for (const e of hits) {
      // 즉사 2경로도 빔은 그린다. 안 그리면 총구 화염만 나고 선이 없는 채로
      // 적이 터져서 "무엇이 죽였는지"가 화면에서 끊긴다.
      // 빔을 죽인 **뒤에** 부르는 게 중요하다 — beam() 이 e.dead 를 보고 여파를
      // 빼므로, 이 순서라야 "죽은 적에는 스파크가 없다"가 정상 킬과 같은 한 규칙이
      // 된다. 딜·판정·killEnemy 인자는 그대로고 연출 호출 하나가 뒤에 붙었다.
      if (t.b5 === 'B1' && !ENEMY[e.kind].elite && e.hp / e.maxHp <= 0.18) { killEnemy(e, t, type); beam(t, e); continue; }
      if (t.t7 === 'execute' && !ENEMY[e.kind].elite && e.hp / e.maxHp <= 0.12) { killEnemy(e, t, type); beam(t, e); continue; }
      damage(e, d, type, t);
      beam(t, e);
    }
    if (t.b5 === 'A1' && t.streak >= 5) main.markT = 2.5;
    return;
  }

  if (t.kind === 'arc') {
    const c = towerCenter(t);
    const r = towerRange(t);

    // 사거리 안의 적 하나하나를 향해 쏴 보고, 가장 많이 꿰는 방향을 고른다.
    // 각도를 배치 시점에 고정해 봤더니 "겨냥한 놈한테 안 쏜다"로만 읽혔다.
    let dir = null, hit = [];
    for (const aim of targets) {
      const ax = aim.x + 0.5 - c.x, ay = aim.y + 0.5 - c.y;
      const len = Math.hypot(ax, ay) || 1;
      const dx = ax / len, dy = ay / len;
      const line = [];
      for (const e of state.enemies) {
        if (e.dead) continue;
        const vx = e.x + 0.5 - c.x, vy = e.y + 0.5 - c.y;
        const proj = vx * dx + vy * dy;
        if (proj < 0 || proj > r) continue;
        if (Math.abs(vx * dy - vy * dx) > BEAM_HALF) continue;
        line.push(e);
      }
      if (line.length > hit.length) { hit = line; dir = { dx, dy }; }
    }
    if (!dir) { t.cd = 0; t.flash = 0; return; }
    t.angle = Math.atan2(dir.dy, dir.dx);

    const limit = t.b3 === 'B' ? Infinity : 5;
    for (const e of hit.slice(0, limit)) {
      damage(e, dmg, type, t);
      if (t.b5 === 'A2' && debuffScale(e, t) > 0)
        e.arcResonance = Math.min(0.25, (e.arcResonance || 0) + 0.05);
    }

    // 연쇄: 맞은 적에서 옆으로 튄다
    if (t.b5 === 'A1' && hit.length) {
      let cur = hit[0], jumped = new Set(hit.map(e => e.id));
      for (let j = 0; j < 3; j++) {
        let best = null, bd = 2.0;
        for (const e of state.enemies) {
          if (e.dead || jumped.has(e.id)) continue;
          const d2 = Math.hypot(e.x - cur.x, e.y - cur.y);
          if (d2 < bd) { bd = d2; best = e; }
        }
        if (!best) break;
        jumped.add(best.id);
        damage(best, dmg * 0.7, type, t);
        cur = best;
      }
    }
    // 방향이 정해진 뒤라야 화염이 라인과 같은 쪽을 본다.
    muzzle(t, c.x + dir.dx, c.y + dir.dy);
    state.beams.push({ x1: c.x, y1: c.y, x2: c.x + dir.dx * r, y2: c.y + dir.dy * r, t: 0.16, wide: true });
    return;
  }
}

function freeze(e, dur, src) {
  if (debuffScale(e, src) <= 0) return;
  e.frozen = Math.max(e.frozen, dur);
  if (src.b5 === 'B2') e.pendingVuln = true;
  if (src.b5 === 'B1') {
    let n = 0;
    for (const o of state.enemies) {
      if (o === e || o.dead || o.frozen > 0) continue;
      if (Math.hypot(o.x - e.x, o.y - e.y) > 1.5) continue;
      if (debuffScale(o, src) > 0) o.frozen = Math.max(o.frozen, 0.5);
      if (++n >= 2) break;
    }
  }
}

// 총구 화염. flash 만으로는 "타워 어딘가가 밝아졌다"까지밖에 안 읽혀서,
// 어느 쪽으로 쐈는지를 같이 저장한다. 발광점은 그릴 때 이 방향으로 민다.
// 발사한 타워만 부른다 — 서리탑(장판)과 조폐소(딜 0)는 부르지 않는다.
//
// mzShown 은 렌더 래치다. 배속은 update 를 여러 번 돌리므로 화염이 태어나서
// 죽는 일이 렌더 1프레임 사이에 통째로 벌어질 수 있다(아래 MUZZLE_LIFE 주석).
// 수명을 늘려 해결하려 들면 배속·프레임레이트마다 다른 값이 필요해지므로,
// "아직 한 번도 안 그려졌다"를 들고 있다가 그 프레임에 반드시 한 번 그린다.
function muzzle(t, tx, ty) {
  const c = towerCenter(t);
  const dx = tx - c.x, dy = ty - c.y;
  const len = Math.hypot(dx, dy) || 1;   // 적이 타워와 같은 칸이면 0 이 된다
  t.flash = MUZZLE_LIFE;
  t.mzDx = dx / len;
  t.mzDy = dy / len;
  t.mzShown = false;
  // 발사음(2.9). 총구 화염과 **같은 자리**다. 이 함수를 실제로 쏜 타워만 부르므로
  // 서리탑(장판)·조폐소(딜 0)·오라·장판·tick 딜 제외가 구조적으로 공짜가 된다 —
  // 2.7 이 화염에서 얻은 것과 같은 이득을 소리가 그대로 물려받는다.
  sfx('shot');
}

// 착탄 스파크는 beam() 안에서만 난다. 마력로는 beam() 을 안 쓰고 관통 라인을
// 직접 push 하므로, 여기 두는 것만으로 마력로가 구조적으로 빠진다 —
// 충전 2.5초짜리 한 발이 선 위 5마리를 동시에 꿰기 때문에 여파를 얹으면
// 라인 전체가 불꽃 띠가 되어 관통이 몇 마리를 꿰었는지가 오히려 안 보인다.
// damage() 에 !tick 으로 걸면 마력로 본체와 A1 연쇄가 그대로 통과한다.
//
// 죽은 적에는 여파를 안 낸다. 그 자리에 처치 파편 8~10개가 통째로 깔리는데
// 스파크 4개를 얹으면 "맞았다"와 "죽었다"가 한 덩어리가 된다. 즉사 2경로만
// 특별 취급하면 규칙이 그 두 줄에서만 지켜지고, damage() 가 인라인으로
// killEnemy() 를 부르는 훨씬 흔한 정상 킬에서 조용히 깨진다 —
// 그래서 호출부 플래그가 아니라 e.dead 하나로 잠갔다.
function beam(t, e) {
  const c = towerCenter(t);
  state.beams.push({ x1: c.x, y1: c.y, x2: e.x + 0.5, y2: e.y + 0.5, t: 0.09, color: KINDS[t.kind].color });
  if (!e.dead) spawnSparks(t, e);
}

function updateShells(dt) {
  const alive = [];
  for (const s of state.shells) {
    s.t += dt;
    if (s.t < s.tt) { alive.push(s); continue; }
    const t = state.towers.find(v => v.id === s.tower);
    if (!t) continue;
    for (const e of state.enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x + 0.5 - s.tx, e.y + 0.5 - s.ty) > s.radius) continue;
      damage(e, s.dmg, 'physical', t);
      if (t.b5 === 'B1' && debuffScale(e, t) > 0) e.stun = Math.max(e.stun, 0.3);
    }
    if (t.b5 === 'A2') state.patches.push({ x: s.tx, y: s.ty, r: s.radius, dps: s.dmg * 0.5, t: 3, tower: t.id });
    state.blasts.push({ x: s.tx, y: s.ty, r: s.radius, t: 0.25 });
    // 광역 중 화면을 흔드는 건 박격포 착탄뿐이다. 파쇄자 파열(A1)·마력로 연쇄(A1)·
    // 서리 장판·소이 장판은 제외한다 — 전부 발생 빈도가 훨씬 높아서 흔들면 상시가 된다.
    // 쿨다운을 여기서 재는 이유: 탄막(A1)은 한 프레임에 3발이 착탄하고, 연발(A) 7성은
    // cd 0.8초짜리가 여러 대다. 게이트가 없으면 착탄 흔들림이 끊기지 않는다.
    // 착탄음도 이 게이트 안이다. blast 큐가 자체 쿨다운을 안 두는 이유가 그것이다 —
    // 게이트를 공유하면 보이는 흔들림과 들리는 쿵이 항상 1:1 이라 "소리는 났는데
    // 안 흔들림"이 원리적으로 없다. BLAST_SHAKE_CD 를 소리 때문에 고치면 안 된다:
    // 그 값은 2.8 의 흔들림 듀티 근거다.
    if (shakeCd <= 0) { bumpShake(BLAST_SHAKE_AMP, BLAST_SHAKE_DUR); sfx('blast'); shakeCd = BLAST_SHAKE_CD; }
  }
  state.shells = alive;
}

function updatePatches(dt) {
  for (const p of state.patches) {
    p.t -= dt;
    const t = state.towers.find(v => v.id === p.tower);
    if (!t) continue;
    for (const e of state.enemies) {
      if (e.dead) continue;
      if (Math.hypot(e.x + 0.5 - p.x, e.y + 0.5 - p.y) > p.r) continue;
      damage(e, p.dps * dt, 'physical', t, true);
    }
  }
  state.patches = state.patches.filter(p => p.t > 0);
}

function updateCombat(dt) {
  state.hasHanpa = state.towers.some(t => t.kind === 'frost' && t.b5 === 'A1');

  // 프레임마다 재계산되는 오라 값 초기화
  for (const e of state.enemies) {
    e.armorFed = false;
    e.mresCut = e.plagueT > 0 ? e.plagueCut : 0;
    e.magicVuln = e.plagueT > 0 ? e.plagueVuln : 0;
    e.physVuln = 0;                 // 역병 같은 잔류 경로가 없어 조건 없이 0 이다
    e.healCut = 0;
    e.inDeepAura = false;
    e.slowNext = 0;
  }

  for (const t of state.towers) fireTower(t, dt);

  updateShells(dt);
  updatePatches(dt);

  // 동상: 슬로우 걸린 적에게 지속 순수딜
  for (const t of state.towers) {
    if (t.kind !== 'frost' || t.b5 !== 'A2') continue;
    for (const e of enemiesInRange(t)) {
      if (e.slowAmt > 0) damage(e, STAR_MULT[t.star] * 0.25 * dt, 'pure', t, true);
    }
  }

  state.enemies = state.enemies.filter(e => !e.dead);
}

// ═════════════════════════════════════════════════════════════
// 캔버스 / 레이아웃
// ═════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, cell: 0, ox: 0, oy: 0 };
const HUD_TOP = 100, HUD_BOTTOM = 150;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  view.w = window.innerWidth;
  view.h = window.innerHeight;
  canvas.width = Math.round(view.w * dpr);
  canvas.height = Math.round(view.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const padX = 10;
  const cellByW = (view.w - padX * 2) / CFG.BOARD_W;
  const cellByH = (view.h - HUD_TOP - HUD_BOTTOM) / CFG.BOARD_H;
  view.cell = Math.floor(Math.min(cellByW, cellByH));
  view.ox = Math.round((view.w - view.cell * CFG.BOARD_W) / 2);
  view.oy = HUD_TOP + Math.round((view.h - HUD_TOP - HUD_BOTTOM - view.cell * CFG.BOARD_H) / 2);
}
window.addEventListener('resize', resize);
resize();

function cellToPx(gx, gy) {
  return { x: view.ox + gx * view.cell, y: view.oy + gy * view.cell };
}
function pxToCell(px, py) {
  const gx = Math.floor((px - view.ox) / view.cell);
  const gy = Math.floor((py - view.oy) / view.cell);
  if (gx < 0 || gx >= CFG.BOARD_W || gy < 0 || gy >= CFG.BOARD_H) return null;
  return { gx, gy };
}

// ═════════════════════════════════════════════════════════════
// 입력
// ═════════════════════════════════════════════════════════════
const buttons = [];   // {x,y,w,h,label,fn,enabled}
let drag = null;      // {id, px, py, moved}

function layoutButtons() {
  buttons.length = 0;
  const pad = 12, gap = 8;
  const playing = state.phase !== 'over' && state.phase !== 'clear';

  // 맨 아래: 빨리 보내기 + 배속 + 일시정지. 뒤의 둘은 빨리 보내기와 달리
  // 웨이브 도중에도 눌린다 (긴 웨이브를 빠르게 넘기거나 멈추려는 용도라).
  const rushH = 44;
  const rushY = view.h - rushH - 12;
  const speedW = 54, pauseW = 48;
  buttons.push({
    x: pad, y: rushY, w: view.w - pad * 2 - gap * 2 - speedW - pauseW, h: rushH,
    label: () => state.phase !== 'build' ? '진행 중'
      : state.wave === 0 ? '시작' : '빨리 보내기',
    enabled: () => state.phase === 'build',
    fn: rushWave,
    quiet: true,
  });
  buttons.push({
    x: view.w - pad - pauseW - gap - speedW, y: rushY, w: speedW, h: rushH,
    label: () => 'x' + state.speed,
    enabled: () => true,
    fn: cycleSpeed,
    quiet: true,
  });
  buttons.push({
    x: view.w - pad - pauseW, y: rushY, w: pauseW, h: rushH,
    // 아이콘은 글리프 대신 도형으로 그린다. ❚❚ 나 ▶ 는 기기에 따라
    // 두부(□)로 떨어지는데, 이 버튼은 눌러 보기 전엔 뜻을 확인할 방법이 없다.
    icon: () => state.paused ? 'play' : 'pause',
    label: () => '',
    enabled: () => playing,
    fn: togglePause,
    quiet: true,
  });

  // 타워를 고르면 그 위에 판매/재선택이 뜬다
  const t = selectedTower();
  if (t) {
    const py = rushY - gap - 32;
    const bw = (view.w - pad * 2 - gap) / 2;
    buttons.push({
      x: pad, y: py, w: bw, h: 32,
      label: () => `판매  +${sellValue(t)}G`,
      enabled: () => true,
      fn: sellSelected,
      quiet: true,
    });
    buttons.push({
      x: pad + bw + gap, y: py, w: bw, h: 32,
      label: () => `분기 재선택  정수 1`,
      enabled: () => state.essence > 0 && t.star >= 3,
      fn: rechoose,
      quiet: true,
    });
  }
}

function selectedTower() { return state.towers.find(t => t.id === state.selected) || null; }
function sellValue(t) { return Math.round(10 * STAR_MULT[t.star] * (mergeIsFree() ? 1 : 0.4)); }

// 정수를 써서 이미 고른 분기를 다시 고른다. 편성이 바뀌어 빌드가 죽었을 때의 탈출구.
function rechoose() {
  const t = selectedTower();
  if (!t || state.essence <= 0) return;
  state.essence--;
  const tier = t.star >= 7 ? 7 : t.star >= 5 ? 5 : 3;
  if (tier === 3) { t.b3 = null; t.b5 = null; }
  else if (tier === 5) t.b5 = null;
  else t.t7 = null;
  openChoice(t, tier);
}

function hitButton(px, py) {
  return buttons.find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h);
}

// ═════════════════════════════════════════════════════════════
// 세이브
//
// 판 스냅샷은 웨이브 사이에만 찍는다. 웨이브 도중에 찍으려면 적·발사체·장판까지
// 다 넣어야 하는데, 어차피 합성도 준비 단계에서만 되므로 이어하기의 의미가 없다.
//
// 저장은 로컬이 먼저다. 로그인은 기기를 옮길 때 쓰는 것이지 없으면 못 하는 게 아니다.
// ═════════════════════════════════════════════════════════════
const SAVE_KEY = 'cant-hold-progress';
const SAVE_VERSION = 1;

let unlocked = 1;
let best = [];              // 스테이지별 최고 웨이브
let savedRun = null;        // 이어할 판. 없으면 null

// 판 스냅샷. 준비 단계가 아니면 찍지 않는다.
function snapshotRun() {
  if (state.phase !== 'build') return null;
  return {
    stage: state.stage,
    deck: state.deck.slice(),
    wave: state.wave,
    gold: Math.round(state.gold),
    essence: state.essence,
    life: state.life,
    openRows: state.openRows,
    summoned: state.summonedThisWave,
    towers: state.towers.map(t => ({
      x: t.gx, y: t.gy, k: t.kind, s: t.star,
      b3: t.b3, b5: t.b5, t7: t.t7, a: t.angle,
    })),
  };
}

// 스냅샷을 되살린다. 스테이지나 덱이 지금 규칙과 안 맞으면 통째로 버린다 —
// 어중간하게 복원하면 못 깨는 판이 만들어진다.
function restoreRun(r) {
  // 파편은 맨 먼저 비운다. 판을 갈아끼우는 함수가 어느 경로로 빠져나가든
  // 옛 판의 잔여물을 안 남기는 게 규칙이다 — 아래 배열들과 같은 취급인데
  // 성공 경로에만 두면 실패 반환 두 갈래에서만 규칙이 깨진다.
  // (감쇠가 돌고 있으면 0.3초 뒤 어차피 사라지지만, 그건 이 함수의 보장이 아니다.)
  resetParticles();
  resetCorpses();
  resetImpact();
  if (!r || !STAGES[r.stage]) return false;
  const deck = (r.deck || []).filter(k => KINDS[k]);
  if (deck.length !== CFG.DECK_SIZE) return false;

  loadStage(r.stage);
  state.deck = deck;
  state.deckPick = deck.slice();
  state.phase = 'build';
  state.paused = false;
  state.wave = Math.max(0, r.wave | 0);
  state.timer = CFG.WAVE_GAP;
  state.gold = Math.max(0, r.gold | 0);
  state.essence = Math.max(0, r.essence | 0);
  state.life = Math.max(1, r.life | 0);
  state.openRows = Math.min(CFG.BOARD_H, Math.max(CFG.OPEN_ROWS, r.openRows | 0));
  state.summonedThisWave = Math.max(0, r.summoned | 0);

  state.towers = (r.towers || [])
    .filter(t => KINDS[t.k] && t.s >= 1 && t.s <= CFG.STAR_MAX)
    .map(t => ({
      id: nextTowerId++, gx: t.x | 0, gy: t.y | 0, kind: t.k, star: t.s | 0,
      b3: t.b3 || null, b5: t.b5 || null, t7: t.t7 || null,
      cd: 0, angle: typeof t.a === 'number' ? t.a : -Math.PI / 2, flash: 0,
      streak: 0, lastTarget: null, arcKills: 0,
    }));

  state.enemies.length = 0;
  state.spawnQueue.length = 0;
  state.beams.length = 0;
  state.shells.length = 0;
  state.patches.length = 0;
  state.blasts.length = 0;
  state.selected = null;
  clearChoices();
  state.picker = null;
  return true;
}

function saveBundle() {
  return { v: SAVE_VERSION, unlocked, best: best.slice(), run: savedRun };
}

// 기록으로부터 해금을 다시 세운다. 판을 뒤에 붙였을 때 이미 깬 사람이 같은 판을
// 다시 깨는 일이 없어야 한다.
//
// 해금(:3107)은 「클리어한 판의 다음」을 열지만 `unlocked < STAGES.length` 로
// 막혀 있어서 **그때의 마지막 판을 깨도 아무것도 안 올린다.** 그래서 네 판 시절에
// 역류를 깬 사람은 unlocked 가 4 에 멈춰 있다. 5번을 붙이면 그 사람이 역류를 다시
// 깨야 하는데, 판을 붙일 때마다 같은 일이 반복된다 — 그래서 「4판을 깼으면 5번」
// 같은 일회성 조항이 아니라 **기록 전체를 훑는 규칙**으로 둔다. 6번째 판이 붙어도
// 이 함수는 그대로 맞는다.
//
// 단조성과 「안 깬 사람에게 안 열림」은 둘 다 지켜진다. `i` 를 깬 기록이 있을 때만
// `i + 2`(1-based 로 다음 판)까지 올리고, `Math.max` 라 내려가지 않는다.
//
// **best[i] 는 「깼다」가 아니라 「그 판에서 도달한 최고 웨이브」다.** 클리어
// 경로(:3112)와 게임오버 경로(:3172)가 같은 줄로 갱신하기 때문에,
// `best[i] >= waves` 가 뜻하는 것은 「마지막 웨이브까지 갔다」까지다 —
// **마지막 웨이브 도중에 죽은 사람도 여기 걸린다**(헤드리스로 재현했다:
// 역류 w30 에서 phase 가 'over' 인데 best[3] 은 30 이었다).
//
// 세이브에 클리어 여부를 따로 적은 적이 없어서 이보다 정확한 신호가 없다.
// 그래서 이 조항은 「그 판의 마지막 웨이브까지 간 사람」까지 열어 준다.
// 더 정확하게 하려면 세이브에 클리어 플래그를 새로 넣어야 하고 그건
// SAVE_VERSION 이 딸려 오는 별건이다.
function unlockFromRecord() {
  let u = unlocked;
  for (let i = 0; i < STAGES.length; i++)
    if ((best[i] || 0) >= STAGES[i].waves) u = Math.max(u, Math.min(STAGES.length, i + 2));
  return u;
}

function applyBundle(b) {
  if (!b) return;
  if (Number.isFinite(b.unlocked)) unlocked = Math.max(1, Math.min(STAGES.length, b.unlocked));
  if (Array.isArray(b.best)) best = b.best.map(v => (Number.isFinite(v) ? v : 0));
  if (b.run && STAGES[b.run.stage]) savedRun = b.run;
  // best 를 읽은 뒤라야 한다. SAVE_VERSION 은 안 올린다 — 이건 한 번 굽고 마는
  // 변환이 아니라 매 로드마다 다시 세우는 규칙이고, 올리는 방향으로만 움직여서
  // 몇 번을 돌려도 결과가 같다. 버전으로 한 번만 돌게 만들면 오히려 새 빌드를
  // 한 번도 안 켠 기기에서 동기화된 번들이 unlocked 4 로 되돌아온 뒤 규칙이
  // 다시는 안 걸린다.
  unlocked = unlockFromRecord();
}

// 어느 쪽이 더 나아간 기록인지 고른다. 세이브는 줄어들면 안 된다.
function mergeBundle(a, b) {
  if (!a) return b;
  if (!b) return a;
  const best2 = [];
  for (let i = 0; i < STAGES.length; i++)
    best2[i] = Math.max((a.best && a.best[i]) || 0, (b.best && b.best[i]) || 0);
  const pick = (x, y) => {
    if (!x) return y;
    if (!y) return x;
    // 더 뒤 스테이지, 같으면 더 뒤 웨이브
    if (x.stage !== y.stage) return x.stage > y.stage ? x : y;
    return (x.wave || 0) >= (y.wave || 0) ? x : y;
  };
  return {
    v: SAVE_VERSION,
    unlocked: Math.max(a.unlocked || 1, b.unlocked || 1),
    best: best2,
    run: pick(a.run, b.run),
  };
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    // 예전에는 해금 개수만 숫자로 넣었다
    if (/^\d+$/.test(raw)) return { v: 0, unlocked: parseInt(raw, 10), best: [], run: null };
    return JSON.parse(raw);
  } catch { return null; }
}

function saveLocal() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveBundle())); }
  catch { /* 저장 못 해도 게임은 돈다 */ }
}

// 로컬은 항상, 클라우드는 로그인했을 때만. 클라우드가 실패해도 판은 계속된다.
function persist() {
  saveLocal();
  if (typeof cloudSave === 'function') cloudSave();
}

// 계정 (선택)
//
// 스튜디오 공용 Firebase 프로젝트를 쓴다. 게임들이 같은 오리진에 있어서

//
// config 값은 공개돼도 되는 식별자다 — 실제 접근 통제는 Firestore 보안 규칙이 한다.
// 규칙은 README 의 "계정" 절에 있고, 콘솔에서 사람이 넣어야 한다.
//
// 로그인은 기기를 옮길 때 쓰는 것이지 없으면 못 하는 게 아니다. SDK 를 못 받아와도,
// 로그인을 안 해도 게임은 로컬 저장만으로 끝까지 돌아간다.

const FIREBASE_CONFIG = {

};
const SAVE_PATH = 'games/canthold/saves';
const SDK = 'https://www.gstatic.com/firebasejs/11.0.2/';

const cloud = { ready: false, user: null, busy: false, msg: '', ok: null };
let cloudLoading = null;             // SDK 를 받아오는 중인 약속

// 팝업은 사용자가 누른 그 순간에 열어야 브라우저가 막지 않는다. SDK 를 클릭 뒤에
// 받아오면 그 사이에 제스처가 끊겨서 첫 클릭은 아무 일도 안 일어나고 두 번째부터
// 열린다. 그래서 화면을 처음 건드릴 때 미리 받아 둔다.
function cloudPreload() {
  if (fb || cloudLoading) return;
  cloudLoading = cloudInit().catch(() => { cloudLoading = null; });
}
let fb = null;                       // { auth, db, doc, getDoc, setDoc, ... }

async function cloudInit() {
  if (fb) return fb;
  const [{ initializeApp }, authMod, dbMod] = await Promise.all([
    import(SDK + 'firebase-app.js'),
    import(SDK + 'firebase-auth.js'),
    import(SDK + 'firebase-firestore.js'),
  ]);
  const app = initializeApp(FIREBASE_CONFIG);
  fb = {
    auth: authMod.getAuth(app),
    db: dbMod.getFirestore(app),
    GoogleAuthProvider: authMod.GoogleAuthProvider,
    signInWithPopup: authMod.signInWithPopup,
    signOut: authMod.signOut,
    onAuthStateChanged: authMod.onAuthStateChanged,
    doc: dbMod.doc, getDoc: dbMod.getDoc, setDoc: dbMod.setDoc,
    serverTimestamp: dbMod.serverTimestamp,
  };
  fb.onAuthStateChanged(fb.auth, async u => {
    cloud.user = u;
    cloud.ready = true;
    if (u) await cloudPull();
  });
  return fb;
}

// 로그인하면 서버 것과 로컬 것을 합친다. 어느 쪽도 줄어들면 안 된다.
async function cloudPull() {
  if (!fb || !cloud.user) return;
  try {
    cloud.busy = true;
    const snap = await fb.getDoc(fb.doc(fb.db, SAVE_PATH, cloud.user.uid));
    const remote = snap.exists() ? snap.data() : null;
    const merged = mergeBundle(saveBundle(), remote);
    applyBundle(merged);
    savedRun = merged.run || null;
    saveLocal();
    await cloudSave();
    if (cloud.ok !== false) cloud.msg = '기록을 불러왔다';
  } catch (e) {
    cloud.ok = false;
    cloud.msg = String((e && e.code) || e).includes('permission')
      ? '읽기 거부됨 — 서버 규칙을 확인해야 한다'
      : '기록을 못 불러왔다';
  } finally {
    cloud.busy = false;
  }
}

// 실패를 삼키면 안 된다. 규칙이 안 올라가 있으면 로그인은 되는데 저장만 조용히
// 실패하고, 기기를 바꾼 뒤에야 알게 된다. 결과를 화면에 남긴다.
async function cloudSave() {
  if (!fb || !cloud.user) return;
  try {
    await fb.setDoc(fb.doc(fb.db, SAVE_PATH, cloud.user.uid),
      { ...saveBundle(), updatedAt: fb.serverTimestamp() });
    cloud.ok = true;
    cloud.msg = '클라우드에 저장됨';
  } catch (e) {
    cloud.ok = false;
    const code = String((e && e.code) || e);
    cloud.msg = code.includes('permission')
      ? '저장 거부됨 — 서버 규칙을 확인해야 한다'
      : '저장 실패 — 이 기기에만 남는다';
  }
}

async function cloudToggle() {
  if (cloud.busy) return;

  // 아직 안 받아왔으면 팝업을 열지 않는다. 여기서 기다렸다 열면 브라우저가
  // 사용자 제스처로 안 쳐줘서 조용히 막힌다 — 눌렀는데 아무 일도 없는 그 증상이다.
  if (!fb || !cloud.ready) {
    cloud.busy = true;
    cloud.msg = '연결 중…';
    cloudPreload();
    try { await cloudLoading; } catch { /* 아래에서 처리 */ }
    // 세션 복구는 SDK 로드와 별개로 한 박자 더 걸린다. 그 사이에 팝업을 열면
    // 이미 로그인된 사람에게 또 로그인을 시키게 된다.
    for (let i = 0; i < 40 && fb && !cloud.ready; i++)
      await new Promise(r => setTimeout(r, 50));
    cloud.busy = false;
    cloud.msg = !fb ? '연결 실패 — 잠시 뒤 다시'
      : cloud.user ? '' : '준비됐다 — 다시 누르면 로그인';
    return;
  }

  cloud.busy = true;
  cloud.msg = '';
  try {
    if (cloud.user) {
      await cloudSave();
      await fb.signOut(fb.auth);
      cloud.ok = null;
      cloud.msg = '로그아웃했다';
    } else {
      await fb.signInWithPopup(fb.auth, new fb.GoogleAuthProvider());
    }
  } catch (e) {
    const code = String((e && e.code) || e);
    cloud.msg = code.includes('popup-blocked') ? '브라우저가 로그인 창을 막았다 — 팝업을 허용해야 한다'
      : code.includes('popup') || code.includes('cancelled') ? '로그인 창이 닫혔다'
      : '로그인 실패';
  } finally {
    cloud.busy = false;
  }
}

// ── 스테이지 선택 ────────────────────────────────────────────

function stageCardRects() {
  const pad = 16, top = 132, gap = 12;
  const n = STAGES.length;
  // 아래에 이어하기와 로그인 줄이 들어간다
  //
  // **하한 72 는 카드 안이 안 깨지는 최소 높이다.** 셋째 줄(난이도 점)이 `y + 58`
  // 에 11px 로 그려지므로 내용 바닥이 69 이고, 여백 3 을 더한 값이다. 판이 넷일
  // 때는 이 식이 594 까지 버텨서 하한이 필요 없었는데, **다섯 장이 되며 한계선이
  // 675 로 올라가 375x667(iPhone SE·8)이 처음으로 걸렸다** — 67.4 가 나와 난이도
  // 점이 카드 밖에 그려졌다. 하한이 없으면 판을 붙일 때마다 같은 일이 난다.
  // (하한에 걸리면 카드가 화면 아래로 밀려날 수 있다. 그건 tools/test.js
  //  「좁은 화면에서도 스테이지 카드가 안 깨진다」가 잡는다.)
  const h = Math.max(72, Math.min(88, (view.h - top - 150 - (n - 1) * gap) / n));
  return STAGES.map((def, i) => ({ i, def, x: pad, y: top + i * (h + gap), w: view.w - pad * 2, h }));
}

function drawStageSelect() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.textBaseline = 'top';

  ctx.fillStyle = '#e6edf3';
  ctx.font = '700 22px system-ui, sans-serif';
  ctx.fillText('스테이지', 16, 44);
  ctx.fillStyle = '#8b949e';
  fitText('맵마다 좋은 자리가 다르다. 깨면 다음이 열린다.', 16, 78, view.w - 32, 13);
  ctx.fillStyle = '#6e7681';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText(`${unlocked} / ${STAGES.length} 해금`, 16, 100);

  for (const r of stageCardRects()) {
    const open = r.i < unlocked;
    ctx.fillStyle = open ? '#161b22' : '#111519';
    ctx.strokeStyle = open ? '#30363d' : '#21262d';
    ctx.lineWidth = 1.5;
    roundRect(r.x, r.y, r.w, r.h, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = open ? '#e6edf3' : '#484f58';
    ctx.font = '700 16px system-ui, sans-serif';
    ctx.fillText(`${r.i + 1}. ${r.def.name}`, r.x + 16, r.y + 12);

    ctx.fillStyle = open ? '#8b949e' : '#3d444d';
    fitText(open ? r.def.desc : '이전 스테이지를 깨야 열린다', r.x + 16, r.y + 36, r.w - 32, 12);

    ctx.fillStyle = open ? '#6e7681' : '#3d444d';
    // hpMult 를 그대로 보여주면 오해한다. 레인이 갈리면 배율이 1 미만이어도
    // 타워가 한쪽만 커버해서 더 어렵다. 그래서 순서대로 난이도를 매긴다.
    fitText(
      `${'●'.repeat(r.i + 1)}${'○'.repeat(STAGES.length - r.i - 1)}   웨이브 ${r.def.waves}   ` +
      (r.def.lanes.length > 1 ? `갈래 ${r.def.lanes.length}` : '한 갈래'),
      r.x + 16, r.y + 58, r.w - 32, 11);
  }
  // 이어하기. 웨이브 사이 스냅샷이 있을 때만 뜬다.
  if (savedRun) {
    const r = resumeRect();
    const st = STAGES[savedRun.stage];
    ctx.fillStyle = '#1b2b1f';
    ctx.strokeStyle = '#3fb950';
    ctx.lineWidth = 2;
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#e6edf3';
    ctx.font = '700 15px system-ui, sans-serif';
    ctx.fillText('이어하기', r.x + 16, r.y + 11);
    ctx.fillStyle = '#8b949e';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText(`${st ? st.name : ''} · 웨이브 ${savedRun.wave} · 타워 ${(savedRun.towers || []).length}`,
      r.x + 16, r.y + 31);
  }

  // 로그인. 없어도 게임은 돌고, 기기를 옮길 때만 필요하다.
  {
    const r = cloudRect();
    ctx.fillStyle = '#161b22';
    ctx.strokeStyle = '#30363d';
    ctx.lineWidth = 1.5;
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = cloud.user ? '#7ee787' : (!cloud.ready && cloudLoading) ? '#6e7681' : '#8b949e';
    ctx.font = '600 13px system-ui, sans-serif';
    // 새로고침 직후에는 세션이 살아 있어도 SDK 가 올라오기 전이라 아직 모른다.
    // 그때 "로그인" 이라고 써 두면 풀린 것처럼 보인다.
    const label = cloud.busy ? '연결 중…'
      : cloud.user ? `${cloud.user.displayName || '로그인됨'} · 로그아웃`
      : !cloud.ready && cloudLoading ? '로그인 확인 중…'
      : '구글로 로그인 — 다른 기기에서 이어하기';
    ctx.fillText(label, r.x + r.w / 2, r.y + r.h / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    if (cloud.msg) {
      ctx.fillStyle = cloud.ok === false ? '#f85149' : cloud.ok ? '#7ee787' : '#6e7681';
      ctx.font = '11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(cloud.msg, view.w / 2, r.y + r.h + 6);
      ctx.textAlign = 'left';
    }
  }

  ctx.textAlign = 'left';
}

function resumeRect() {
  const pad = 16, b = stageCardRects();
  const y = b.length ? b[b.length - 1].y + b[b.length - 1].h + 14 : 400;
  return { x: pad, y, w: view.w - pad * 2, h: 52 };
}
function cloudRect() {
  const r = resumeRect();
  return { x: r.x, y: r.y + r.h + 10, w: r.w, h: 42 };
}

function resumeRun() {
  if (!savedRun) return;
  if (!restoreRun(savedRun)) { savedRun = null; persist(); toast('이어할 수 없는 기록'); return; }
  state.selected = null;
}

function pickStage(i) {
  if (i >= unlocked) { toast('아직 잠김'); return; }
  loadStage(i);
  state.phase = 'deck';
  state.deckPick = [];
}

// ── 빈 칸 탭 → 소환 ───────────────────────────────────────────
// 두 단계로 묻는다.
//   1단계  뭘 세울지 고른다 (사거리는 아직 안 그린다)
//   2단계  고른 것의 사거리만 보여주고 배치할지 다시 묻는다
// 후보 셋의 범위를 한꺼번에 겹쳐 그리면 어느 원이 누구 건지 못 읽는다.
const PICKER_ACT_H = 44;

function pickerLayout() {
  if (!state.picker) return null;
  // 배치 모드는 카드가 없다(무엇을 놓을지는 이미 정해졌다). 액션 둘의 자리도 대상 칸을
  // 안 따라간다 — sel 이 탭마다 움직이는데 버튼까지 따라 움직이면 다음 탭이 어긋난다.
  if (state.picker.mode === 'mergePlace') {
    const w = Math.min(300, view.w - 40), gap = 8;
    const x = (view.w - w) / 2, bw = (w - gap) / 2;
    const y = view.h - HUD_BOTTOM - PICKER_ACT_H - 12;
    return { cards: [], actions: [
      { act: 'cancel', x, y, w: bw, h: PICKER_ACT_H },
      { act: 'place', x: x + bw + gap, y, w: bw, h: PICKER_ACT_H },
    ] };
  }
  const deck = state.deck.length ? state.deck : KIND_KEYS.slice(0, CFG.DECK_SIZE);
  // 카드 한 장에 세 줄(이름 / 뭐냐 / 어디에 놓냐)이 들어간다. 고르는 자리에서
  // 쓰는 법이 안 보이면 이름과 사거리만 보고 찍게 된다.
  const w = Math.min(300, view.w - 40), h = 66, gap = 8;
  const actH = state.picker.kind ? PICKER_ACT_H + 10 : 0;
  const total = deck.length * h + (deck.length - 1) * gap + actH;
  const x = (view.w - w) / 2;

  // 대상 칸을 가리면 안 된다. 아래에 안 들어가면 칸 위로 올린다.
  const cellTop = view.oy + state.picker.gy * view.cell;
  const bottomLimit = view.h - HUD_BOTTOM - total - 6;
  let y = cellTop + view.cell + 12;
  if (y > bottomLimit) y = cellTop - 12 - total;
  y = Math.max(HUD_TOP + 28, Math.min(y, bottomLimit));

  const cards = deck.map(k => {
    const r = { k, x, y, w, h };
    y += h + gap;
    return r;
  });

  let actions = [];
  if (state.picker.kind) {
    const bw = (w - gap) / 2;
    actions = [
      { act: 'cancel', x, y: y + 2, w: bw, h: PICKER_ACT_H },
      { act: 'place', x: x + bw + gap, y: y + 2, w: bw, h: PICKER_ACT_H },
    ];
  }
  return { cards, actions };
}

function pickerRects() { const L = pickerLayout(); return L ? L.cards : []; }

function pickerHit(px, py) {
  const L = pickerLayout();
  if (!L) return null;
  const inside = r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  return L.actions.find(inside) || L.cards.find(inside) || null;
}

// 2x2 결과를 어디에 놓을지 고르는 화면. 소환 피커와 두 곳이 다르다.
//   ① 딤이 보드 위에서 훨씬 옅다 — 고를 대상이 후보 칸 자체라, 소환의 0.78 을
//      그대로 쓰면 골라야 할 것이 통째로 묻힌다. 보드 밖은 그대로 0.78 이다
//   ② 카드가 없다. 무엇을 놓을지는 이미 정해졌고 남은 물음은 자리 하나뿐이다
// 흔들림은 안 탄다 — 2.8 이 "클립 밖(소환 피커 포함)은 안 흔들린다" 로 정한 그대로다.
// 합성은 준비 단계에서만 되므로(mergeAllowed) 흔들림원 자체가 사실상 없다.
function drawMergePlacePicker(L) {
  const p = state.picker;
  const a = state.towers.find(t => t.id === p.aId);
  const b = state.towers.find(t => t.id === p.bId);
  if (!a || !b || !p.sel) return;

  const { cell } = view;
  const bx = view.ox, by = view.oy, bw = cell * CFG.BOARD_W, bh = cell * CFG.BOARD_H;
  ctx.fillStyle = 'rgba(13,17,23,0.26)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(13,17,23,0.78)';
  ctx.fillRect(0, 0, view.w, by);
  ctx.fillRect(0, by + bh, view.w, view.h - by - bh);
  ctx.fillRect(0, by, bx, bh);
  ctx.fillRect(bx + bw, by, view.w - bx - bw, bh);

  ctx.save();
  ctx.beginPath();
  ctx.rect(bx, by, bw, bh);
  ctx.clip();

  // ③ 그 자리의 범위 원 하나. 부모 둘의 분기가 다르면 아직 확정이 아니므로
  //    놓은 쪽(b)의 분기로 하나만 그린다 — 두 원을 겹쳐 그리면 3.1 이 말한 대로
  //    어느 원이 누구 건지 안 읽힌다.
  //    후보 칸보다 **먼저** 그린다. 관측소처럼 사거리가 넓은 종류는 범위 사각형이
  //    보드 절반을 덮는데, 그 위에 후보 칸을 얹지 않으면 옅은 칸이 통째로 씻겨 나간다.
  drawRange({ gx: p.sel.gx, gy: p.sel.gy, kind: a.kind, star: p.star, b3: b.b3, b5: b.b5, t7: b.t7 });

  // ① 후보 칸 전부. 고를 수 있는 칸이 어디인지가 이 화면의 전부다.
  for (const s of p.spots) {
    const q = cellToPx(s.gx, s.gy);
    ctx.fillStyle = 'rgba(126,231,135,0.22)';
    ctx.fillRect(q.x + 2, q.y + 2, cell - 4, cell - 4);
    ctx.strokeStyle = 'rgba(126,231,135,0.55)';
    ctx.lineWidth = 1;
    roundRect(q.x + 2.5, q.y + 2.5, cell - 5, cell - 5, 5);
    ctx.stroke();
  }
  // ② sel 자리의 2x2 점선 + 십자선. 드래그 중 미리보기와 **같은 함수**다 —
  //    놓기 전과 놓은 뒤가 다른 그림이면 미리보기가 거짓말이 된다.
  drawMergeGhost(p.sel.gx, p.sel.gy, p.size);
  ctx.restore();

  const cost = mergeIsFree() ? 0 : mergeCost(p.star - 1);
  const price = cost === 0 ? '무료' : `${cost}G`;
  const q = cellToPx(p.sel.gx, p.sel.gy);
  const w = cell * p.size;
  previewLabel(`★${p.star} · ${p.size > 1 ? '2x2 · ' : ''}${price}`, q.x + w / 2, q.y - 6, '#7ee787');
  if (branchChain(a) !== branchChain(b))
    previewLabel('분기는 배치 뒤에 고른다', q.x + w / 2, q.y + w + 25, '#d29922');

  for (const act of L.actions) {
    const place = act.act === 'place';
    ctx.fillStyle = place ? '#238636' : '#21262d';
    ctx.strokeStyle = place ? '#3fb950' : '#30363d';
    ctx.lineWidth = 1.5;
    roundRect(act.x, act.y, act.w, act.h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = place ? '#fff' : '#c9d1d9';
    ctx.font = '600 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(place ? `여기에 배치  ${price}` : '취소', act.x + act.w / 2, act.y + act.h / 2);
  }
  // 보드를 눌러 자리를 옮긴다는 걸 어디서도 안 알려 주면 기본 자리로만 놓게 된다.
  ctx.fillStyle = '#8b949e';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  fitText('놓을 칸을 눌러 자리를 고른다', view.w / 2, L.actions[0].y - 20, view.w - 24, 11.5);
  ctx.textAlign = 'left';
}

function drawPicker() {
  if (!state.picker) return;
  const L = pickerLayout();
  if (!L) return;
  if (state.picker.mode === 'mergePlace') { drawMergePlacePicker(L); return; }
  const { gx, gy, kind } = state.picker;

  ctx.fillStyle = 'rgba(13,17,23,0.78)';
  ctx.fillRect(0, 0, view.w, view.h);

  // 고른 것이 있을 때만, 그것 하나의 범위를 그린다
  if (kind) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(view.ox, view.oy, view.cell * CFG.BOARD_W, view.cell * CFG.BOARD_H);
    ctx.clip();
    drawRange({ gx, gy, kind, star: 1, b3: null, b5: null, t7: null });
    ctx.restore();
  }

  const p = cellToPx(gx, gy);
  ctx.strokeStyle = '#7ee787';
  ctx.lineWidth = 3;
  roundRect(p.x + 1, p.y + 1, view.cell - 3, view.cell - 3, 6);
  ctx.stroke();

  const cost = summonCost();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  // 제목이 대상 칸 위에 겹칠 수 있어서 뒤에 판을 깐다
  const title = kind ? '여기에 놓을까?' : `여기에 소환   ${cost}G`;
  ctx.font = '700 15px system-ui, sans-serif';
  const tw = ctx.measureText(title).width + 24;
  ctx.fillStyle = 'rgba(13,17,23,0.9)';
  roundRect(view.w / 2 - tw / 2, L.cards[0].y - 32, tw, 24, 12);
  ctx.fill();
  ctx.fillStyle = '#e6edf3';
  ctx.fillText(title, view.w / 2, L.cards[0].y - 28);

  for (const r of L.cards) {
    const k = KINDS[r.k];
    const on = state.gold >= cost;
    const sel = kind === r.k;
    ctx.globalAlpha = kind && !sel ? 0.4 : 1;
    ctx.fillStyle = sel ? '#1b2b1f' : '#161b22';
    ctx.strokeStyle = sel ? '#7ee787' : (on ? k.color : '#30363d');
    ctx.lineWidth = sel ? 2.5 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.stroke();

    ctx.textAlign = 'left';
    if (!drawSprite(r.k, on ? k.color : '#484f58', r.x + 30, r.y + r.h / 2, 38)) {
      ctx.fillStyle = on ? k.color : '#484f58';
      ctx.font = '700 22px system-ui, sans-serif';
      ctx.fillText(k.tag, r.x + 16, r.y + 16);
    }
    ctx.fillStyle = on ? '#e6edf3' : '#6e7681';
    ctx.font = '700 15px system-ui, sans-serif';
    ctx.fillText(k.name, r.x + 52, r.y + 9);
    // 위 두 줄은 오른쪽 정보 칸을 피해야 하고, 아래 한 줄은 그 아래라 폭이 다 난다
    ctx.fillStyle = '#8b949e';
    fitText(k.blurb, r.x + 52, r.y + 29, r.w - 52 - 66, 11);
    ctx.fillStyle = on ? '#6e7681' : '#484f58';
    fitText(k.how, r.x + 52, r.y + 46, r.w - 52 - 14, 10.5);

    ctx.textAlign = 'right';
    ctx.fillStyle = k.color;
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText(GROUP_OF(r.k).name, r.x + r.w - 14, r.y + 11);
    ctx.fillStyle = '#6e7681';
    ctx.fillText('사거리 ' + k.range.toFixed(1), r.x + r.w - 14, r.y + 29);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center';
  }

  for (const a of L.actions) {
    const place = a.act === 'place';
    const on = !place || state.gold >= cost;
    ctx.fillStyle = place ? (on ? '#238636' : '#21262d') : '#21262d';
    ctx.strokeStyle = place ? (on ? '#3fb950' : '#30363d') : '#30363d';
    ctx.lineWidth = 1.5;
    roundRect(a.x, a.y, a.w, a.h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = place ? (on ? '#fff' : '#6e7681') : '#c9d1d9';
    ctx.font = '600 14px system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(place ? `배치  ${cost}G` : '취소', a.x + a.w / 2, a.y + a.h / 2);
    ctx.textBaseline = 'top';
  }

  // 소환값이 오른 이유를 그 값 옆에서 말해 준다. 안 적어 두면 "왜 갑자기
  // 비싸졌지" 로만 읽히고, 웨이브를 넘기면 내려간다는 것도 영영 모른다.
  if (cost > 10) {
    const last = (L.actions.length ? L.actions : L.cards).slice(-1)[0];
    ctx.fillStyle = '#6e7681';
    fitText('부를수록 +2G · 웨이브를 넘기면 내려간다',
      view.w / 2, last.y + last.h + 10, view.w - 24, 11);
  }
  ctx.textAlign = 'left';
}

// ── 덱 선택 화면 ─────────────────────────────────────────────
// 카드 사이에 그룹 머리말이 낀다. deckCardRects 는 카드만 돌려주고
// (히트 판정용), 그리기는 머리말까지 포함한 전체 배치를 쓴다.
function deckLayout() {
  const pad = 16, top = 118, bottomKeep = 92;
  const headers = GROUPS.filter(gr => KIND_KEYS.some(k => KINDS[k].group === gr.id));
  const avail = view.h - top - bottomKeep;
  const n = KIND_KEYS.length;
  const headH = 26, cardGap = 6, groupGap = 8;
  const cardH = Math.min(64,
    (avail - headers.length * headH - (n - headers.length) * cardGap - (headers.length - 1) * groupGap) / n);

  const items = [];
  let y = top;
  for (let gi = 0; gi < headers.length; gi++) {
    const gr = headers[gi];
    if (gi) y += groupGap;
    items.push({ type: 'header', gr, x: pad, y, w: view.w - pad * 2, h: headH });
    y += headH;
    for (const k of KIND_KEYS.filter(k => KINDS[k].group === gr.id)) {
      items.push({ type: 'card', k, x: pad, y, w: view.w - pad * 2, h: cardH });
      y += cardH + cardGap;
    }
  }
  return items;
}

function deckCardRects() { return deckLayout().filter(i => i.type === 'card'); }

function deckStartRect() {
  const pad = 16;
  return { x: pad, y: view.h - 74, w: view.w - pad * 2, h: 56 };
}

function drawDeckSelect() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.textBaseline = 'top';

  ctx.fillStyle = '#e6edf3';
  ctx.font = '700 22px system-ui, sans-serif';
  ctx.fillText('덱 선택', 16, 44);
  ctx.fillStyle = '#8b949e';
  fitText(`${CFG.DECK_SIZE}종만 고른다. 고른 종류만 소환된다.`, 16, 76, view.w - 32, 13);
  ctx.fillStyle = '#6e7681';
  fitText('빠진 종류가 어느 웨이브에서 아플지가 이 판의 첫 결정이다.', 16, 96, view.w - 32, 13);

  for (const it of deckLayout()) {
    if (it.type === 'header') {
      ctx.fillStyle = it.gr.color;
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillText(it.gr.name, it.x + 2, it.y + 8);
      ctx.fillStyle = '#6e7681';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText(it.gr.desc, it.x + 2 + ctx.measureText(it.gr.name).width + 30, it.y + 9);
      continue;
    }

    const r = it;
    const k = KINDS[r.k];
    const on = state.deckPick.includes(r.k);
    ctx.fillStyle = on ? '#1b2b1f' : '#161b22';
    ctx.strokeStyle = on ? '#3fb950' : '#30363d';
    ctx.lineWidth = on ? 2 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.stroke();

    if (!drawSprite(r.k, k.color, r.x + 26, r.y + r.h / 2, 40)) {
      ctx.fillStyle = k.color;
      ctx.font = '700 21px system-ui, sans-serif';
      ctx.fillText(k.tag, r.x + 14, r.y + r.h / 2 - 13);
    }

    const roomy = r.h >= 58;   // 짧은 화면에서는 카드가 얇아져 두 줄까지만 들어간다
    ctx.fillStyle = '#e6edf3';
    ctx.font = '700 14px system-ui, sans-serif';
    ctx.fillText(k.name, r.x + 48, roomy ? r.y + 8 : r.y + 10);
    ctx.fillStyle = '#8b949e';
    fitText(k.blurb, r.x + 48, roomy ? r.y + 27 : r.y + 30, r.w - 48 - 72, 11);
    if (roomy) {
      ctx.fillStyle = '#6e7681';
      fitText(k.how, r.x + 48, r.y + 44, r.w - 48 - 14, 10.5);
    }

    ctx.textAlign = 'right';
    ctx.fillStyle = k.dmgType === 'physical' ? '#d29922' : k.dmgType === 'magic' ? '#a371f7' : '#6e7681';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText(k.role, r.x + r.w - 14, roomy ? r.y + 9 : r.y + 11);
    ctx.fillStyle = '#484f58';
    ctx.fillText('사거리 ' + k.range.toFixed(1), r.x + r.w - 14, roomy ? r.y + 27 : r.y + 29);
    ctx.textAlign = 'left';
  }

  const b = deckStartRect();
  const ready = state.deckPick.length === CFG.DECK_SIZE;
  ctx.fillStyle = ready ? '#238636' : '#21262d';
  roundRect(b.x, b.y, b.w, b.h, 10);
  ctx.fill();
  ctx.fillStyle = ready ? '#fff' : '#6e7681';
  ctx.font = '600 16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ready ? '시작' : `${state.deckPick.length} / ${CFG.DECK_SIZE} 선택`, b.x + b.w / 2, b.y + b.h / 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}

// ── 분기 선택 모달 ───────────────────────────────────────────
function choiceRects() {
  if (!state.choice) return [];
  const n = state.choice.options.length;
  // 물려받기 카드는 줄기 둘(3성 분기 + 5성 분기)을 한 장에 담아야 해서 더 높다
  const w = Math.min(320, view.w - 48), gap = 12;
  const h = state.choice.mode === 'inherit' ? 100 : 84;
  const total = n * h + (n - 1) * gap;
  const x = (view.w - w) / 2;
  let y = (view.h - total) / 2 + 20;
  return state.choice.options.map(opt => {
    const r = { opt, x, y, w, h };
    y += h + gap;
    return r;
  });
}

function choiceLabel(opt) {
  const c = state.choice;
  const t = state.towers.find(v => v.id === c.towerId);
  if (c.mode === 'inherit') {
    const chain = c.chains[opt] || {};
    const B = BRANCH[t ? t.kind : 'shredder'] || {};
    const parts = [chain.b3, chain.b5].filter(Boolean).map(k => B[k]).filter(Boolean);
    return {
      name: parts.map(p => p.name).join('  ·  ') || '분기 없음',
      desc: parts.map(p => p.desc).join('\n'),
    };
  }
  if (c.tier === 7) return TRAITS[opt];
  return (BRANCH[t ? t.kind : 'shredder'] || {})[opt] || { name: opt, desc: '' };
}

// ── 입력 ─────────────────────────────────────────────────────
canvas.addEventListener('pointerdown', e => {
  const px = e.clientX, py = e.clientY;
  cloudPreload();   // 첫 터치에 미리 받아 둔다
  // 오디오는 사용자 제스처 안에서만 열린다(2.9). 아래 정지 화면 분기보다 **위**여야
  // 정지 화면을 탭해도 열린다 — 그 분기는 탭을 통째로 먹고 return 한다.
  // 멱등하고, 탭 복귀 후 suspended 로 내려간 컨텍스트도 여기서 되살린다.
  sfxUnlock();

  // 정지 화면은 탭을 통째로 먹는다. 유일한 예외가 토글 두 줄이다 — 여기서
  // 같이 재개해 버리면 켜졌는지 꺼졌는지 확인할 화면이 그 순간 사라진다.
  if (state.paused) {
    const onRect = r => r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    if (onRect(shakeToggleRect)) { toggleShake(); return; }
    if (onRect(soundToggleRect)) { toggleSound(); return; }
    state.paused = false;
    return;
  }

  if (state.phase === 'stage') {
    const inside = r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    const hit = stageCardRects().find(inside);
    if (hit) { pickStage(hit.i); return; }
    if (savedRun && inside(resumeRect())) { resumeRun(); return; }
    if (inside(cloudRect())) cloudToggle();
    return;
  }

  if (state.phase === 'deck') {
    const hit = deckCardRects().find(r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h);
    if (hit) { toggleDeckPick(hit.k); return; }
    const b = deckStartRect();
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) startRun();
    return;
  }

  if (state.choice) {
    const hit = choiceRects().find(r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h);
    if (hit) applyChoice(hit.opt);
    return;
  }

  // 배치 모드는 보드가 통째로 "바깥" 이라 바깥 탭에 안 닫힌다. 취소는 버튼으로만.
  if (mergePlaceOpen()) {
    const hit = pickerHit(px, py);
    if (hit) { hit.act === 'place' ? mergePlaceCommit() : mergePlaceCancel(); return; }
    const cc = pxToCell(px, py);
    if (cc) mergePlaceSelect(cc.gx, cc.gy);
    return;
  }

  if (state.picker) {
    const hit = pickerHit(px, py);
    if (!hit) { state.picker = null; return; }          // 바깥을 누르면 닫는다
    if (hit.k) { state.picker.kind = hit.k; return; }   // 고르면 사거리부터 보여준다
    if (hit.act === 'place') summon(state.picker.kind, state.picker.gx, state.picker.gy);
    state.picker = null;
    return;
  }

  if (state.phase === 'over' || state.phase === 'clear') { restart(); return; }

  const b = hitButton(px, py);
  if (b) { if (b.enabled()) b.fn(); return; }

  const c = pxToCell(px, py);
  if (!c) { state.selected = null; return; }
  const id = occupancy().get(c.gx + ',' + c.gy);
  if (id === undefined) {
    state.selected = null;
    // 빈 칸을 누르면 거기에 뭘 놓을지 고른다
    if (canPlace(c.gx, c.gy, 1, occupancy())) state.picker = { mode: 'summon', gx: c.gx, gy: c.gy, kind: null };
    return;
  }
  drag = { id, px, py, sx: px, sy: py, moved: false };
});

canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.px = e.clientX;
  drag.py = e.clientY;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
});

canvas.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag;
  drag = null;

  // 끌지 않았으면 그냥 선택 토글
  if (!d.moved) {
    state.selected = state.selected === d.id ? null : d.id;
    return;
  }

  const from = state.towers.find(t => t.id === d.id);
  const c = pxToCell(e.clientX, e.clientY);
  const overId = c ? occupancy().get(c.gx + ',' + c.gy) : undefined;
  if (!from || overId === undefined || overId === d.id) return;

  const to = state.towers.find(t => t.id === overId);
  // 결과가 2x2 면 자리를 묻고(커밋은 그때), 1x1 이면 지금까지처럼 바로 합친다.
  // 1x1 은 mergeSpot 의 첫 검사(놓은 칸 자체)가 늘 통과하므로 물을 것이 없다.
  if (canMerge(from, to)) {
    if (mergeResultSize(from) > 1) beginMergePlace(from, to);
    else mergeTowers(from, to);
    state.selected = null;
    return;
  }
  if (!mergeAllowed()) toast('웨이브 중엔 합성 불가');
  else if (from.kind !== to.kind) toast('종류가 다름');
  else if (from.star !== to.star) toast('성급이 다름');
  else toast('7성이 최대');
});

canvas.addEventListener('pointercancel', () => { drag = null; });

// ESC 는 열려 있는 창을 먼저 닫는다. 닫을 게 없으면 판을 세운다.
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape' && e.key !== 'p' && e.key !== 'P') return;
  e.preventDefault();
  if (state.phase === 'stage' || state.phase === 'deck') return;
  if (state.picker) { state.picker = null; return; }
  if (state.choice) return;                 // 분기 선택은 되돌릴 수 없으니 안 닫는다
  togglePause();
});

function restart() {
  state.phase = 'stage';
  state.paused = false;
  state.deckPick = [];
  state.wave = 0;
  state.timer = CFG.WAVE_GAP;
  state.gold = CFG.START_GOLD;
  state.essence = 0;
  state.life = CFG.START_LIFE;
  state.openRows = CFG.OPEN_ROWS;
  state.summonedThisWave = 0;
  state.towers.length = 0;
  state.enemies.length = 0;
  state.spawnQueue.length = 0;
  state.beams.length = 0;
  state.shells.length = 0;
  state.patches.length = 0;
  state.blasts.length = 0;
  resetParticles();
  resetCorpses();
  resetImpact();
  state.selected = null;
  clearChoices();
  state.picker = null;
  state.deck = [];
}

// ═════════════════════════════════════════════════════════════
// 진행
// ═════════════════════════════════════════════════════════════
function rushWave() {
  if (state.phase !== 'build') return;
  // 보상은 없다. 대기 시간을 건너뛰는 것 자체가 이득이고,
  // 골드까지 주면 항상 누르는 게 정답이라 선택이 아니게 된다.
  state.timer = 0;
  startWave();
}

// 웨이브 편성을 스폰 예약 목록으로 편다.
function buildSpawnQueue(wave) {
  const groups = WAVES[wave - 1] || WAVES[WAVES.length - 1];
  const q = [];
  let t = 0;
  for (const [kind, count] of groups) {
    const gap = SPAWN_GAP[kind] || SPAWN_GAP_DEFAULT;
    for (let i = 0; i < count; i++) { q.push({ kind, at: t }); t += gap; }
    t += 1.2;   // 그룹 사이 숨돌릴 틈
  }
  return q;
}

function startWave() {
  // 자리를 고르는 중에 웨이브가 시작되면 합성은 취소된다. 시계를 안 멈추는 게 이
  // 모드의 전제라서(멈추면 열고 닫기만으로 준비 시간을 무한히 늘릴 수 있다) 웨이브가
  // 그냥 온다. 커밋 전이라 잃는 것은 없다 — 골드도 부모 타워도 그대로다.
  // 여기서 지우는 이유는 mergeAllowed 가 준비 단계 전용이기 때문이다. 모드를 웨이브로
  // 끌고 가면 배치를 다 시켜 놓고 마지막에 거절하는 화면이 된다.
  if (mergePlaceOpen()) { state.picker = null; toast('웨이브 시작 — 합성 취소'); }
  state.wave++;
  state.phase = 'wave';
  state.waveT = 0;
  state.summonedThisWave = Math.floor(state.summonedThisWave * 0.7);
  state.spawnQueue = buildSpawnQueue(state.wave);
}

let laneCursor = 0;

function spawnEnemy(kind) {
  const d = ENEMY[kind];
  const hp = d.hp * waveHp(state.wave) * STAGES[state.stage].hpMult;
  const lane = lanes.length > 1 ? (laneCursor++ % lanes.length) : 0;
  const start = lanes[lane].points[0];
  state.enemies.push({
    id: nextEnemyId++, kind, hp, maxHp: hp,
    lane, dist: 0, x: start.x, y: start.y,
    hitFlash: 0, dead: false,
    armorStacks: 0, armorPer: 2, armorCap: 0, armorFed: false,
    mresCut: 0, magicVuln: 0, physVuln: 0, arcResonance: 0, plagueT: 0, plagueCut: 0, plagueVuln: 0,
    healCut: 0, inDeepAura: false,
    slowAmt: 0, slowNext: 0, frostStacks: 0,
    frozen: 0, stun: 0, pendingVuln: false, vulnT: 0, markT: 0,
  });
}

function endWave() {
  state.phase = 'build';
  state.shells.length = 0;
  state.patches.length = 0;
  state.timer = CFG.WAVE_GAP;
  state.gold += Math.round(CFG.GOLD_BASE * Math.pow(CFG.GOLD_GROWTH, state.wave));

  // 조폐소 수입. 성급 계수를 그대로 타는 이유는, 딜러와 같은 슬롯·같은 합성
  // 비용을 두고 경쟁하기 때문이다. 고정값이면 덱 슬롯 낭비가 된다.
  for (const t of state.towers) {
    if (t.kind !== 'mint') continue;
    state.gold += Math.round(CFG.MINT_BASE * STAR_MULT[t.star]);
    if (t.b3 === 'A') state.gold += Math.min(40 * t.star, Math.round(state.gold * 0.03));
    if (t.b5 === 'A1') state.gold += Math.round(CFG.GOLD_BASE * Math.pow(CFG.GOLD_GROWTH, state.wave) * 0.25);
  }

  if (state.wave % 7 === 0) { state.essence++; toast('정수 +1'); }

  // 행 개방. 5성이 2x2 를 먹기 때문에 보드가 안 늘어나면 6성 이상이 물리적으로
  // 불가능하다(시뮬에서 최고 성급이 5에 고정됐다).
  if (CFG.UNLOCK_AT.includes(state.wave) && state.openRows < CFG.BOARD_H) {
    state.openRows = Math.min(CFG.BOARD_H, state.openRows + 2);
    toast('보드 확장');
  }
  if (state.wave >= CFG.WAVE_MAX) {
    state.phase = 'clear';
    if (state.stage + 1 >= unlocked && unlocked < STAGES.length) {
      unlocked = state.stage + 2;
    }
  }

  best[state.stage] = Math.max(best[state.stage] || 0, state.wave);
  // 스냅샷은 준비 단계에서만 찍힌다. 클리어했으면 이어할 판이 없다.
  savedRun = state.phase === 'build' ? snapshotRun() : null;
  persist();
}

function enemySpeed(e) {
  return BASE_SPEED * ENEMY[e.kind].speed * (1 - (e.slowAmt || 0));
}

function updateEnemies(dt) {
  const survivors = [];
  for (const e of state.enemies) {
    const d = ENEMY[e.kind];
    if (e.hitFlash > 0) e.hitFlash -= dt;

    // 타이머
    // 오라 밖에서는 초당 3씩 빠진다. 4초 뒤 한 번에 0 으로 만들면
    // 언제 풀렸는지 알 수가 없고 막대가 뚝 사라진다.
    if (!e.armorFed && e.armorStacks > 0) {
      e.armorStacks = Math.max(0, e.armorStacks - 3 * dt);
      if (e.armorStacks === 0) e.armorCap = 0;
    }
    e.plagueT -= dt;
    e.markT -= dt;
    e.vulnT -= dt;
    e.stun -= dt;
    if (e.frozen > 0) {
      e.frozen -= dt;
      if (e.frozen <= 0 && e.pendingVuln) { e.pendingVuln = false; e.vulnT = 3; }
    }

    // 슬로우는 전부 오라라서 매 프레임 다시 계산된다. 소스가 여러 개면
    // 합산이 아니라 최댓값을 쓴다 — 합산하면 서리탑 도배가 곧 정답이 된다.
    e.slowAmt = Math.min(CFG.SLOW_CAP, e.slowNext || 0);

    if (d.regen) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * d.regen * (1 - e.healCut) * dt);

    if (e.frozen > 0 || e.stun > 0) { survivors.push(e); continue; }

    e.dist += enemySpeed(e) * dt;
    if (e.dist >= laneLen(e.lane)) {
      state.life -= d.leak;
      // 누수는 화면 층 경고만 낸다. 흔들림도 히트스톱도 파편도 없다(2.6·2.8).
      // += 가 아니라 = 다 — 누수가 몰리는 구간에서 알파가 누적되면 판이 안 보인다.
      leakWarnT = LEAK_WARN_DUR;
      // 경고음도 화면 층이다. 2.6 이 누수에 금지한 것은 파편·셀 좌표·killEnemy
      // 경로이고, 소리는 그 셋을 하나도 안 쓴다.
      sfx('leak');
      continue;
    }
    const p = posAt(e.dist, e.lane);
    e.x = p.x; e.y = p.y;
    survivors.push(e);
  }
  state.enemies = survivors;

  if (state.life <= 0) {
    state.life = 0;
    state.phase = 'over';
    best[state.stage] = Math.max(best[state.stage] || 0, state.wave);
    savedRun = null;
    persist();
  }
}

// ═════════════════════════════════════════════════════════════
// 처치 파편
// ═════════════════════════════════════════════════════════════
// 적이 사라지는 순간이 화면에서 안 읽힌다 — HP 바가 없어지는 게 전부라
// 죽인 건지 관문으로 샌 건지가 구분이 안 된다. 그래서 처치에만 파편을 뿌린다.
// 관문 도달은 처치가 아니므로 여기 붙이지 않는다(누수를 처치처럼 보이게 하면 최악).
//
// 좌표는 beams/blasts 와 같은 셀 좌표계다. 픽셀로 저장하면 화면 크기가 바뀌는
// 순간(회전·키보드) 이미 떠 있는 파편만 엉뚱한 자리에 남는다.

const PARTICLE_CAP = 360;       // 동시 파편 상한
const PARTICLE_GRAVITY = 5.0;   // 칸/초^2
const PARTICLE_LIFE = 0.3;      // 초
