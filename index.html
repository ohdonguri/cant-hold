<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>이번 웨이브는 못 막습니다</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d1117; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    font-family: system-ui, -apple-system, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ═════════════════════════════════════════════════════════════
// 설계 상수. 수치 근거는 DESIGN.md.
// ═════════════════════════════════════════════════════════════
const CFG = {
  BOARD_W: 6,
  BOARD_H: 8,
  OPEN_ROWS: 5,        // 아래에서부터 개방된 행 수

  WAVE_MAX: 30,
  WAVE_GAP: 20,        // 빌드 페이즈 길이(초)
  RUSH_GOLD: 2,        // 빨리 보내기: 남은 초당 골드

  SLOW_CAP: 0.60,      // 슬로우 총합 상한. 넘기면 서리탑 도배가 정답이 됨
  BIG_FROM_STAR: 5,    // 이 성급부터 2x2
  STAR_MAX: 7,

  START_GOLD: 90,
  START_LIFE: 20,
};

// 성급별 데미지 계수 (base x 계수). 대략 2.3배씩.
const STAR_MULT = [0, 1.0, 2.3, 5.3, 12, 28, 65, 149];

const STAR_COLOR = ['#000', '#8b949e', '#58a6ff', '#3fb950', '#d29922', '#f85149', '#a371f7', '#ffd700'];

// 워3식 방어력 감쇠. 음수 방어력(파쇄 분기)도 그대로 처리된다.
function armorReduction(armor) {
  return armor * 0.06 / (1 + 0.06 * Math.abs(armor));
}
function applyArmor(raw, armor) {
  return raw * (1 - armorReduction(armor));
}

function waveHp(wave) {
  return 100 * Math.pow(1.18, wave);
}

// ═════════════════════════════════════════════════════════════
// 경로. 격자 좌표 웨이포인트이고, 꺾이는 지점만 적는다.
// 보드 밖(-1, 8)에서 들어오고 나간다.
// ═════════════════════════════════════════════════════════════
// 가로 통로가 폭을 다 먹으면 배치 칸이 급감한다. 한 칸씩 어긋나게 짜서
// 경로 길이(교전 시간)는 유지하면서 주머니 공간을 남긴다.
const PATH = [
  { x: -1, y: 0 }, { x: 3, y: 0 },
  { x: 3, y: 2 }, { x: 0, y: 2 },
  { x: 0, y: 5 }, { x: 5, y: 5 },
  { x: 5, y: 8 },
];

// 웨이포인트 사이를 훑어 경로가 점유한 칸 집합을 만든다.
const PATH_CELLS = (() => {
  const set = new Set();
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i + 1];
    const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
    let x = a.x, y = a.y;
    set.add(x + ',' + y);
    while (x !== b.x || y !== b.y) {
      x += dx; y += dy;
      set.add(x + ',' + y);
    }
  }
  return set;
})();

// 웨이포인트 구간별 길이 — 적 이동 진행도 계산에 쓴다.
const PATH_SEG = PATH.slice(0, -1).map((a, i) => {
  const b = PATH[i + 1];
  return Math.hypot(b.x - a.x, b.y - a.y);
});
const PATH_LEN = PATH_SEG.reduce((s, v) => s + v, 0);

function isPath(gx, gy) { return PATH_CELLS.has(gx + ',' + gy); }

// ═════════════════════════════════════════════════════════════
// 타워 정의. 분기 효과는 이후 패스에서 붙인다.
// ═════════════════════════════════════════════════════════════
const KINDS = {
  shredder: { name: '파쇄자', tag: '파', color: '#f0883e', dmgType: 'physical', base: 0.7, cd: 0.6, range: 2.2 },
  eroder:   { name: '침식자', tag: '침', color: '#a371f7', dmgType: 'magic',    base: 0.5, cd: 1.2, range: 2.0 },
  frost:    { name: '서리탑', tag: '서', color: '#79c0ff', dmgType: 'magic',    base: 0.6, cd: 0.9, range: 2.2 },
  mortar:   { name: '박격포', tag: '박', color: '#d29922', dmgType: 'physical', base: 1.4, cd: 1.6, range: 3.2 },
  marksman: { name: '관측소', tag: '관', color: '#3fb950', dmgType: 'physical', base: 2.2, cd: 2.0, range: 4.5 },
  arc:      { name: '마력로', tag: '마', color: '#db61a2', dmgType: 'magic',    base: 1.8, cd: 2.5, range: 4.0 },
  mint:     { name: '조폐소', tag: '금', color: '#e3b341', dmgType: 'none',     base: 0,   cd: 0,   range: 2.0 },
};
const KIND_KEYS = Object.keys(KINDS);

// ═════════════════════════════════════════════════════════════
// 적. hp 는 waveHp() 에 곱해지는 배수, speed 는 BASE_SPEED 배수.
// leak 은 관문을 통과했을 때 깎이는 수치.
// ═════════════════════════════════════════════════════════════
const BASE_SPEED = 0.85;   // 칸/초

const ENEMY = {
  grunt:   { name: '보병', tag: '병', hp: 1.0,  armor: 5,  mres: 0,    speed: 1.0,  r: 0.26, leak: 1, color: '#8b949e' },
  armored: { name: '중갑', tag: '중', hp: 0.6,  armor: 40, mres: 0,    speed: 0.85, r: 0.28, leak: 2, color: '#a8b3c4' },
  warded:  { name: '마갑', tag: '마', hp: 0.9,  armor: 5,  mres: 0.45, speed: 1.0,  r: 0.26, leak: 2, color: '#a371f7' },
  swift:   { name: '질주', tag: '질', hp: 0.5,  armor: 0,  mres: 0,    speed: 2.5,  r: 0.20, leak: 1, color: '#7ee787' },
  regen:   { name: '재생', tag: '재', hp: 1.1,  armor: 8,  mres: 0.1,  speed: 0.9,  r: 0.26, leak: 2, color: '#3fb950', regen: 0.03 },
  immune:  { name: '면역', tag: '면', hp: 1.3,  armor: 12, mres: 0.15, speed: 1.0,  r: 0.28, leak: 2, color: '#f0883e', immune: true },
  swarm:   { name: '군집', tag: '군', hp: 0.18, armor: 0,  mres: 0,    speed: 1.2,  r: 0.15, leak: 1, color: '#58a6ff' },
  elite:   { name: '정예', hp: 8.0, tag: '정',  armor: 25, mres: 0.25, speed: 0.7,  r: 0.42, leak: 5, color: '#f85149', elite: true },
};

// 스폰 간격(초). 군집은 촘촘히, 정예는 띄엄띄엄.
const SPAWN_GAP = { swarm: 0.28, swift: 0.45, elite: 1.6 };
const SPAWN_GAP_DEFAULT = 0.75;

// 웨이브 편성. 커버리지 매트릭스(DESIGN.md 5장)에 맞춰 손으로 짠 표다.
// 면역몹이 서포트 몰빵을 벌하는 역할이라 중반부터 꾸준히 섞는다.
const WAVES = [
  [['grunt', 6]],
  [['grunt', 9]],
  [['swarm', 14]],
  [['grunt', 8], ['armored', 2]],
  [['armored', 5]],
  [['grunt', 10], ['swift', 3]],
  [['swift', 8]],
  [['warded', 5], ['grunt', 6]],
  [['swarm', 18], ['grunt', 4]],
  [['elite', 1], ['grunt', 8]],
  [['armored', 6], ['warded', 4]],
  [['regen', 6]],
  [['swift', 10], ['swarm', 14]],
  [['immune', 4], ['grunt', 8]],
  [['warded', 8], ['regen', 4]],
  [['armored', 8], ['swift', 6]],
  [['swarm', 24], ['immune', 3]],
  [['regen', 8], ['warded', 6]],
  [['immune', 6], ['armored', 6]],
  [['elite', 2], ['immune', 4]],
  [['swift', 14], ['swarm', 20]],
  [['armored', 10], ['regen', 6]],
  [['warded', 10], ['immune', 5]],
  [['swarm', 30], ['elite', 1]],
  [['immune', 8], ['regen', 8]],
  [['armored', 12], ['warded', 8]],
  [['swift', 16], ['immune', 6]],
  [['elite', 2], ['swarm', 24]],
  [['immune', 10], ['armored', 10], ['warded', 8]],
  [['elite', 3], ['immune', 8], ['regen', 6]],
];

// 진행 거리(칸)를 격자 좌표로 환산.
function posAt(dist) {
  let d = Math.max(0, dist);
  for (let i = 0; i < PATH_SEG.length; i++) {
    if (d <= PATH_SEG[i] || i === PATH_SEG.length - 1) {
      const a = PATH[i], b = PATH[i + 1];
      const t = PATH_SEG[i] === 0 ? 0 : Math.min(1, d / PATH_SEG[i]);
      return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
    }
    d -= PATH_SEG[i];
  }
  return PATH[PATH.length - 1];
}

// ═════════════════════════════════════════════════════════════
// 상태
// ═════════════════════════════════════════════════════════════
const state = {
  phase: 'build',      // build | wave | over | clear
  wave: 0,
  timer: CFG.WAVE_GAP,
  gold: CFG.START_GOLD,
  essence: 0,
  life: CFG.START_LIFE,
  openRows: CFG.OPEN_ROWS,
  summonedThisWave: 0,
  towers: [],
  enemies: [],
  spawnQueue: [],      // [{kind, at}] — at 은 웨이브 시작 기준 초
  waveT: 0,            // 웨이브 경과 시간
  selected: null,      // 선택된 타워 id
  toast: null,         // {text, t}
};

let nextTowerId = 1;
let nextEnemyId = 1;

// 소환 비용. 웨이브가 넘어갈 때 누적분이 30% 감쇠한다.
function summonCost() {
  return Math.round(10 + 2 * state.summonedThisWave);
}

function towerSize(t) { return t.star >= CFG.BIG_FROM_STAR ? 2 : 1; }

// 조폐소는 5성이어도 1칸. 경제 타워가 공간까지 먹으면 아무도 안 쓴다.
function towerFootprint(t) { return t.kind === 'mint' ? 1 : towerSize(t); }

function occupancy() {
  const occ = new Map();
  for (const t of state.towers) {
    const s = towerFootprint(t);
    for (let dy = 0; dy < s; dy++)
      for (let dx = 0; dx < s; dx++)
        occ.set((t.gx + dx) + ',' + (t.gy + dy), t.id);
  }
  return occ;
}

function firstOpenRow() { return CFG.BOARD_H - state.openRows; }

function canPlace(gx, gy, size, occ, ignoreId) {
  for (let dy = 0; dy < size; dy++) {
    for (let dx = 0; dx < size; dx++) {
      const x = gx + dx, y = gy + dy;
      if (x < 0 || x >= CFG.BOARD_W || y < 0 || y >= CFG.BOARD_H) return false;
      if (y < firstOpenRow()) return false;
      if (isPath(x, y)) return false;
      const o = occ.get(x + ',' + y);
      if (o !== undefined && o !== ignoreId) return false;
    }
  }
  return true;
}

function summon() {
  const cost = summonCost();
  if (state.gold < cost) return toast('골드 부족');

  const occ = occupancy();
  const spots = [];
  for (let gy = firstOpenRow(); gy < CFG.BOARD_H; gy++)
    for (let gx = 0; gx < CFG.BOARD_W; gx++)
      if (canPlace(gx, gy, 1, occ)) spots.push([gx, gy]);

  if (!spots.length) return toast('빈 칸 없음');

  const [gx, gy] = spots[(Math.random() * spots.length) | 0];
  const kind = KIND_KEYS[(Math.random() * KIND_KEYS.length) | 0];

  state.gold -= cost;
  state.summonedThisWave++;
  state.towers.push({
    id: nextTowerId++, gx, gy, kind, star: 1,
    b3: null, b5: null, t7: null,
    cd: 0, angle: -Math.PI / 2, flash: 0,
  });
}

function sellSelected() {
  const t = state.towers.find(v => v.id === state.selected);
  if (!t) return;
  state.gold += Math.round(10 * STAR_MULT[t.star] * 0.4);
  state.towers = state.towers.filter(v => v.id !== t.id);
  state.selected = null;
}

function toast(text) { state.toast = { text, t: 1.6 }; }

// ═════════════════════════════════════════════════════════════
// 캔버스 / 레이아웃
// ═════════════════════════════════════════════════════════════
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const view = { w: 0, h: 0, cell: 0, ox: 0, oy: 0 };
const HUD_TOP = 100, HUD_BOTTOM = 112;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  view.w = window.innerWidth;
  view.h = window.innerHeight;
  canvas.width = Math.round(view.w * dpr);
  canvas.height = Math.round(view.h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const padX = 10;
  const cellByW = (view.w - padX * 2) / CFG.BOARD_W;
  const cellByH = (view.h - HUD_TOP - HUD_BOTTOM) / CFG.BOARD_H;
  view.cell = Math.floor(Math.min(cellByW, cellByH));
  view.ox = Math.round((view.w - view.cell * CFG.BOARD_W) / 2);
  view.oy = HUD_TOP + Math.round((view.h - HUD_TOP - HUD_BOTTOM - view.cell * CFG.BOARD_H) / 2);
}
window.addEventListener('resize', resize);
resize();

function cellToPx(gx, gy) {
  return { x: view.ox + gx * view.cell, y: view.oy + gy * view.cell };
}
function pxToCell(px, py) {
  const gx = Math.floor((px - view.ox) / view.cell);
  const gy = Math.floor((py - view.oy) / view.cell);
  if (gx < 0 || gx >= CFG.BOARD_W || gy < 0 || gy >= CFG.BOARD_H) return null;
  return { gx, gy };
}

// ═════════════════════════════════════════════════════════════
// 입력
// ═════════════════════════════════════════════════════════════
const buttons = [];   // {x,y,w,h,label,fn,enabled}

function layoutButtons() {
  buttons.length = 0;
  const y = view.h - HUD_BOTTOM + 14;
  const h = 52, gap = 10, pad = 12;
  const w = (view.w - pad * 2 - gap) / 2;

  buttons.push({
    x: pad, y, w, h,
    label: () => `소환  ${summonCost()}G`,
    enabled: () => state.gold >= summonCost(),
    fn: summon,
  });

  buttons.push({
    x: pad + w + gap, y, w, h,
    label: () => state.phase === 'build'
      ? `빨리 보내기  +${Math.ceil(state.timer) * CFG.RUSH_GOLD}G`
      : '진행 중',
    enabled: () => state.phase === 'build',
    fn: rushWave,
  });
}

function hitButton(px, py) {
  return buttons.find(b => px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h);
}

canvas.addEventListener('pointerdown', e => {
  const px = e.clientX, py = e.clientY;

  const b = hitButton(px, py);
  if (b) { if (b.enabled()) b.fn(); return; }

  const c = pxToCell(px, py);
  if (!c) { state.selected = null; return; }
  const occ = occupancy();
  const id = occ.get(c.gx + ',' + c.gy);
  state.selected = (id !== undefined && id !== state.selected) ? id : null;
});

// ═════════════════════════════════════════════════════════════
// 진행
// ═════════════════════════════════════════════════════════════
function rushWave() {
  if (state.phase !== 'build') return;
  state.gold += Math.ceil(state.timer) * CFG.RUSH_GOLD;
  state.timer = 0;
  startWave();
}

// 웨이브 편성을 스폰 예약 목록으로 편다.
function buildSpawnQueue(wave) {
  const groups = WAVES[wave - 1] || WAVES[WAVES.length - 1];
  const q = [];
  let t = 0;
  for (const [kind, count] of groups) {
    const gap = SPAWN_GAP[kind] || SPAWN_GAP_DEFAULT;
    for (let i = 0; i < count; i++) { q.push({ kind, at: t }); t += gap; }
    t += 1.2;   // 그룹 사이 숨돌릴 틈
  }
  return q;
}

function startWave() {
  state.wave++;
  state.phase = 'wave';
  state.waveT = 0;
  state.summonedThisWave = Math.floor(state.summonedThisWave * 0.7);
  state.spawnQueue = buildSpawnQueue(state.wave);
}

function spawnEnemy(kind) {
  const d = ENEMY[kind];
  const hp = d.hp * waveHp(state.wave);
  state.enemies.push({
    id: nextEnemyId++, kind, hp, maxHp: hp,
    armor: d.armor, mres: d.mres,
    dist: 0, x: PATH[0].x, y: PATH[0].y,
    hitFlash: 0,
  });
}

function endWave() {
  state.phase = 'build';
  state.timer = CFG.WAVE_GAP;
  state.gold += 20 + state.wave * 4;
  if (state.wave % 7 === 0) { state.essence++; toast('정수 +1'); }
  if (state.wave >= CFG.WAVE_MAX) state.phase = 'clear';
}

function enemySpeed(e) {
  return BASE_SPEED * ENEMY[e.kind].speed;
}

function updateEnemies(dt) {
  const survivors = [];
  for (const e of state.enemies) {
    const d = ENEMY[e.kind];
    if (e.hitFlash > 0) e.hitFlash -= dt;

    if (d.regen) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * d.regen * dt);

    e.dist += enemySpeed(e) * dt;
    if (e.dist >= PATH_LEN) {
      state.life -= d.leak;
      continue;
    }
    const p = posAt(e.dist);
    e.x = p.x; e.y = p.y;
    survivors.push(e);
  }
  state.enemies = survivors;

  if (state.life <= 0) { state.life = 0; state.phase = 'over'; }
}

function update(dt) {
  if (state.toast) {
    state.toast.t -= dt;
    if (state.toast.t <= 0) state.toast = null;
  }
  for (const t of state.towers) if (t.flash > 0) t.flash -= dt;

  if (state.phase === 'build') {
    state.timer -= dt;
    if (state.timer <= 0) startWave();
    return;
  }

  if (state.phase !== 'wave') return;

  state.waveT += dt;
  while (state.spawnQueue.length && state.spawnQueue[0].at <= state.waveT) {
    spawnEnemy(state.spawnQueue.shift().kind);
  }

  updateEnemies(dt);

  if (state.phase === 'wave' && !state.spawnQueue.length && !state.enemies.length) endWave();
}

// ═════════════════════════════════════════════════════════════
// 렌더
// ═════════════════════════════════════════════════════════════
function drawBoard() {
  const { cell, ox, oy } = view;
  const open = firstOpenRow();

  for (let gy = 0; gy < CFG.BOARD_H; gy++) {
    for (let gx = 0; gx < CFG.BOARD_W; gx++) {
      const { x, y } = cellToPx(gx, gy);
      if (isPath(gx, gy)) ctx.fillStyle = '#2d333b';
      else if (gy < open) ctx.fillStyle = '#12161d';
      else ctx.fillStyle = (gx + gy) % 2 ? '#1a212c' : '#1e2732';
      ctx.fillRect(x, y, cell - 1, cell - 1);
    }
  }

  // 잠긴 구역 경계
  if (open > 0) {
    ctx.strokeStyle = '#3d444d';
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox, oy + open * cell - 0.5);
    ctx.lineTo(ox + cell * CFG.BOARD_W, oy + open * cell - 0.5);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // 관문
  const exit = PATH[PATH.length - 1];
  const ep = cellToPx(exit.x, exit.y - 1);
  ctx.strokeStyle = '#f85149';
  ctx.lineWidth = 3;
  ctx.strokeRect(ep.x + 2, ep.y + cell - 5, cell - 5, 3);
}

function drawTower(t) {
  const { cell } = view;
  const size = towerFootprint(t);
  const { x, y } = cellToPx(t.gx, t.gy);
  const w = cell * size - 2;
  const k = KINDS[t.kind];
  const sel = state.selected === t.id;

  ctx.fillStyle = '#22272e';
  ctx.strokeStyle = STAR_COLOR[t.star];
  ctx.lineWidth = sel ? 3 : 2;
  roundRect(x + 2, y + 2, w - 2, w - 2, 6);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = k.color;
  ctx.font = `700 ${Math.round(cell * 0.42 * size)}px system-ui, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(k.tag, x + 2 + (w - 2) / 2, y + 2 + (w - 2) / 2 - cell * 0.06);

  ctx.fillStyle = STAR_COLOR[t.star];
  ctx.font = `700 ${Math.round(cell * 0.26)}px system-ui, sans-serif`;
  ctx.fillText('★' + t.star, x + 2 + (w - 2) / 2, y + w - cell * 0.18);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

function drawRange(t) {
  const { cell } = view;
  const size = towerFootprint(t);
  const { x, y } = cellToPx(t.gx, t.gy);
  const cx = x + cell * size / 2, cy = y + cell * size / 2;
  ctx.strokeStyle = 'rgba(88,166,255,0.5)';
  ctx.fillStyle = 'rgba(88,166,255,0.07)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(cx, cy, KINDS[t.kind].range * cell, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
}

function drawEnemies() {
  const { cell, ox, oy } = view;
  for (const e of state.enemies) {
    const d = ENEMY[e.kind];
    const cx = ox + (e.x + 0.5) * cell;
    const cy = oy + (e.y + 0.5) * cell;
    const r = d.r * cell;

    ctx.fillStyle = e.hitFlash > 0 ? '#fff' : d.color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    if (d.immune) {                    // 면역몹은 테두리로 구분
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    if (e.hp < e.maxHp) {
      const bw = r * 2.2, bh = 3;
      ctx.fillStyle = '#000a';
      ctx.fillRect(cx - bw / 2, cy - r - 7, bw, bh);
      ctx.fillStyle = '#3fb950';
      ctx.fillRect(cx - bw / 2, cy - r - 7, bw * (e.hp / e.maxHp), bh);
    }
  }
}

// 3웨이브 앞까지 예고. 지금 최적인 빌드가 곧 무력화된다는 걸
// 미리 보여주는 게 이 게임의 결정 구조라서 항상 화면에 띄운다.
function drawForecast() {
  const start = state.wave + 1;
  const colW = view.w / 3;
  ctx.textBaseline = 'top';

  for (let i = 0; i < 3; i++) {
    const w = start + i;
    if (w > CFG.WAVE_MAX) break;
    const groups = WAVES[w - 1];
    const x = colW * i + 12;

    ctx.fillStyle = i === 0 ? '#e6edf3' : '#6e7681';
    ctx.font = `${i === 0 ? '700 ' : ''}11px system-ui, sans-serif`;
    ctx.fillText(`w${w}`, x, 66);

    let gx = x + 26;
    for (const [kind, count] of groups) {
      const d = ENEMY[kind];
      ctx.fillStyle = i === 0 ? d.color : d.color + '99';
      ctx.font = '700 12px system-ui, sans-serif';
      ctx.fillText(d.tag, gx, 65);
      gx += 13;
      ctx.fillStyle = i === 0 ? '#8b949e' : '#484f58';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText(String(count), gx, 66);
      gx += ctx.measureText(String(count)).width + 7;
    }
  }
}

function drawHud() {
  ctx.textBaseline = 'top';

  // 최상단 진행 바
  if (state.phase === 'build') {
    ctx.fillStyle = '#21262d';
    ctx.fillRect(0, 0, view.w, 3);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(0, 0, view.w * (1 - state.timer / CFG.WAVE_GAP), 3);
  } else if (state.phase === 'wave') {
    const total = state.spawnQueue.length + state.enemies.length;
    ctx.fillStyle = '#21262d';
    ctx.fillRect(0, 0, view.w, 3);
    ctx.fillStyle = '#f85149';
    ctx.fillRect(0, 0, view.w * (state.enemies.length / Math.max(1, total)), 3);
  }

  ctx.fillStyle = '#e6edf3';
  ctx.font = '700 20px system-ui, sans-serif';
  const title = `웨이브 ${state.wave}`;
  ctx.fillText(title, 16, 16);
  ctx.fillStyle = '#6e7681';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText(`/ ${CFG.WAVE_MAX}`, 16 + ctx.measureText(title).width + 8, 23);

  ctx.textAlign = 'right';
  ctx.fillStyle = '#e3b341';
  ctx.font = '700 18px system-ui, sans-serif';
  ctx.fillText(`${state.gold} G`, view.w - 16, 16);
  ctx.fillStyle = state.life <= 5 ? '#f85149' : '#7ee787';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText(`정수 ${state.essence}   관문 ${state.life}`, view.w - 16, 42);
  ctx.textAlign = 'left';

  ctx.fillStyle = '#8b949e';
  ctx.font = '13px system-ui, sans-serif';
  ctx.fillText(
    state.phase === 'build' ? `다음 웨이브까지 ${state.timer.toFixed(1)}s`
                            : `남은 적 ${state.enemies.length + state.spawnQueue.length}`,
    16, 42);

  drawForecast();

  for (const b of buttons) {
    const on = b.enabled();
    ctx.fillStyle = on ? '#238636' : '#21262d';
    roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fill();
    ctx.fillStyle = on ? '#fff' : '#6e7681';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(b.label(), b.x + b.w / 2, b.y + b.h / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  if (state.toast) {
    ctx.globalAlpha = Math.min(1, state.toast.t / 0.4);
    ctx.fillStyle = '#f85149';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(state.toast.text, view.w / 2, view.h - HUD_BOTTOM - 26);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function render() {
  layoutButtons();
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, view.w, view.h);
  drawBoard();
  const sel = state.towers.find(t => t.id === state.selected);
  if (sel) drawRange(sel);
  for (const t of state.towers) drawTower(t);
  drawEnemies();
  drawHud();
  drawOverlay();
}

function drawOverlay() {
  if (state.phase !== 'over' && state.phase !== 'clear') return;
  ctx.fillStyle = 'rgba(13,17,23,0.85)';
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = state.phase === 'over' ? '#f85149' : '#7ee787';
  ctx.font = '700 26px system-ui, sans-serif';
  ctx.fillText(state.phase === 'over' ? '이번 웨이브는 못 막았습니다' : '전부 막았습니다',
    view.w / 2, view.h / 2 - 16);
  ctx.fillStyle = '#8b949e';
  ctx.font = '15px system-ui, sans-serif';
  ctx.fillText(`웨이브 ${state.wave} / ${CFG.WAVE_MAX}`, view.w / 2, view.h / 2 + 18);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}

// ═════════════════════════════════════════════════════════════
// 루프
// ═════════════════════════════════════════════════════════════
let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05); // 탭 전환 후 점프 방지
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
