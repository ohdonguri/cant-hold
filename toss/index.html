const PICKER_ACT_H = 44;          // mergePlace 액션 버튼 높이

// 부채꼴 치수. 이동 거리와 오조작이 이 넷에서 갈린다.
//   PICK_R      칸 중심 → 아이콘 중심. **손가락 이동 상한이 곧 이 값이다**
//   PICK_ICON_R 안 고른 아이콘의 보이는 원. 지름 48px 로 최소 탭 크기 44px 위다
//   PICK_HIT_R  히트박스. 보이는 원보다 넉넉하되 `PICK_R / 2 = 29` 미만이라야 한다 —
//               이웃과 겹치면 「어느 쪽이 눌렸나」가 좌표 몇 px 에 달리고, 둘째 탭이
//               곧 배치라 그건 골드가 나가는 오조작이다
//   PICK_SEL_R  **고른 아이콘의 보이는 원. 히트박스와 같은 값이다.**
// 마지막 줄이 이 화면의 둘째 탭을 쉽게 만드는 방법이다 — 히트박스를 키우는 게 아니라
// **이미 있던 히트박스를 보이게 하는 것**이다. 28 은 `PICK_HIT_R` 이 이미 쓰고 있던
// 반경이라 「보이는 것이 곧 누를 수 있는 것」이 되고, 다음 둘이 같이 성립한다.
//   ① 이웃과 안 겹친다: 28 + 24 = 52 < `PICK_R` 58 (여백 6px). 28 < 29 라 두 아이콘
//     한복판(29px)에도 못 닿으므로 `pickerHit` 의 「이웃 사이는 안 잡힌다」가 그대로다
//   ② 화면 밖으로 안 나간다: `pickerFan` 은 아이콘 중심을 `PICK_EDGE + PICK_ICON_R`
//     안쪽에 두므로 커진 원도 28 − 24 = 4 ≤ `PICK_EDGE` 6 만큼만 먹는다. 즉 **부채꼴
//     기하는 한 글자도 안 건드린다** — 가장자리 회전 로직이 이 값에 안 딸려 있다
// **히트박스 자체는 안 키운다.** 28 은 위 29 천장 바로 밑이라 남은 자리가 1px 이고,
// 고른 것만 키우면 지금은 「아무 일도 안 나는」 이웃 사이 틈이 「골드가 나가는」 틈이
// 된다 — 오조작을 줄이려다 늘리는 방향이다.
const PICK_R = 58, PICK_ICON_R = 24, PICK_HIT_R = 28;
const PICK_SEL_R = PICK_HIT_R;
const PICK_STEP = Math.PI / 3;    // 아이콘 사이 60°
const PICK_ROT = Math.PI / 12;    // 가장자리에서 부채꼴을 돌리는 눈금 15°
const PICK_EDGE = 6;              // 화면 가장자리 여백

// 가운데 방향 `base` 를 기준으로 n 개를 60°씩 편 좌표. n = 3 이면 그대로 10·12·2시다.
function fanPoints(cx, cy, n, base) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * PICK_STEP;
    out.push({ x: cx + PICK_R * Math.cos(a), y: cy + PICK_R * Math.sin(a) });
  }
  return out;
}

// ── 가장자리가 이 화면의 진짜 일이다 ─────────────────────────
// 가운데 칸은 12시면 끝이고 **모서리가 어렵다.** ⑩ 세물머리(10열)에서는 0열 칸의
// 중심이 보드 왼쪽 끝에서 `cell / 2 = 18.5px` 밖에 안 떨어져 있어서, 10시 아이콘이
// 중심에서 왼쪽으로 50px 을 나가면 화면 밖으로 잘린다.
//
// 규칙은 **돌리기**다. 12시에서 15°씩 좌우로 벌려 가며 조건을 만족하는 첫 방향을 쓴다.
// 먼저 도는 쪽은 칸이 화면 어느 편에 있느냐로 정한다 — 왼쪽 끝 칸은 시계방향(오른쪽)
// 으로 돌려야 열린다. 180° 까지 돌면 부채꼴이 통째로 뒤집힌다.
//
// 조건은 두 단계고 위에서부터 시험한다.
//   ① 아이콘 **중심이 보드 안** · 원 전체가 화면 안
//   ② 원 전체가 화면 안
// ①이 「보드 밖으로 안 나간다」의 실효 정의다. **원 전체를 보드 안에 넣지는 않는다** —
// 그렇게 하면 0열 칸에서 부채꼴이 거의 3시까지 돌아가 아이콘이 손가락 아래로 들어간다
// (위 「가린다」와 정면으로 부딪힌다). 원이 보드 테두리를 조금 물고 어두운 배경 위로
// 나가는 것은 **잘리는 게 아니다.** ②는 그래도 안 되는 화면(창을 극단적으로 줄인
// 경우)의 보루고, ②마저 안 되면 12시 부채꼴을 화면 안으로 통째로 민다.
// 어느 경로로 가든 **잘리지는 않는다** — 그게 이 함수가 지키는 유일한 불변식이다.
function pickerFan(cx, cy, n) {
  const bx2 = view.ox + view.cell * CFG.BOARD_W, by2 = view.oy + view.cell * CFG.BOARD_H;
  const lo = PICK_EDGE + PICK_ICON_R;
  const onScreen = p => p.x >= lo && p.x <= view.w - lo && p.y >= lo && p.y <= view.h - lo;
  const onBoard = p => p.x >= view.ox && p.x <= bx2 && p.y >= view.oy && p.y <= by2;

  const dir = cx < view.w / 2 ? 1 : -1;
  const steps = Math.round(Math.PI / PICK_ROT);          // 0° ~ 180°
  for (const strict of [true, false]) {
    for (let s = 0; s <= steps; s++) {
      // 0° 와 180° 는 좌우가 같은 방향이라 한 번만 본다.
      for (const sign of (s === 0 || s === steps ? [1] : [dir, -dir])) {
        const pts = fanPoints(cx, cy, n, -Math.PI / 2 + sign * s * PICK_ROT);
        if (pts.every(p => onScreen(p) && (!strict || onBoard(p)))) return pts;
      }
    }
  }
  // 어느 방향도 안 들어가는 화면. 12시 부채꼴을 통째로 밀어 넣는다 —
  // 손가락이 PICK_R 보다 더 움직이지만 **잘리는 것보다 낫다.**
  const pts = fanPoints(cx, cy, n, -Math.PI / 2);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const dx = Math.max(0, lo - Math.min(...xs)) - Math.max(0, Math.max(...xs) - (view.w - lo));
  const dy = Math.max(0, lo - Math.min(...ys)) - Math.max(0, Math.max(...ys) - (view.h - lo));
  return pts.map(p => ({ x: p.x + dx, y: p.y + dy }));
}

function pickerLayout() {
  if (!state.picker) return null;
  // 배치 모드는 아이콘이 없다(무엇을 놓을지는 이미 정해졌다). 액션 둘의 자리도 대상 칸을
  // 안 따라간다 — sel 이 탭마다 움직이는데 버튼까지 따라 움직이면 다음 탭이 어긋난다.
  if (state.picker.mode === 'mergePlace') {
    const w = Math.min(300, view.w - 40), gap = 8;
    const x = (view.w - w) / 2, bw = (w - gap) / 2;
    const y = view.h - HUD_BOTTOM - PICKER_ACT_H - 12;
    return { icons: [], actions: [
      { act: 'cancel', x, y, w: bw, h: PICKER_ACT_H },
      { act: 'place', x: x + bw + gap, y, w: bw, h: PICKER_ACT_H },
    ] };
  }
  const deck = state.deck.length ? state.deck : KIND_KEYS.slice(0, CFG.DECK_SIZE);
  const p = cellToPx(state.picker.gx, state.picker.gy);
  const cx = p.x + view.cell / 2, cy = p.y + view.cell / 2;
  const pts = pickerFan(cx, cy, deck.length);
  // 원 정보(cx·cy·r)와 감싸는 사각형을 같이 담는다. 판정은 원으로 하지만(pickerHit)
  // 「화면 안인가」를 재는 쪽은 사각형이 편하다.
  //
  // **`r` 은 고른 아이콘에서 커진다**(PICK_SEL_R). 그리기 쪽에서 따로 부풀리지 않는
  // 이유는 검사 때문이다 — `npm test` 가 「render 가 이 좌표·이 반경으로 그렸나」를
  // 대조하므로(#58), 배치가 내놓은 `r` 과 화면의 원이 갈리면 그 대조가 못 쓰게 된다.
  const icons = deck.map((k, i) => {
    const r = k === state.picker.sel ? PICK_SEL_R : PICK_ICON_R;
    return {
      k, cx: pts[i].x, cy: pts[i].y, r, hitR: PICK_HIT_R,
      x: pts[i].x - r, y: pts[i].y - r, w: r * 2, h: r * 2,
    };
  });
  return { icons, actions: [] };
}

function pickerRects() { const L = pickerLayout(); return L ? L.icons : []; }

function pickerHit(px, py) {
  const L = pickerLayout();
  if (!L) return null;
  const inside = r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  const act = L.actions.find(inside);
  if (act) return act;
  // 아이콘은 **원**으로 잡는다. 사각형으로 잡으면 모서리가 이웃 원과 겹쳐서
  // 「어느 쪽이 눌렸나」가 좌표 몇 px 에 달린다(PICK_HIT_R 주석).
  let best = null, bestD = Infinity;
  for (const ic of L.icons) {
    const d = Math.hypot(px - ic.cx, py - ic.cy);
    if (d <= ic.hitR && d < bestD) { best = ic; bestD = d; }
  }
  return best;
}

// ── 아이콘 탭: 첫 번은 고르기 · 둘째 번은 짓기 ───────────────
// 배치라 **오조작이 곧 골드 손해다.** 1성 소환에 `10 + 2 x 그 웨이브 소환수` 가
// 나가고, 되돌리는 길은 판매뿐인데 회수는 `sellValue` 로 4G(조폐소 A2 환급 분기면
// 10G) 다. 게다가 `summonedThisWave` 는 이미 올라가 있어서 **그 웨이브의 다음 소환값이
// 영구히 +2G** 다 — 즉 첫 소환을 잘못 누르면 실손 6G + 남은 웨이브 내내 +2G 다.
//
// **그 방어를 두 단계 탭이 통째로 맡는다.** #68 은 같은 일을 장치 넷으로 했는데
// (넉넉한 히트박스 · 뗄 때 짓기 · 8px 밀어서 취소 · 길게 누르면 조회) 그중 뒤의 셋은
// **누른 채로 일어나는 일**이라 화면에 아무 흔적이 없었다. 유저는 길게 누르기를 못
// 찾았고(#83), 못 찾은 장치는 방어가 아니다. 지금은 첫 탭이 공짜라 **잘못 누르면
// 화면이 그렇게 말하고 골드는 안 나간다** — 다른 아이콘을 누르면 그리로 옮겨 간다.
// 남은 것은 넉넉한 히트박스 하나뿐이고, 나머지는 이 두 단계가 대신한다.
//
// 값은 다시 안 매겼다. 늘어난 탭 한 번의 대가는 위 6G + 남은 웨이브 +2G 이고,
// 판마다 수십 번 반복되므로 **둘째 탭이 쉬워야 한다** — 그 답이 `PICK_SEL_R` 이다.
//
// 고른 종류는 `state.picker.sel` 에 둔다. 상태를 `state.picker` 안에 넣는 이유는
// beginMergePlace 주석과 같다 — picker 를 지우는 경로가 이미 넷(togglePause ·
// restoreRun · restart · ESC)이고, 형제 변수를 새로 만들면 그 넷을 전부 다시 맞춰야
// 한다. 이름도 mergePlace 의 `sel` 과 일부러 같다: **이 창에서 지금 고른 것.**
//
// 탭을 **누를 때** 처리하는 것도 그래서다. #68 이 뗄 때 처리한 이유가 「누른 채로
// 일어나는 일」 셋이었는데 그게 전부 없어졌다. 남겨 두면 규칙이 두 벌이 된다.
function pickerTap(px, py) {
  if (!state.picker || state.picker.mode !== 'summon') return null;
  const hit = pickerHit(px, py);
  if (!hit || !hit.k) return null;         // 아이콘 밖 — 창을 닫는 것은 핸들러가 한다
  // 첫 탭. **골드가 모자라도 고른다** — 무엇을 못 사는지는 사거리를 보고 나서
  // 판단할 일이고, 여기서 막으면 「눌렀는데 아무 일도 안 난다」가 된다.
  if (state.picker.sel !== hit.k) { state.picker.sel = hit.k; return 'select'; }
  // 둘째 탭. 못 짓는 상황에서는 창을 안 닫는다 — 이유만 띄우고 고른 상태를 남긴다.
  if (state.gold < summonCost()) { toast('골드 부족'); return 'reject'; }
  const { gx, gy } = state.picker;
  state.picker = null;
  summon(hit.k, gx, gy);
  return 'build';
}

// 지금 고른 종류. 없으면 null. 사거리·유령·커진 아이콘이 전부 이 하나를 본다.
function pickerSel() {
  return state.picker && state.picker.mode === 'summon' ? (state.picker.sel || null) : null;
}

// 읽기용 게터. mergePlaceState 와 같은 형태다 — 핸들러에 로직을 남기면 헤드리스가
// 원리적으로 못 보므로, 검사 창을 게임 코드 안에 둔다.
function pickerState() {
  if (!state.picker || state.picker.mode !== 'summon')
    return { open: false, gx: 0, gy: 0, sel: null };
  return { open: true, gx: state.picker.gx, gy: state.picker.gy, sel: pickerSel() };
}

// 2x2 결과를 어디에 놓을지 고르는 화면. 소환 피커와 두 곳이 다르다.
//   ① 딤이 보드 위에서 훨씬 옅다 — 고를 대상이 후보 칸 자체라, 소환의 0.78 을
//      그대로 쓰면 골라야 할 것이 통째로 묻힌다. 보드 밖은 그대로 0.78 이다
//   ② 카드가 없다. 무엇을 놓을지는 이미 정해졌고 남은 물음은 자리 하나뿐이다
// 흔들림은 안 탄다 — 2.8 이 "클립 밖(소환 피커 포함)은 안 흔들린다" 로 정한 그대로다.
// **웨이브 중에도 이 화면이 열린다**(mergeAllowed 가 wave 를 허용한다). 그래서 이제
// 흔들림원이 실제로 있다 — 뒤에서 적이 터지고 화면이 흔들리는 동안 자리를 고른다.
// 그래도 규칙은 안 바꾼다: 이 화면은 클립 밖이라 안 흔들리고, 흔들리는 것은 그 뒤의
// 보드다. 고를 대상(후보 칸)이 보드 위에 있으므로 **딤이 옅은 것이 여기서 값을 한다** —
// 흔들리는 판 위에서도 후보 칸이 읽혀야 한다.

function drawMergePlacePicker(L) {
  const p = state.picker;
  const a = state.towers.find(t => t.id === p.aId);
  const b = state.towers.find(t => t.id === p.bId);
  if (!a || !b || !p.sel) return;

  const { cell } = view;
  const bx = view.ox, by = view.oy, bw = cell * CFG.BOARD_W, bh = cell * CFG.BOARD_H;
  ctx.fillStyle = 'rgba(13,17,23,0.26)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(13,17,23,0.78)';
  ctx.fillRect(0, 0, view.w, by);
  ctx.fillRect(0, by + bh, view.w, view.h - by - bh);
  ctx.fillRect(0, by, bx, bh);
  ctx.fillRect(bx + bw, by, view.w - bx - bw, bh);

  ctx.save();
  ctx.beginPath();
  ctx.rect(bx, by, bw, bh);
  ctx.clip();

  // ③ 그 자리의 범위 원 하나. 부모 둘의 분기가 다르면 아직 확정이 아니므로
  //    놓은 쪽(b)의 분기로 하나만 그린다 — 두 원을 겹쳐 그리면 3.1 이 말한 대로
  //    어느 원이 누구 건지 안 읽힌다.
  //    후보 칸보다 **먼저** 그린다. 관측소처럼 사거리가 넓은 종류는 범위 사각형이
  //    보드 절반을 덮는데, 그 위에 후보 칸을 얹지 않으면 옅은 칸이 통째로 씻겨 나간다.
  drawRange({ gx: p.sel.gx, gy: p.sel.gy, kind: a.kind, star: p.star, b3: b.b3, b5: b.b5, t7: b.t7 });

  // ① 후보 칸 전부. 고를 수 있는 칸이 어디인지가 이 화면의 전부다.
  for (const s of p.spots) {
    const q = cellToPx(s.gx, s.gy);
    ctx.fillStyle = 'rgba(126,231,135,0.22)';
    ctx.fillRect(q.x + 2, q.y + 2, cell - 4, cell - 4);
    ctx.strokeStyle = 'rgba(126,231,135,0.55)';
    ctx.lineWidth = 1;
    roundRect(q.x + 2.5, q.y + 2.5, cell - 5, cell - 5, 5);
    ctx.stroke();
  }
  // ② sel 자리의 2x2 점선 + 십자선. 드래그 중 미리보기와 **같은 함수**다 —
  //    놓기 전과 놓은 뒤가 다른 그림이면 미리보기가 거짓말이 된다.
  drawMergeGhost(p.sel.gx, p.sel.gy, p.size);
  ctx.restore();

  const cost = mergeIsFree() ? 0 : mergeCost(p.star - 1);
  const price = cost === 0 ? '무료' : `${cost}G`;
  const q = cellToPx(p.sel.gx, p.sel.gy);
  const w = cell * p.size;
  previewLabel(`★${p.star} · ${p.size > 1 ? '2x2 · ' : ''}${price}`, q.x + w / 2, q.y - 6, '#7ee787');
  if (branchChain(a) !== branchChain(b))
    previewLabel('분기는 배치 뒤에 고른다', q.x + w / 2, q.y + w + 25, '#d29922');

  for (const act of L.actions) {
    const place = act.act === 'place';
    ctx.fillStyle = place ? '#238636' : '#21262d';
    ctx.strokeStyle = place ? '#3fb950' : '#30363d';
    ctx.lineWidth = 1.5;
    roundRect(act.x, act.y, act.w, act.h, 10);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = place ? '#fff' : '#c9d1d9';
    ctx.font = '600 14px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(place ? `여기에 배치  ${price}` : '취소', act.x + act.w / 2, act.y + act.h / 2);
  }
  // 보드를 눌러 자리를 옮긴다는 걸 어디서도 안 알려 주면 기본 자리로만 놓게 된다.
  ctx.fillStyle = '#8b949e';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  fitText('놓을 칸을 눌러 자리를 고른다', view.w / 2, L.actions[0].y - 20, view.w - 24, 11.5);
  ctx.textAlign = 'left';
}

function drawPicker() {
  if (!state.picker) return;
  const L = pickerLayout();
  if (!L) return;
  if (state.picker.mode === 'mergePlace') { drawMergePlacePicker(L); return; }
  const { gx, gy } = state.picker;
  const sel = pickerSel();

  ctx.fillStyle = 'rgba(13,17,23,0.78)';
  ctx.fillRect(0, 0, view.w, view.h);

  // 고른 **그 하나의** 범위만 그린다. 셋을 겹쳐 그리면 어느 원이 누구 건지
  // 못 읽는다 — 예전 2단계가 있던 이유가 그거였고 그 이유는 지금도 그대로다.
  if (sel) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(view.ox, view.oy, view.cell * CFG.BOARD_W, view.cell * CFG.BOARD_H);
    ctx.clip();
    drawRange({ gx, gy, kind: sel, star: 1, b3: null, b5: null, t7: null });
    ctx.restore();
  }

  const p = cellToPx(gx, gy);
  ctx.strokeStyle = '#7ee787';
  ctx.lineWidth = 3;
  roundRect(p.x + 1, p.y + 1, view.cell - 3, view.cell - 3, 6);
  ctx.stroke();

  const cost = summonCost();
  const afford = state.gold >= cost;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // ── 고른 것을 화면이 되받는다 ─────────────────────────────
  // **셋이 같이 나와야 「한 번 더 누르면 저게 여기에 선다」가 읽힌다.**
  //   ① 칸 안의 유령 — 무엇이 · 어디에 서는지
  //   ② 사거리 사각형(위) — 얼마나 닿는지
  //   ③ 커진 초록 아이콘 + 나머지 둘 죽이기 — 어느 아이콘을 다시 눌러야 하는지
  // 하나만 두면 안 된다. #83 의 판단이 그거였다 — 사거리만 뜨고 아이콘이 그대로면
  // 플레이어는 「왜 안 지어지지」 하고 끝난다.
  //
  // 유령을 **칸 안**에 두는 것이 ①의 요점이다. 아이콘 둘레에는 이걸 놓을 자리가
  // 없다 — 이웃 아이콘이 58px 뿐이고 부채꼴이 돌면 어느 쪽이든 바로 옆에 온다.
  // 칸은 부채꼴이 어떻게 돌든 늘 비어 있고, 애초에 **답해야 할 물음이 「여기에
  // 무엇을 세우나」**라 유령이 설 자리가 거기다.
  if (sel) {
    const sk = KINDS[sel];
    const gcx = p.x + view.cell / 2, gcy = p.y + view.cell / 2;
    ctx.save();
    ctx.globalAlpha = 0.55;
    if (!drawSprite(sel, sk.color, gcx, gcy, view.cell * 0.7)) {
      ctx.fillStyle = sk.color;
      ctx.font = '700 16px system-ui, sans-serif';
      ctx.fillText(sk.tag, gcx, gcy);
    }
    ctx.restore();
  }

  for (const ic of L.icons) {
    const k = KINDS[ic.k];
    const lit = sel === ic.k;
    // 고른 하나만 살리고 나머지는 죽인다. 예전 카드 피커가 쓰던 것과 같은 손짓이다 —
    // 초록 테두리 하나로는 관측소처럼 **제 색이 초록인 종류**와 안 갈린다. 그래서
    // 테두리 말고도 셋이 더 붙는다: 원이 커지고(PICK_SEL_R) · 안쪽이 그 종류의 색으로
    // 물들고 · 나머지 둘이 0.35 로 물러난다.
    ctx.globalAlpha = sel && !lit ? 0.35 : 1;
    ctx.beginPath();
    ctx.arc(ic.cx, ic.cy, ic.r, 0, Math.PI * 2);
    ctx.fillStyle = '#161b22';
    ctx.fill();
    if (lit) { ctx.fillStyle = k.color + '3d'; ctx.fill(); }
    ctx.strokeStyle = lit ? '#7ee787' : (afford ? k.color : '#30363d');
    ctx.lineWidth = lit ? 3 : 2;
    ctx.stroke();

    // 그림과 값뿐이다. 이름도 설명도 없는 것이 이 화면의 요점이다 —
    // 알아야 하면 한 번 눌러 사거리를 본다.
    if (!drawSprite(ic.k, afford ? k.color : '#484f58', ic.cx, ic.cy - 5, 30)) {
      ctx.fillStyle = afford ? k.color : '#484f58';
      ctx.font = '700 20px system-ui, sans-serif';
      ctx.fillText(k.tag, ic.cx, ic.cy - 5);
    }
    // **골드가 모자라면 셋 다 회색이다.** 예전 카드가 회색이 되던 자리를 그대로
    // 옮겼다. 비용은 셋이 같은 값이지만 **아이콘마다 붙인다** — 한 곳에 몰아 두면
    // 부채꼴이 돌았을 때 그 한 곳이 아이콘과 멀어지거나 화면 밖으로 나간다.
    // 고른 하나에서만 초록이다 — 다음 탭에 실제로 나갈 값이 이것이라는 뜻이다.
    ctx.fillStyle = afford ? (lit ? '#7ee787' : '#c9d1d9') : '#6e7681';
    ctx.font = '700 10px system-ui, sans-serif';
    ctx.fillText(cost + 'G', ic.cx, ic.cy + 14);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';

  // 안내는 **부채꼴 반대쪽**에 붙인다. 부채꼴이 위면 칸 아래, 뒤집혔으면 칸 위다 —
  // 아이콘과 안 겹치고, 누르는 손가락은 그때 이미 아이콘 쪽으로 옮겨 가 있다.
  const lines = [];
  if (sel) {
    const k = KINDS[sel];
    lines.push([`${k.name} · 사거리 ${k.range.toFixed(1)}`, k.color]);
    // **둘째 탭이 무엇을 하는지 글자로도 한 번 더 말한다.** 그림(유령·사거리·커진
    // 아이콘)이 못 읽히는 자리를 이 줄이 받는다. 못 지을 때는 이 줄이 이유가 된다 —
    // 「한 번 더 누르면 지어진다」와 「골드가 없다」가 동시에 참일 수는 없다.
    lines.push(afford
      ? ['한 번 더 누르면 여기에 짓는다', '#7ee787']
      : [`골드 부족 — ${cost}G 필요 · 지금 ${state.gold}G`, '#d29922']);
  } else {
    // 취소 버튼이 없어졌으므로 그 자리를 이 줄이 대신한다. ESC 도 같이 닫는다.
    lines.push(afford
      ? ['아이콘을 눌러 고른다 · 밖을 누르면 취소', '#8b949e']
      : [`골드 부족 — ${cost}G 필요 · 지금 ${state.gold}G`, '#d29922']);
    lines.push(['고르면 사거리가 뜬다 · 한 번 더 눌러 짓는다', '#6e7681']);
    // 소환값이 오른 이유를 그 값 옆에서 말해 준다. 안 적어 두면 "왜 갑자기
    // 비싸졌지" 로만 읽히고, 웨이브를 넘기면 내려간다는 것도 영영 모른다.
    if (cost > 10) lines.push(['부를수록 +2G · 웨이브를 넘기면 내려간다', '#6e7681']);
  }
  // 안내는 아이콘·칸을 합친 상자의 **아래**에 쌓는다. 옆으로는 못 피한다 — 줄 하나가
  // 화면 폭을 거의 다 쓴다. 「칸 아래」로 못 박았더니 ⑩ 0열에서 돌아간 부채꼴의 아래쪽
  // 아이콘이 그대로 덮였다(그 컷이 17-summonedge 다). 그래서 칸이 아니라 **부채꼴을
  // 기준으로 피한다.** 아래가 화면에 안 들어가는 자리에서만 위로 올린다.
  const gap = 21;
  const need = gap * lines.length;
  const top = Math.min(p.y, ...L.icons.map(ic => ic.cy - ic.r)) - 8;
  const bot = Math.max(p.y + view.cell, ...L.icons.map(ic => ic.cy + ic.r)) + 8;
  const below = bot + need <= view.h - 8 || top - need < 8;
  lines.forEach(([text, color], i) => {
    const bottomY = below ? bot + gap * (i + 1) : top - gap * (lines.length - 1 - i);
    previewLabel(text, p.x + view.cell / 2, bottomY, color);
  });
}

// ── 덱 선택 화면 ─────────────────────────────────────────────
// 카드 사이에 그룹 머리말이 낀다. deckCardRects 는 카드만 돌려주고
// (히트 판정용), 그리기는 머리말까지 포함한 전체 배치를 쓴다.
function deckLayout() {
  const pad = 16, top = 118, bottomKeep = 92;
  const headers = GROUPS.filter(gr => KIND_KEYS.some(k => KINDS[k].group === gr.id));
  const avail = view.h - top - bottomKeep;
  const n = KIND_KEYS.length;
  const headH = 26, cardGap = 6, groupGap = 8;
  const cardH = Math.min(64,
    (avail - headers.length * headH - (n - headers.length) * cardGap - (headers.length - 1) * groupGap) / n);

  const items = [];
  let y = top;
  for (let gi = 0; gi < headers.length; gi++) {
    const gr = headers[gi];
    if (gi) y += groupGap;
    items.push({ type: 'header', gr, x: pad, y, w: view.w - pad * 2, h: headH });
    y += headH;
    for (const k of KIND_KEYS.filter(k => KINDS[k].group === gr.id)) {
      items.push({ type: 'card', k, x: pad, y, w: view.w - pad * 2, h: cardH });
      y += cardH + cardGap;
    }
  }
  return items;
}

function deckCardRects() { return deckLayout().filter(i => i.type === 'card'); }

// 뒤로. **시작 버튼과 같은 줄에 나란히 둔다**(#74). 모바일에는 ESC 가 없고
// 브라우저 뒤로가기는 손이 화면 밖으로 나가야 닿으므로, 화면 안에 자리가 있어야
// 한다 — 「잘못 골랐다」가 이 화면에서 가장 흔한 사건이다.
//
// **위가 아니라 아래인 이유**: 카드 목록이 `top = 118` 에서 시작하고(deckLayout)
// 그 위는 안내 세 줄이 이미 쓰고 있다. 위에 줄을 하나 더 내면 일곱 장이 그만큼
// 얇아진다 — 그 계산은 `deckLayout` 의 `bottomKeep` 이 이미 하고 있고, 이 줄은
// 그 안에 들어가므로 **카드 높이를 1px 도 안 건드린다.**
function deckBackRect() {
  const pad = 16;
  return { x: pad, y: view.h - 74, w: 76, h: 56 };
}

function deckStartRect() {
  const pad = 16, gap = 10, b = deckBackRect();
  return { x: b.x + b.w + gap, y: b.y, w: view.w - pad - (b.x + b.w + gap), h: 56 };
}

function drawDeckSelect() {
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, view.w, view.h);
  ctx.textBaseline = 'top';

  ctx.fillStyle = '#e6edf3';
  ctx.font = '700 22px system-ui, sans-serif';
  ctx.fillText('덱 선택', 16, 44);
  ctx.fillStyle = '#8b949e';
  fitText(`${CFG.DECK_SIZE}종만 고른다. 고른 종류만 소환된다.`, 16, 76, view.w - 32, 13);
  // 둘째 줄이 제약 판에서는 **막힌 이유**로 바뀐다. 줄을 새로 늘리지 않는 이유는
  // 카드 목록이 `top = 118` 에서 시작하기 때문이다 — 여기 한 줄을 더 넣으면 일곱
  // 장이 그만큼 얇아진다. 원래 문구(「빠진 종류가 어느 웨이브에서 아플지」)는
  // **고를 수 있을 때** 하는 말이라, 못 고르는 판에서 자리를 내주는 게 맞다.
  const limit = deckLimitNote();
  ctx.fillStyle = limit ? '#d29922' : '#6e7681';
  fitText(limit || '빠진 종류가 어느 웨이브에서 아플지가 이 판의 첫 결정이다.',
    16, 96, view.w - 32, 13);

  for (const it of deckLayout()) {
    if (it.type === 'header') {
      ctx.fillStyle = it.gr.color;
      ctx.font = '700 13px system-ui, sans-serif';
      ctx.fillText(it.gr.name, it.x + 2, it.y + 8);
      ctx.fillStyle = '#6e7681';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText(it.gr.desc, it.x + 2 + ctx.measureText(it.gr.name).width + 30, it.y + 9);
      continue;
    }

    const r = it;
    const k = KINDS[r.k];
    const on = state.deckPick.includes(r.k);
    // 막힌 카드는 **지우지 않고 회색으로 남긴다.** 목록에서 빼면 이 판에 그 타워가
    // 없는 것처럼 보이고, 「내가 왜 이걸 못 쓰지」가 아니라 「이 게임에 저게
    // 있었나」가 된다 — 강제하는 판이라는 사실 자체가 안 읽힌다.
    const off = !kindAllowed(r.k);
    ctx.fillStyle = off ? '#111519' : on ? '#1b2b1f' : '#161b22';
    ctx.strokeStyle = off ? '#21262d' : on ? '#3fb950' : '#30363d';
    ctx.lineWidth = on ? 2 : 1.5;
    roundRect(r.x, r.y, r.w, r.h, 10);
    ctx.fill();
    ctx.stroke();

    // 스프라이트도 같이 죽인다. 그림만 제 색이면 카드가 「선택 안 된 칸」으로
    // 읽혀서 계속 눌러 보게 된다.
    const sprColor = off ? mixHex(k.color, '#0d1117', 0.68) : k.color;
    if (!drawSprite(r.k, sprColor, r.x + 26, r.y + r.h / 2, 40)) {
      ctx.fillStyle = sprColor;
      ctx.font = '700 21px system-ui, sans-serif';
      ctx.fillText(k.tag, r.x + 14, r.y + r.h / 2 - 13);
    }

    const roomy = r.h >= 58;   // 짧은 화면에서는 카드가 얇아져 두 줄까지만 들어간다
    ctx.fillStyle = off ? '#484f58' : '#e6edf3';
    ctx.font = '700 14px system-ui, sans-serif';
    ctx.fillText(k.name, r.x + 48, roomy ? r.y + 8 : r.y + 10);
    ctx.fillStyle = off ? '#3d444d' : '#8b949e';
    fitText(k.blurb, r.x + 48, roomy ? r.y + 27 : r.y + 30, r.w - 48 - 72, 11);
    if (roomy) {
      ctx.fillStyle = off ? '#3d444d' : '#6e7681';
      fitText(k.how, r.x + 48, r.y + 44, r.w - 48 - 14, 10.5);
    }

    ctx.textAlign = 'right';
    ctx.fillStyle = off ? '#3d444d'
      : k.dmgType === 'physical' ? '#d29922' : k.dmgType === 'magic' ? '#a371f7' : '#6e7681';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText(k.role, r.x + r.w - 14, roomy ? r.y + 9 : r.y + 11);
    // **막힌 카드에는 사거리 대신 「이 판 금지」가 온다.** 셋째 줄(`how`)은 좁은
    // 화면에서 접히므로 거기 적으면 접힌 화면에서 이유가 통째로 사라진다. 이 줄은
    // roomy 와 무관하게 항상 그려지는 자리다.
    ctx.fillStyle = off ? '#d29922' : '#484f58';
    ctx.fillText(off ? '이 판 금지' : '사거리 ' + k.range.toFixed(1),
      r.x + r.w - 14, roomy ? r.y + 27 : r.y + 29);
    ctx.textAlign = 'left';
  }

  const b = deckStartRect();
  const ready = state.deckPick.length === CFG.DECK_SIZE;
  ctx.fillStyle = ready ? '#238636' : '#21262d';
  roundRect(b.x, b.y, b.w, b.h, 10);
  ctx.fill();
  ctx.fillStyle = ready ? '#fff' : '#6e7681';
  ctx.font = '600 16px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(ready ? '시작' : `${state.deckPick.length} / ${CFG.DECK_SIZE} 선택`, b.x + b.w / 2, b.y + b.h / 2);

  // 뒤로. 시작과 같은 줄이지만 **테두리만 있는 상자**라 눌러야 하는 쪽이 안 헷갈린다.
  // 글자만 쓰고 화살표 글리프는 안 쓴다 — 정지 버튼 아이콘 주석과 같은 이유로,
  // 기기에 따라 두부(□)로 떨어지면 확인할 방법이 없는 자리다.
  const bk = deckBackRect();
  ctx.fillStyle = '#161b22';
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1.5;
  roundRect(bk.x, bk.y, bk.w, bk.h, 10);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#8b949e';
  ctx.font = '600 15px system-ui, sans-serif';
  ctx.fillText('뒤로', bk.x + bk.w / 2, bk.y + bk.h / 2);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
}

// ── 분기 선택 모달 ───────────────────────────────────────────
function choiceRects() {
  if (!state.choice) return [];
  const n = state.choice.options.length;
  // 물려받기 카드는 줄기 둘(3성 분기 + 5성 분기)을 한 장에 담아야 해서 더 높다
  const w = Math.min(320, view.w - 48), gap = 12;
  const h = state.choice.mode === 'inherit' ? 100 : 84;
  const total = n * h + (n - 1) * gap;
  const x = (view.w - w) / 2;
  let y = (view.h - total) / 2 + 20;
  return state.choice.options.map(opt => {
    const r = { opt, x, y, w, h };
    y += h + gap;
    return r;
  });
}

function choiceLabel(opt) {
  const c = state.choice;
  const t = state.towers.find(v => v.id === c.towerId);
  if (c.mode === 'inherit') {
    const chain = c.chains[opt] || {};
    const B = BRANCH[t ? t.kind : 'shredder'] || {};
    const parts = [chain.b3, chain.b5].filter(Boolean).map(k => B[k]).filter(Boolean);
    return {
      name: parts.map(p => p.name).join('  ·  ') || '분기 없음',
      desc: parts.map(p => p.desc).join('\n'),
    };
  }
  if (c.tier === 7) return TRAITS[opt];
  return (BRANCH[t ? t.kind : 'shredder'] || {})[opt] || { name: opt, desc: '' };
}

// ── 입력 ─────────────────────────────────────────────────────
canvas.addEventListener('pointerdown', e => {
  const px = e.clientX, py = e.clientY;
  cloudPreload();   // 첫 터치에 미리 받아 둔다
  // 오디오는 사용자 제스처 안에서만 열린다(2.9). 아래 정지 화면 분기보다 **위**여야
  // 정지 화면을 탭해도 열린다 — 그 분기는 탭을 통째로 먹고 return 한다.
  // 멱등하고, 탭 복귀 후 suspended 로 내려간 컨텍스트도 여기서 되살린다.
  sfxUnlock();

  // 정지 화면은 탭을 통째로 먹는다. 유일한 예외가 토글 두 줄이다 — 여기서
  // 같이 재개해 버리면 켜졌는지 꺼졌는지 확인할 화면이 그 순간 사라진다.
  if (state.paused) {
    const onRect = r => r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
    if (onRect(shakeToggleRect)) { toggleShake(); return; }
    if (onRect(soundToggleRect)) { toggleSound(); return; }
    if (onRect(exitRunRect)) { exitRunTap(); return; }
    state.paused = false;
    return;
  }

  // 목록이 스크롤되므로 **탭은 pointerup 에서 처리한다**(아래 `stageTap`).
  // pointerdown 에서 바로 고르면 끌기 시작이 곧 판 선택이 되어 스크롤을 못 한다.
  // 여기서는 끌기만 시작한다.
  if (state.phase === 'stage') {
    stageDrag = { y: py, scroll: stageScroll, moved: false };
    return;
  }

  if (state.phase === 'deck') {
    const hit = deckCardRects().find(r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h);
    if (hit) { toggleDeckPick(hit.k); return; }
    // 뒤로를 **시작보다 먼저** 본다. 두 상자는 안 겹치지만, 겹치는 날 판에 들어가는
    // 쪽이 이기면 「나가려다 판이 시작된다」가 된다 — 두 오답 중 나쁜 쪽이다.
    const bk = deckBackRect();
    if (px >= bk.x && px <= bk.x + bk.w && py >= bk.y && py <= bk.y + bk.h) { navBack(); return; }
    const b = deckStartRect();
    if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) startRun();
    return;
  }

  if (state.choice) {
    const hit = choiceRects().find(r => px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h);
    if (hit) applyChoice(hit.opt);
    return;
  }

  // 배치 모드는 보드가 통째로 "바깥" 이라 바깥 탭에 안 닫힌다. 취소는 버튼으로만.
  if (mergePlaceOpen()) {
    const hit = pickerHit(px, py);
    if (hit) { hit.act === 'place' ? mergePlaceCommit() : mergePlaceCancel(); return; }
    const cc = pxToCell(px, py);
    if (cc) mergePlaceSelect(cc.gx, cc.gy);
    return;
  }

  if (state.picker) {
    // 첫 탭은 고르기, 둘째 탭은 짓기. **누를 때** 끝난다 — #68 이 뗄 때 처리하던
    // 이유(길게 누르기 · 밀어서 취소)가 전부 없어졌다(pickerTap 주석).
    if (pickerTap(px, py)) return;
    state.picker = null;                                // 바깥을 누르면 닫는다(취소)
    return;
  }

  if (state.phase === 'over' || state.phase === 'clear') { restart(); return; }

  const b = hitButton(px, py);
  if (b) { if (b.enabled()) b.fn(); return; }

  const c = pxToCell(px, py);
  if (!c) { state.selected = null; return; }
  const id = occupancy().get(c.gx + ',' + c.gy);
  if (id === undefined) {
    state.selected = null;
    // 빈 칸을 누르면 거기에 뭘 놓을지 고른다
    if (canPlace(c.gx, c.gy, 1, occupancy()))
      state.picker = { mode: 'summon', gx: c.gx, gy: c.gy, sel: null };
    // 못 놓는 칸은 **이유를 말한다.** 예전에는 조용히 아무 일도 안 일어났는데,
    // 부채꼴이 안 뜨는 것과 「눌렀는데 반응이 없다」가 화면에서 같아 보인다.
    else toast(c.gy < firstOpenRow() ? '아직 안 열린 구역' : '여기엔 못 놓음');
    return;
  }
  drag = { id, px, py, sx: px, sy: py, moved: false };
});

canvas.addEventListener('pointermove', e => {
  // 소환 부채꼴에는 여기서 할 일이 없다. 탭이 pointerdown 에서 끝나므로 누른 채로
  // 일어나는 일이 하나도 없다(pickerTap 주석). 부채꼴이 열려 있으면 애초에
  // pointerdown 이 drag 를 안 만들었으므로 아래 두 갈래도 다 비어 있다.

  // 스테이지 목록 끌기. 문턱 8px 은 아래 타워 드래그와 **같은 값이다** — 두 화면에서
  // 「탭인가 끌기인가」의 기준이 다르면 손가락이 배운 것을 화면마다 다시 배워야 한다.
  if (stageDrag) {
    const dy = e.clientY - stageDrag.y;
    if (Math.abs(dy) > 8) stageDrag.moved = true;
    if (stageDrag.moved) stageScroll = stageDrag.scroll - dy;   // 상한은 metrics 가 조인다
    return;
  }
  if (!drag) return;
  drag.px = e.clientX;
  drag.py = e.clientY;
  if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) drag.moved = true;
});

canvas.addEventListener('pointerup', e => {
  if (stageDrag) {
    const moved = stageDrag.moved;
    stageDrag = null;
    if (!moved) stageTap(e.clientX, e.clientY);
    return;
  }
  if (!drag) return;
  const d = drag;
  drag = null;

  // 끌지 않았으면 그냥 선택 토글
  if (!d.moved) {
    state.selected = state.selected === d.id ? null : d.id;
    return;
  }

  const from = state.towers.find(t => t.id === d.id);
  const c = pxToCell(e.clientX, e.clientY);
  const overId = c ? occupancy().get(c.gx + ',' + c.gy) : undefined;
  if (!from || overId === undefined || overId === d.id) return;

  const to = state.towers.find(t => t.id === overId);
  // 결과가 2x2 면 자리를 묻고(커밋은 그때), 1x1 이면 지금까지처럼 바로 합친다.
  // 1x1 은 mergeSpot 의 첫 검사(놓은 칸 자체)가 늘 통과하므로 물을 것이 없다.
  if (canMerge(from, to)) {
    if (mergeResultSize(from) > 1) beginMergePlace(from, to);
    else mergeTowers(from, to);
    state.selected = null;
    return;
  }
  if (from.kind !== to.kind) toast('종류가 다름');
  else if (from.star !== to.star) toast('성급이 다름');
  else toast('7성이 최대');
});

canvas.addEventListener('pointercancel', () => {
  drag = null; stageDrag = null;
  // 소환 부채꼴은 안 건드린다. 고른 상태는 손가락이 아니라 **창**에 매여 있어서
  // (state.picker.sel) 취소된 터치 하나에 지워질 것이 없다 — 창을 닫는 길은
  // 바깥 탭 · ESC · 뒤로가기 셋 그대로다.
});

// ── 뒤로 가기 (#74) ──────────────────────────────────────────
// 화면은 한 줄이다: **목록 → 덱 → 판.** 「뒤로」는 그 줄을 한 칸 거슬러 오르는 동작
// 하나뿐이고, 화면의 버튼 · ESC · 브라우저 뒤로가기 셋이 전부 `goBack()` 하나를 부른다.
// 셋이 각자 판단하면 같은 자리에서 셋이 다른 뜻이 된다 — 덱 화면이 정확히 그랬다
// (ESC 는 명시적으로 막혀 있었고, 버튼은 없었고, 뒤로가기는 페이지를 나갔다).
//
// **history 항목은 한 개를 넘기지 않는다.** 화면 깊이만큼 쌓으면(목록→덱→판 = 2개)
// 판에서 나갈 때 몇 개를 걷어야 하는지가 경로마다 달라지고, 그 셈이 한 번 어긋나면
// 「뒤로가기를 두 번 눌러야 나가는 화면」이 된다. 대신 **소비한 즉시 다시 쌓는다**
// (아래 popstate). 그래서 불변식이 하나로 줄어든다:
//   목록  항목 0개 → 뒤로가기가 페이지를 나간다 (원래 동작이고, 나가도 되는 유일한 자리다)
//   그 외 항목 1개 → 뒤로가기가 우리 것을 먹고 goBack() 이 화면을 한 칸 되돌린다
//
// **쌓는 문과 걷는 문이 각각 정해져 있다.** 판으로 들어가는 문 셋(pickStage ·
// startRun · resumeRun)이 `navArm()` 을, 목록으로 나가는 문 하나(restart)가
// `navDrop()` 을 부른다. 화면을 바꾸는 경로가 나중에 늘어도 이 넷만 지나면 된다 —
// 화면 전이마다 pushState 를 흩어 놓지 않는 이유가 이것이다.
const NAV_MARK = 'canthold-screen';
// 헤드리스(tools/sim.js)에는 history 가 없다. 없으면 화면만 되돌리고 끝낸다 —
// 그래야 시뮬·테스트가 이 파일을 그대로 실을 수 있다.
const nav = typeof history !== 'undefined' && typeof history.pushState === 'function' ? history : null;
let navPushed = 0;       // 우리가 쌓아 둔 항목 수. 0 아니면 1이다
let navDropping = false; // navDrop 이 부른 back 의 popstate 를 기다리는 중

// **새로고침은 쌓아 둔 항목 위에서 다시 시작할 수 있다.** 판에 들어가 있는 동안 탭이
// 되살아나면(모바일에서는 배경으로 내려갔다 오면 흔히 그런다) 페이지는 항목 하나를
// 딛고 선 채로 목록부터 다시 시작한다. 그 항목을 모른 척하면 **목록에서 뒤로가기를 한
// 번 헛눌러야** 하므로, 여기서 우리 것으로 이어받는다. 표식은 지운다 — 남겨 두면 아래
// 「앞으로 가기」 분기가 이 항목을 자기 것으로 오해한다.
if (nav && nav.state && nav.state[NAV_MARK]) {
  nav.replaceState(null, '');
  navPushed = 1;
}

function navArm() {
  if (navPushed || navDropping || !nav || state.phase === 'stage') return;
  nav.pushState({ [NAV_MARK]: 1 }, '');
  navPushed = 1;
}

// 목록으로 돌아왔다 — 쌓아 둔 항목을 걷는다. **`navPushed` 를 먼저 0 으로 내린다.**
// 그래야 이 back() 이 되돌려 보내는 popstate 를 아래 핸들러가 「우리가 부른 것」으로
// 알아보고 화면을 한 칸 더 되돌리지 않는다.
//
// `navDropping` 은 **한 태스크 안에서 걷고 다시 쌓는 경우**를 위한 것이다. back() 은
// 큐에 들어가고 popstate 는 나중에 오는데, 그 사이에 화면이 다시 판으로 들어가 있으면
// 뒤늦게 도착한 popstate 가 그 화면을 한 칸 더 되돌린다(`tools/shot.js` 가 컷마다
// `restart(); pickStage(...)` 를 한 번에 부르는 것이 정확히 그 모양이다).
// **불변식을 지키는 것은 아래 popstate 의 첫 분기다** — 우리가 부른 back 인 줄 알아보고
// 화면 대신 항목만 다시 맞춘다. 그 한 줄을 지우면 `npm test` 의 「걷고 곧바로 다시
// 쌓아도 화면이 안 밀린다」가 깨진다.
//
// `navArm()` 쪽의 `navDropping` 조건은 **그 위에 덧댄 것이고 관측 가능한 효과가 없다**
// (지워도 검사가 안 깨진다 — 확인했다). 남겨 두는 이유는 하나다: 큐에 back 이 들어가
// 있는 동안 `pushState` 를 부르지 않는 쪽이 브라우저마다 덜 위험하고, 그 차이는
// 헤드리스 스텁이 재현할 수 없는 종류다.
function navDrop() {
  if (!navPushed || !nav) { navPushed = 0; return; }
  navPushed = 0;
  navDropping = true;
  nav.back();
}

// 뒤로 요청 하나. 쌓아 둔 항목이 있으면 **브라우저에게 맡긴다** — 그래야 화면과
// history 가 같은 경로로 움직인다. 직접 goBack() 을 부르면 화면만 뒤로 가고 항목은
// 그대로 남아서, 목록에서 뒤로가기를 한 번 헛눌러야 나가게 된다.
function navBack() {
  if (navPushed && nav) { nav.back(); return; }
  goBack();
}

// 읽기용 게터. 헤드리스가 「지금 항목을 들고 있나」를 볼 유일한 창이다.
function navState() { return { pushed: navPushed, dropping: navDropping }; }

window.addEventListener('popstate', e => {
  // navDrop 이 부른 back 이 돌아왔다. 화면은 이미 목록이므로 되돌릴 것이 없고,
  // 그 사이에 다른 화면으로 들어갔다면 여기서 다시 쌓는다.
  if (navDropping) { navDropping = false; navArm(); return; }
  // 앞으로 가기로 우리 항목에 **다시 들어왔다.** 화면은 그대로 두고 소유만 되찾는다.
  if (e && e.state && e.state[NAV_MARK]) { navPushed = 1; return; }
  if (!navPushed) return;   // 우리가 쌓은 항목이 아니다
  navPushed = 0;
  const was = state.phase;
  goBack();
  navArm();                 // 아직 목록이 아니면 다음 한 번을 위해 다시 쌓는다
  // **목록에서 소비된 항목은 되돌릴 화면이 없다.** 이어받은 새로고침 전 항목이
  // 그것뿐이다(위 replaceState). 여기서 그냥 끝내면 그 한 번이 아무 일도 안 한 것이
  // 되므로 — 즉 목록에서 뒤로가기를 두 번 눌러야 나가게 되므로 — **눌린 뜻대로 한 번
  // 더 뒤로 보낸다.** 항목은 유한하고 한 번에 하나씩 줄어드니 여기서 안 돈다.
  if (was === 'stage' && nav) nav.back();
});

// 「뒤로」 한 번이 하는 일. **열려 있는 것을 먼저 닫는다** — ESC 가 이미 그 규칙이라
// (아래 keydown) 뒤로가기가 다른 순서로 움직이면 같은 화면에서 두 키가 다른 뜻이 된다.
function goBack() {
  // mergePlace(#24)·소환 피커(#68) 둘 다 `state.picker` 다. 지우는 것으로 닫는 것은
  // ESC 와 한 글자도 안 다르다 — 두 모드 다 커밋 전에는 판을 안 건드린다(2.10).
  if (state.picker) { state.picker = null; return; }
  if (state.choice) return;                      // 분기 선택은 되돌릴 수 없으니 안 닫는다
  if (state.paused) { togglePause(); return; }   // 덮개를 먼저 걷는다
  if (state.phase === 'stage') return;           // 목록이 끝이다. 더 뒤는 페이지 밖이다
  if (state.phase === 'deck') { restart(); return; }
  if (state.phase === 'over' || state.phase === 'clear') { restart(); return; }
  // 판 중이다. **여기서 바로 안 나간다.** 나가면 잃는 것이 phase 마다 다르고(준비
  // 단계는 통째로 이어하기로 남지만 웨이브 중에는 그 웨이브가 날아간다), 그 사실을
  // 적어 두는 자리가 정지 화면의 나가기 줄이다(exitRunNote). 안드로이드에서 게임 중
  // 뒤로가기가 정지 메뉴를 여는 것과 같은 동작이고, **뒤로가기만으로는 진행이 절대
  // 안 날아간다**는 것이 이 한 줄의 값이다.
  togglePause();
}

// ESC 는 「뒤로」 키다. p 는 정지 전용이라 화면을 안 옮긴다 — 두 키를 한 함수로 묶으면
// 덱 화면에서 p 가 목록으로 나가는 화면이 된다.
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); navBack(); return; }
  if (e.key !== 'p' && e.key !== 'P') return;
  e.preventDefault();
  if (state.phase === 'stage' || state.phase === 'deck') return;
  if (state.picker) { state.picker = null; return; }
  if (state.choice) return;                 // 분기 선택은 되돌릴 수 없으니 안 닫는다
  togglePause();
});

function restart() {
  // 목록으로 나가는 **유일한 문**이라 여기서 history 항목을 걷는다(#74 · navDrop).
  // 나가는 경로가 넷(덱 뒤로 · 판 나가기 · 게임오버 탭 · 뒤로가기)이라 각자 걷게 하면
  // 하나만 빠뜨려도 목록에서 뒤로가기를 헛눌러야 하는 화면이 된다.
  navDrop();
  state.phase = 'stage';
  state.paused = false;
  state.deckPick = [];
  // 목록을 맨 위로 되돌린다. 판 상태가 아니라 화면 상태라 스냅샷에는 안 들어가고,
  // 여기서만 되돌린다 — 판을 끝내고 돌아왔을 때 목록 중간에서 시작하면 「내가
  // 어디에 있었지」가 된다. `laneCursor` 를 loadStage 에서 0 으로 돌리는 것과 같다.
  stageScroll = 0;
  state.wave = 0;
  state.timer = CFG.WAVE_GAP;
  state.gold = CFG.START_GOLD;
  state.essence = 0;
  state.life = CFG.START_LIFE;
  // **`openRows` 는 여기서 안 되돌린다.** 위의 `wave`·`gold`·`life` 와 달리 판에
  // 딸린 값이라, 판을 고르기 전인 여기서 되돌리면 직전 판의 `CFG.OPEN_ROWS` 가
  // 들어간다. 주인은 `loadStage()` 다 — 이유는 그쪽 주석에 있다(#60).
  state.summonedThisWave = 0;
  state.towers.length = 0;
  state.enemies.length = 0;
  state.spawnQueue.length = 0;
  state.beams.length = 0;
  state.shells.length = 0;
  state.patches.length = 0;
  state.blasts.length = 0;
  resetParticles();
  resetCorpses();
  resetImpact();
  state.selected = null;
  clearChoices();
  state.picker = null;
  state.deck = [];
}

// ═════════════════════════════════════════════════════════════
// 진행
// ═════════════════════════════════════════════════════════════
function rushWave() {
  if (state.phase !== 'build') return;
  // 보상은 없다. 대기 시간을 건너뛰는 것 자체가 이득이고,
  // 골드까지 주면 항상 누르는 게 정답이라 선택이 아니게 된다.
  state.timer = 0;
  startWave();
}

// 웨이브 편성을 스폰 예약 목록으로 편다.
function buildSpawnQueue(wave) {
  const groups = waveGroups(wave);
  const q = [];
  let t = 0;
  for (const [kind, count] of groups) {
    const gap = SPAWN_GAP[kind] || SPAWN_GAP_DEFAULT;
    for (let i = 0; i < count; i++) { q.push({ kind, at: t }); t += gap; }
    t += 1.2;   // 그룹 사이 숨돌릴 틈
  }
  return q;
}

function startWave() {
  // **자리를 고르는 중에 웨이브가 시작돼도 모드를 그대로 둔다.** 예전에는 여기서
  // 지웠는데, 이유가 「mergeAllowed 가 준비 단계 전용이라 배치를 다 시켜 놓고
  // 마지막에 거절하는 화면이 된다」였다. 이제 웨이브 중에도 합성이 되므로 거절될
  // 일이 없다 — 끌고 가는 것이 맞다.
  //
  // 시계를 안 멈추는 전제는 그대로다(멈추면 열고 닫기만으로 준비 시간을 무한히
  // 늘릴 수 있다). 그래서 고르는 동안 웨이브가 그냥 시작되고 적이 흐른다. 그게
  // 이제는 손해가 아니라 **선택의 값이다** — 전투 중에 합칠지, 한 박자 기다릴지.
  state.wave++;
  state.phase = 'wave';
  state.waveT = 0;
  state.summonedThisWave = Math.floor(state.summonedThisWave * 0.7);
  state.spawnQueue = buildSpawnQueue(state.wave);
}

let laneCursor = 0;

function spawnEnemy(kind) {
  const d = ENEMY[kind];
  const hp = d.hp * waveHp(state.wave) * STAGES[state.stage].hpMult;
  const lane = lanes.length > 1 ? (laneCursor++ % lanes.length) : 0;
  const start = lanes[lane].points[0];
  state.enemies.push({
    id: nextEnemyId++, kind, hp, maxHp: hp,
    lane, dist: 0, x: start.x, y: start.y,
    // 이동 벡터와 지금 보고 있는 쪽. 아직 한 칸도 안 갔으니 기존 그림(down)이다.
    mvx: 0, mvy: 0, face: 'down',
    hitFlash: 0, dead: false,
    armorStacks: 0, armorPer: 2, armorCap: 0, armorFed: false,
    mresCut: 0, magicVuln: 0, physVuln: 0, arcResonance: 0, plagueT: 0, plagueCut: 0, plagueVuln: 0,
    healCut: 0, inDeepAura: false,
    slowAmt: 0, slowNext: 0, frostStacks: 0,
    frozen: 0, stun: 0, pendingVuln: false, vulnT: 0, markT: 0,
  });
}

function endWave() {
  state.phase = 'build';
  state.shells.length = 0;
  state.patches.length = 0;
  state.timer = CFG.WAVE_GAP;
  state.gold += Math.round(CFG.GOLD_BASE * Math.pow(CFG.GOLD_GROWTH, state.wave));

  // 조폐소 수입. 성급 계수를 그대로 타는 이유는, 딜러와 같은 슬롯·같은 합성
  // 비용을 두고 경쟁하기 때문이다. 고정값이면 덱 슬롯 낭비가 된다.
  for (const t of state.towers) {
    if (t.kind !== 'mint') continue;
    state.gold += Math.round(CFG.MINT_BASE * STAR_MULT[t.star]);
    if (t.b3 === 'A') state.gold += Math.min(40 * t.star, Math.round(state.gold * 0.03));
    if (t.b5 === 'A1') state.gold += Math.round(CFG.GOLD_BASE * Math.pow(CFG.GOLD_GROWTH, state.wave) * 0.25);
  }

  if (state.wave % 7 === 0) { state.essence++; toast('정수 +1'); }

  // 행 개방. 5성이 2x2 를 먹기 때문에 보드가 안 늘어나면 6성 이상이 물리적으로
  // 불가능하다(시뮬에서 최고 성급이 5에 고정됐다).
  if (CFG.UNLOCK_AT.includes(state.wave) && state.openRows < CFG.BOARD_H) {
    state.openRows = Math.min(CFG.BOARD_H, state.openRows + 2);
    toast('보드 확장');
  }
  if (state.wave >= CFG.WAVE_MAX) {
    state.phase = 'clear';
    // 「깼다」를 적는 **유일한 자리**다. 아래 best 갱신과 같은 줄에 두지 않는 것이
    // #45 의 전부다 — best 는 게임오버 경로(updateEnemies)도 같은 줄로 갱신한다.
    cleared[state.stage] = true;
    if (state.stage + 1 >= unlocked && unlocked < STAGES.length) {
      unlocked = state.stage + 2;
    }
  }

  // **도달 웨이브다 — 「깼다」가 아니다**(위 clear 분기의 cleared 가 그걸 적는다).
  best[state.stage] = Math.max(best[state.stage] || 0, state.wave);
  // 스냅샷은 준비 단계에서만 찍힌다. 클리어했으면 이어할 판이 없다.
  savedRun = state.phase === 'build' ? snapshotRun() : null;
  persist();
}

function enemySpeed(e) {
  return BASE_SPEED * ENEMY[e.kind].speed * (1 - (e.slowAmt || 0));
}

function updateEnemies(dt) {
  const survivors = [];
  for (const e of state.enemies) {
    const d = ENEMY[e.kind];
    if (e.hitFlash > 0) e.hitFlash -= dt;

    // 타이머
    // 오라 밖에서는 초당 3씩 빠진다. 4초 뒤 한 번에 0 으로 만들면
    // 언제 풀렸는지 알 수가 없고 막대가 뚝 사라진다.
    if (!e.armorFed && e.armorStacks > 0) {
      e.armorStacks = Math.max(0, e.armorStacks - 3 * dt);
      if (e.armorStacks === 0) e.armorCap = 0;
    }
    e.plagueT -= dt;
    e.markT -= dt;
    e.vulnT -= dt;
    e.stun -= dt;
    if (e.frozen > 0) {
      e.frozen -= dt;
      if (e.frozen <= 0 && e.pendingVuln) { e.pendingVuln = false; e.vulnT = 3; }
    }

    // 슬로우는 전부 오라라서 매 프레임 다시 계산된다. 소스가 여러 개면
    // 합산이 아니라 최댓값을 쓴다 — 합산하면 서리탑 도배가 곧 정답이 된다.
    e.slowAmt = Math.min(CFG.SLOW_CAP, e.slowNext || 0);

    if (d.regen) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * d.regen * (1 - e.healCut) * dt);

    if (e.frozen > 0 || e.stun > 0) { survivors.push(e); continue; }

    e.dist += enemySpeed(e) * dt;
    if (e.dist >= laneLen(e.lane)) {
      state.life -= d.leak;
      // 누수는 화면 층 경고만 낸다. 흔들림도 히트스톱도 파편도 없다(2.6·2.8).
      // += 가 아니라 = 다 — 누수가 몰리는 구간에서 알파가 누적되면 판이 안 보인다.
      leakWarnT = LEAK_WARN_DUR;
      // 경고음도 화면 층이다. 2.6 이 누수에 금지한 것은 파편·셀 좌표·killEnemy
      // 경로이고, 소리는 그 셋을 하나도 안 쓴다.
      sfx('leak');
      continue;
    }
    const p = posAt(e.dist, e.lane);
    // 이동 벡터. 그림이 어느 쪽을 보는지의 정본이다(enemyFacing). 경로 기하를
    // 다시 푸는 대신 **실제로 움직인 만큼**을 그대로 쓴다 — posAt 의 구간 찾기를
    // 한 벌 더 두면 둘이 갈렸을 때 몸과 그림이 다른 데를 보게 된다.
    // 세이브에는 안 들어간다. 스냅샷(snapshotRun)은 준비 단계에서만 찍고 적을
    // 아예 안 담으므로 SAVE_VERSION 은 그대로다.
    // **0 이면 안 덮는다.** 빙결·기절은 위에서 continue 로 빠지지만, 슬로우가
    // 극단이면 여기까지 와서 델타가 0 에 수렴한다 — 그때 0 으로 덮으면 방향이 튄다.
    const mvx = p.x - e.x, mvy = p.y - e.y;
    if (mvx || mvy) { e.mvx = mvx; e.mvy = mvy; }
    e.x = p.x; e.y = p.y;
    survivors.push(e);
  }
  state.enemies = survivors;

  if (state.life <= 0) {
    state.life = 0;
    state.phase = 'over';
    // 마지막 웨이브 **도중**에 죽어도 여기서 best 는 그 판의 총웨이브가 된다
    // (startWave 가 클리어 검사보다 먼저 wave 를 올린다). 그래서 해금은 best 를
    // 안 보고 cleared 를 본다 — 이 줄이 #45 의 발원지였다.
    best[state.stage] = Math.max(best[state.stage] || 0, state.wave);
    savedRun = null;
    persist();
  }
}

// ═════════════════════════════════════════════════════════════
// 처치 파편
// ═════════════════════════════════════════════════════════════
// 적이 사라지는 순간이 화면에서 안 읽힌다 — HP 바가 없어지는 게 전부라
// 죽인 건지 관문으로 샌 건지가 구분이 안 된다. 그래서 처치에만 파편을 뿌린다.
// 관문 도달은 처치가 아니므로 여기 붙이지 않는다(누수를 처치처럼 보이게 하면 최악).
//
// 좌표는 beams/blasts 와 같은 셀 좌표계다. 픽셀로 저장하면 화면 크기가 바뀌는
// 순간(회전·키보드) 이미 떠 있는 파편만 엉뚱한 자리에 남는다.

const PARTICLE_CAP = 360;       // 동시 파편 상한
const PARTICLE_GRAVITY = 5.0;   // 칸/초^2
const PARTICLE_LIFE = 0.3;      // 초

// 타격 3박자(총구 화염 → 빔 → 착탄 스파크)의 수명.
//
// 배속은 dt 를 키우지 않고 update 를 여러 번 돈다. frame() 은 실제 프레임 간격
// (상한 0.05초)을 배속만큼 반복하므로 렌더 1프레임 사이에 흐르는 게임시간의
// 최악값은 x4 에서 4x0.05 = 0.20초다. 60fps 라는 전제로 4x1/60 = 0.0667 을
// 잡으면 30fps 기기 x4(0.133초)에서 틀린다 — 실측으로 화염이 통째로 안 그려졌다.
// 그래서 수명으로 해결하지 않고 muzzle() 의 mzShown 래치로 잠갔다. 이 값은
// "x1 에서 몇 프레임 보일지"만 정한다(60fps 에서 약 4프레임).
const MUZZLE_LIFE = 0.07;       // 초
// 처치 파편(0.3)보다 짧아야 "맞았다"와 "죽었다"가 안 섞인다.
// 파티클은 태어난 스텝에서 감쇠하지 않으므로 한 렌더 프레임에 최대 3번(3x0.05
// = 0.15초) 깎인다 — 0.20 이면 최악 배속에서도 0.05 가 남아 반드시 한 번 그려진다.
const SPARK_LIFE = 0.20;        // 초

// 연출 전용 난수. 전역 Math.random 은 절대 쓰지 않는다 —
// 관측소 치명(25%), 조폐소 약탈(25%), 소환 자리, 덱·특성 롤이 전부 같은
// 스트림이라 처치할 때마다 난수를 한 번 뽑으면 그 뒤의 모든 판정이 밀린다.
// 밸런스를 한 줄도 안 고쳤는데 시뮬 결과가 바뀐다. tools/seedcheck.js 가 이걸 감시한다.
let fxSeed = 0x9e3779b9;
function fxRand() {
  fxSeed = (fxSeed * 1664525 + 1013904223) >>> 0;
  return fxSeed / 4294967296;
}
// 테스트에서만 쓰는 창(tools/sim.js EXPOSE). hitstopState() 와 같은 형태다.
// 이게 필요한 이유는 2.9 다 — 사운드가 이 스트림을 한 칸이라도 밀면, 소리를 낸 판과
// 안 낸 판(음소거·미개방)에서 파티클 각도가 갈린다. 그 회귀는 게임 상태에 아무 흔적을
// 안 남기고 verify:build 의 두 페이지 그림 차이로만 나타나는데, verify:build 는
// pointerdown 을 한 번도 안 보내서 오디오를 아예 안 연다. 그래서 여기서 직접 잰다.
function fxState() { return fxSeed; }

// 링 버퍼. 배열 길이를 줄이지 않고 alive 플래그로 재사용한다 —
// 장판(서리·소이·동상)은 한 프레임에 여러 마리를 동시에 죽이므로
// filter 로 매 프레임 새 배열을 만들면 그 순간마다 쓰레기가 쏟아진다.
let particleFree = [];          // 비어 있는 슬롯 인덱스
let particleCursor = 0;         // 상한에 닿았을 때 덮어쓸 자리

function resetParticles() {
  state.particles.length = 0;
  particleFree.length = 0;
  particleCursor = 0;
}

function allocParticle() {
  const arr = state.particles;
  while (particleFree.length) {
    const i = particleFree.pop();
    if (i < arr.length && !arr[i].alive) return arr[i];
  }
  if (arr.length < PARTICLE_CAP) {
    const p = {
      alive: false, x: 0, y: 0, vx: 0, vy: 0,
      t: 0, life: PARTICLE_LIFE, color: '#fff', shape: 'shard',
      size: 0.07, rot: 0, spin: 0, grav: 1,
    };
    arr.push(p);
    return p;
  }
  // 상한을 넘으면 생성을 막지 말고 슬롯 순서대로 덮어쓴다. 막으면 방금 죽은 적의
  // 연출만 통째로 빠져서, 하필 제일 봐야 할 것이 안 보인다.
  // 덮어쓰는 순서는 나이 순이 아니라 인덱스 순이다 — 프리 리스트로 슬롯을 한 번이라도
  // 재활용하면 인덱스 순서와 나이 순서가 어긋난다. 상한에 닿는 건 장판이 수십 마리를
  // 한꺼번에 죽인 프레임뿐이고 그때는 전부 같은 프레임에 태어나서 나이가 같으므로,
  // 정확한 나이 순서를 지키려고 힙을 얹을 값이 없다.
  const p = arr[particleCursor];
  particleCursor = (particleCursor + 1) % arr.length;
  return p;
}

function aliveParticles() {
  let n = 0;
  for (const p of state.particles) if (p.alive) n++;
  return n;
}

// 처치 연출. type 은 마지막 타격의 딜 타입이다.
// 우선순위는 빙결 > 물리 > 마법 > 그 외(순수·미전달)이고, 순수와 미전달은
// 물리와 같은 그림으로 떨어진다. fallback 이 없으면 마력로 순수광선이나
// 서리탑 동상으로 죽였을 때, 즉 면역몹 상대 빌드에서만 연출이 사라진다.
function spawnKillFx(e, type) {
  const d = ENEMY[e.kind];
  const frozen = e.frozen > 0;

  // 보드 바닥이 #1a212e/#1d2533 이라 적 색을 그대로 뿌리면 어두운 파편이 묻힌다.
  // 스프라이트는 외곽선으로 푸는데(DESIGN.md 2.5) 파편은 너무 작아서 그 수단을
  // 못 쓴다. 대신 흰색 쪽으로 한 번 밀어 최소 대비를 만든다.
  const color = frozen ? '#79c0ff' : mixHex(d.color, '#ffffff', 0.35);

  // 몸집만큼 파편이 나온다. 군집(r 0.15) 8개, 보병(0.26) 9개, 정예(0.42) 10개.
  const n = 6 + Math.round(d.r * 10);
  const magic = !frozen && type === 'magic';

  // 빙결은 얼음이 떨어져 나가는 그림이라 중력이 세다.
  const grav = frozen ? 1.8 : 1;
  const speed = 1.8 + d.r * 2.4;
  const base = fxRand() * Math.PI * 2;   // 시작 각도만 흔든다. 등각은 유지

  for (let i = 0; i < n; i++) {
    const p = allocParticle();
    p.alive = true;
    p.x = e.x + 0.5;
    p.y = e.y + 0.5;
    p.t = p.life = PARTICLE_LIFE;
    p.color = color;
    p.grav = grav;

    // 마법은 확장하는 링 하나 + 원형 잔광. 링은 제자리에서 커진다.
    if (magic && i === 0) {
      p.shape = 'ring';
      p.vx = p.vy = 0;
      p.grav = 0;
      p.size = d.r * 1.1;
      p.rot = p.spin = 0;
      continue;
    }

    const a = base + i * Math.PI * 2 / n + (fxRand() - 0.5) * 0.6;
    const sp = speed * (0.65 + fxRand() * 0.7);
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp - 0.6;   // 살짝 위로 튄다
    p.shape = frozen ? 'ice' : magic ? 'glow' : 'shard';
    p.size = (magic ? 0.055 : 0.05) + d.r * 0.12;
    p.rot = fxRand() * Math.PI * 2;
    p.spin = magic ? 0 : (fxRand() - 0.5) * 22;
  }
}

// 착탄 스파크. 빔이 닿은 표면에서 되튀는 여파고, 처치 파편과 헷갈리면 안 된다.
// 그래서 개수는 처치(8~10)보다 적고, 수명은 짧고, 색은 적 색이 아니라 타워 색이다.
// 딜 타입으로 색을 가르지 않는다 — 속성 상성은 7장에서 기각했다.
const SPARK_N = 4;
const SPARK_SPEED = 2.2;    // 칸/초. 수명 동안 0.44칸 — 처치 파편(0.75칸)보다 덜 퍼진다
const SPARK_GRAV = 0.4;     // 여파는 튀는 그림이지 떨어지는 그림이 아니다

function spawnSparks(t, e) {
  const c = towerCenter(t);
  const dx = e.x + 0.5 - c.x, dy = e.y + 0.5 - c.y;
  const len = Math.hypot(dx, dy) || 1;   // 적이 타워와 같은 칸이면 0 이 된다
  const ux = dx / len, uy = dy / len;

  // 적 중심이 아니라 타워 쪽 표면이다. 중심에서 뿌리면 몸 안에서 나온 것처럼 보인다.
  const r = ENEMY[e.kind].r;
  const px = e.x + 0.5 - ux * r, py = e.y + 0.5 - uy * r;

  // 보드 바닥이 어두워서 타워 색을 그대로 쓰면 묻힌다(2.6 과 같은 이유).
  // 발당 한 번만 계산해 4개가 공유한다.
  const color = mixHex(KINDS[t.kind].color, '#ffffff', 0.45);

  // 빔 진행의 역방향으로 튄다. 등방으로 뿌리면 처치 파편과 구분이 안 된다.
  const back = Math.atan2(-uy, -ux);

  for (let i = 0; i < SPARK_N; i++) {
    const p = allocParticle();
    p.alive = true;
    p.x = px;
    p.y = py;
    p.t = p.life = SPARK_LIFE;
    p.color = color;
    p.grav = SPARK_GRAV;
    const a = back + (fxRand() - 0.5) * (Math.PI * 2 / 3);   // 역방향 ±60도
    const sp = SPARK_SPEED * (0.6 + fxRand() * 0.8);
    p.vx = Math.cos(a) * sp;
    p.vy = Math.sin(a) * sp;
    p.shape = 'spark';
    p.size = 0.08;
    p.rot = Math.atan2(p.vy, p.vx);   // 선을 진행 방향으로 눕힌다
    p.spin = 0;
  }
}

// ── 처치 잔상 (squash) ───────────────────────────────────────
// 파편(2.6)이 "여기서 뭔가 터졌다"를 알리는 데는 성공했지만, **터진 게 그 적이었는지**
// 는 여전히 안 읽혔다. 적 스프라이트가 한 프레임 만에 통째로 사라지기 때문이다.
// 그래서 죽은 적의 실루엣을 짧게 남기고 가로로 퍼뜨리며 세로로 누른다.
//
// **파티클 풀에 안 넣고 별도 목록을 쓰는 이유가 셋이다.**
//  ① drawParticles() 는 "파편 1개당 fill 또는 stroke 정확히 1회"가 규약이고
//     tools/test.js 가 그 1:1 을 센다. 잔상은 스프라이트라 drawImage 한 번이고
//     fill/stroke 를 0회 낸다 — 같은 풀에 넣는 순간 그 규약이 조용히 깨진다.
//  ② 파티클 상한 360 은 2.7 에서 스파크 몫까지 포함해 시뮬로 잰 예산이다.
//     잔상이 같은 예산을 먹으면 버스트 때 하필 방금 죽은 적의 **파편**이 밀려난다.
//  ③ 잔상은 속도·중력·회전·도형이 전부 없고 대신 kind 를 든다. 같은 슬롯에 두면
//     한쪽에서만 쓰는 필드가 절반씩 놀고, 어느 필드가 누구 것인지가 안 읽힌다.
// 대신 상한·초기화·감쇠 **규칙**은 파티클과 똑같이 간다 — 링 버퍼 + alive 플래그,
// 상한에 닿으면 생성을 막지 말고 덮어쓰기, 판 갈이 함수에서 잔여 0.
//
// 좌표는 파편과 같은 셀 좌표계다. 픽셀로 저장하면 화면이 리사이즈되는 순간
// 떠 있던 잔상만 엉뚱한 자리에 남는다.

// 파편 수명 0.3 보다 짧다. 잔상은 "사라지는 과정"이라 파편보다 먼저 걷혀야
// 마지막에 남는 그림이 파편이 된다 — 반대면 파편이 걷힌 빈자리에 적 실루엣만
// 남아서 "아직 안 죽었나" 로 읽힌다.
const CORPSE_LIFE = 0.18;       // 초
// 가로로 얼마나 퍼지고 세로로 얼마나 눌리는지. 세로를 더 크게 잡아야 눌린 것으로
// 읽힌다 — 두 값이 같으면 면적이 유지돼 그냥 "옆으로 늘어난 적"이 된다.
const CORPSE_WIDEN = 0.55;      // 끝에서 가로 x1.55
const CORPSE_FLATTEN = 0.75;    // 끝에서 세로 x0.25
// 처치 1회는 파편을 최소 8개(군집) 낸다. 파편 상한 360 에 닿으려면 0.3초 안에
// 처치가 45회 겹쳐야 하고, 잔상 수명(0.18)은 그보다 짧으니 동시 잔상은 45를 못 넘는다.
// 2배 여유로 90. 상한을 파편과 같은 360 으로 두면 실제로는 절대 안 닿는 숫자라
// "상한에 닿으면 덮어쓴다" 경로가 영영 안 돌아 죽은 코드가 된다.
const CORPSE_CAP = 90;

let corpseFree = [];            // 비어 있는 슬롯 인덱스
let corpseCursor = 0;           // 상한에 닿았을 때 덮어쓸 자리

function resetCorpses() {
  state.corpses.length = 0;
  corpseFree.length = 0;
  corpseCursor = 0;
}

function allocCorpse() {
  const arr = state.corpses;
  while (corpseFree.length) {
    const i = corpseFree.pop();
    if (i < arr.length && !arr[i].alive) return arr[i];
  }
  if (arr.length < CORPSE_CAP) {
    const c = { alive: false, kind: 'grunt', color: '#fff', face: 'down', x: 0, y: 0, t: 0 };
    arr.push(c);
    return c;
  }
  // allocParticle 과 같은 이유로 막지 않고 덮어쓴다. 막으면 하필 방금 죽은 적의
  // 잔상만 통째로 빠져서, 제일 봐야 할 것이 안 보인다.
  const c = arr[corpseCursor];
  corpseCursor = (corpseCursor + 1) % arr.length;
  return c;
}

function aliveCorpses() {
  let n = 0;
  for (const c of state.corpses) if (c.alive) n++;
  return n;
}

// 잔상 진행도. 그리는 쪽과 테스트가 같은 식을 보게 하려고 따로 뺐다 —
// 테스트가 비율을 손으로 베끼면 값을 고쳤을 때 테스트만 옛 값을 지키며 통과한다.
function corpseScale(c) {
  const u = 1 - Math.max(0, c.t) / CORPSE_LIFE;   // 0 → 1
  return { sx: 1 + CORPSE_WIDEN * u, sy: 1 - CORPSE_FLATTEN * u, alpha: 1 - u };
}

// **색은 고정값만 넣는다.** sprite() 가 `key|color` 로 캐시를 굽기 때문에, 알파를
// 섞은 색이나 진행도로 보간한 색을 넘기면 처치할 때마다 — 심하면 프레임마다 —
// 새 캔버스가 구워져서 sprCache 가 무한히 커진다. 흐려지는 것은 ctx.globalAlpha 가 한다.
// 두 값 모두 drawEnemies 가 이미 굽는 색이라 캐시 항목이 새로 늘지도 않는다.
function spawnCorpse(e) {
  const c = allocCorpse();
  c.alive = true;
  c.kind = e.kind;
  c.color = e.frozen > 0 ? '#79c0ff' : ENEMY[e.kind].color;
  c.face = e.face;
  c.x = e.x + 0.5;
  c.y = e.y + 0.5;
  c.t = CORPSE_LIFE;
}

function updateCorpses(dt) {
  const arr = state.corpses;
  for (let i = 0; i < arr.length; i++) {
    const c = arr[i];
    if (!c.alive) continue;
    c.t -= dt;
    if (c.t <= 0) { c.alive = false; corpseFree.push(i); }
  }
}

function updateParticles(dt) {
  const arr = state.particles;
  for (let i = 0; i < arr.length; i++) {
    const p = arr[i];
    if (!p.alive) continue;
    p.t -= dt;
    if (p.t <= 0) { p.alive = false; particleFree.push(i); continue; }
    p.vy += PARTICLE_GRAVITY * p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.spin * dt;
  }
}

// 타격 효과는 웨이브가 끝나도 사라져야 한다. 감쇠를 전투 루프 안에 두면
// 마지막 한 방의 빔이 화면에 그대로 남는다.
function decayEffects(dt) {
  for (const b of state.beams) b.t -= dt;
  state.beams = state.beams.filter(b => b.t > 0);
  for (const b of state.blasts) b.t -= dt;
  state.blasts = state.blasts.filter(b => b.t > 0);
  updateParticles(dt);
  // 잔상 감쇠도 여기다. update() 밖에서 실시간 dt 로 돌리면 tools/shot.js 의
  // __freeze() 가 못 잡아서 같은 코드가 실행마다 다른 그림을 찍는다(2.8 의 shake 사례).
  updateCorpses(dt);
}

// ═════════════════════════════════════════════════════════════
// 충격 등급
// ═════════════════════════════════════════════════════════════
// 2.6 이 "죽었다"를, 2.7 이 "타워가 일하고 있다"를 읽히게 만들고 나니 이번에는
// 화면 위의 모든 사건이 **같은 무게**로 보이는 게 남았다. 잡몹 한 마리와 정예
// 한 마리가 똑같이 사라지고, 박격포 한 발과 빔 한 줄이 똑같이 지나간다.
// 그래서 사건마다 등급을 매기고, 그 등급표를 코드로 잠근다.
//
//   일반 타격 · 오라/지속딜 · **일반 처치** : 아무것도 없음
//   박격포 착탄                             : 약한 흔들림 (쿨다운으로 듀티 제한)
//   정예 처치                               : 강한 흔들림 + 히트스톱
//   누수                                    : 화면 층 붉은 비네트만
//
// 2.7 과 마찬가지로 이 절의 핵심은 넣는 자리가 아니라 **안 넣는 자리**다.
// 일반 처치에 히트스톱을 넣으면 웨이브 20 처럼 처치가 연쇄하는 구간에서 화면이
// 초당 수십 번 얼어붙어 배속이 무의미해진다. 정예는 판 전체에 15마리뿐이라
// (w10:1 · w20:3 · w24:3 · w28:4 · w30:4) 그 15번만 시간이 멎는다.
// 누수에 흔들림이나 파편을 붙이는 것은 2.6 이 금지한 "새는 걸 처치처럼 보이게
// 하는 거짓말"이 결만 바꿔 되살아나는 것이라 하지 않는다 — 누수는 보드 층이
// 아니라 화면 층에서, 처치와 정반대 결(붉은 비네트)로만 말한다.
//
// 상태를 state 가 아니라 모듈 레벨에 두는 이유: state 에 넣으면 snapshotRun 의
// 감시 대상이 되어 SAVE_VERSION 논의가 딸려 온다. 이건 판의 진행이 아니라
// 카메라 이야기라 세이브에 실릴 값이 아니다.

// 흔들림 진폭은 **셀 단위**다. 픽셀로 저장하면 화면 회전·리사이즈로 view.cell 이
// 바뀌는 순간 진폭만 옛 화면 크기에 남는다.
const BLAST_SHAKE_AMP = 0.05;   // cell 50px 기준 2.5px. 타워 표시가 셀의 82%(2.5)라 그 1/16 —
                                // "칸이 어긋나 보이는" 문턱 바로 아래다
const BLAST_SHAKE_DUR = 0.08;   // 쿨다운(0.25)과 합쳐 듀티 상한 32%
const BLAST_SHAKE_CD  = 0.25;   // 박격포 A(연발) 7성 cd 0.8초짜리가 여럿 + 탄막(A1) 3발이면
                                // 한 프레임에 착탄이 겹친다. 초당 최대 4회로 자른다
const KILL_SHAKE_AMP  = 0.14;   // 착탄의 2.8배(약 7px). 두 등급이 눈으로 갈리는 최소 배수다.
                                // 2배면 "좀 센 착탄"으로 읽히고 4배면 UI 가 흔들린 걸로 오해된다
const KILL_SHAKE_DUR  = 0.22;   // 처치 파편 수명 0.3초(2.6) 안에서 끝난다. 파편이 사라진 뒤에도
                                // 흔들림만 남으면 무엇 때문에 흔들렸는지가 안 읽힌다
const HITSTOP         = 0.05;   // 60Hz 3프레임 / 30Hz 2프레임. 2.7 과 같은 이유로 프레임 수가
                                // 아니라 초로 적는다 — 프레임 수로 적으면 30fps 기기에서 두 배 멎는다
const LEAK_WARN_DUR   = 0.35;
const LEAK_WARN_A     = 0.22;   // 비네트 최대 알파. 누수가 몰리는 구간(w21)에서는 사실상 상시라
                                // 이 값을 넘겨 겹치면 판이 안 보인다. 그래서 누적하지 않고 덮어쓴다
const SHAKE_FX = 62;            // 흔들림 x축 각속도(rad/s)
const SHAKE_FY = 71;            // y축. 62 와 서로소에 가까워 두 축의 주기가 겹치지 않는다 —
                                // 같은 값이면 대각선으로만 왕복해서 "밀렸다"로 읽힌다

let shake = { t: 0, dur: 0, amp: 0 };
let shakeCd = 0;                // 착탄 흔들림 듀티 제한
let hitstopT = 0;
let leakWarnT = 0;
let shakeToggleRect = null;     // 정지 화면의 흔들림 토글. drawPause 가 세우고 pointerdown 이 읽는다

// 기기 로컬 플래그다. 세이브 번들·클라우드 동기화에 안 넣는다 — "이 기기·이 사람이
// 흔들림을 견디나"는 판의 진행이 아니라서 다른 기기로 따라갈 이유가 없다.
// (cant-hold-tute 와 같은 형태. SAVE_VERSION 도 안 올린다.)
// 저장값이 없으면 OS 의 "동작 줄이기" 설정을 기본값으로 삼는다.
let shakeEnabled = true;
try {
  const v = localStorage.getItem('cant-hold-shake');
  shakeEnabled = v === null
    ? !window.matchMedia?.('(prefers-reduced-motion: reduce)')?.matches
    : v === '1';
} catch { /* 무시 */ }

function setShakeEnabled(v) {
  shakeEnabled = !!v;
  if (!shakeEnabled) shake.t = 0;   // 끄는 순간 진행 중이던 흔들림도 죽는다. 안 그러면
                                    // 껐는데 0.2초 더 흔들려서 스위치가 안 먹은 것처럼 보인다
  try { localStorage.setItem('cant-hold-shake', shakeEnabled ? '1' : '0'); } catch { /* 저장 못 해도 됨 */ }
}
function toggleShake() { setShakeEnabled(!shakeEnabled); }

// 합치기는 **최댓값**이다. 합산이 위험한 건 착탄끼리가 아니다 — 같은 프레임에 3발이
// 떨어져도 위의 shakeCd 게이트가 bumpShake 를 한 번만 통과시킨다. 진짜 뒤집히는 경로는
// **같은 프레임에 착탄 + 정예 처치**다(박격포 한 발이 정예를 죽이는 흔한 경우).
// 합산이면 0.05 + 0.14 = 0.19 라 정예 처치 단독보다 센 흔들림이 나와서, 그 프레임만
// 등급표의 맨 윗칸을 넘어선다. 남은 진폭(amp x 남은 비율)보다 약한 흔들림은
// 진행 중인 것을 덮지도 않는다.
function bumpShake(amp, dur) {
  if (amp <= shake.amp * (shake.t / shake.dur)) return;
  shake.amp = amp;
  shake.dur = dur;
  shake.t = dur;
}

// 정예 4마리가 한 프레임에 죽어도 멎는 시간은 1회분이다. 합산하면 후반 웨이브에서
// 0.2초씩 멎어 "렉 걸렸다"로 읽힌다.
function bumpHitstop() { hitstopT = Math.max(hitstopT, HITSTOP); }

// 흔들림 오프셋은 shake 상태의 **순수 함수**다. 난수를 쓰지 않는다 —
// fxRand() 조차 안 쓴다. 매 렌더마다 fxSeed 를 밀면 verify:build 의 두 페이지가
// 프레임 수 차이 한 번에 갈리고(2.6 "연출은 전역 난수를 쓰지 않는다"의 같은 함정),
// 테스트가 오프셋 값을 단언할 방법도 없어진다.
function shakeOffset() {
  if (shake.t <= 0 || !shakeEnabled) return { x: 0, y: 0 };
  const k = shake.t / shake.dur;          // 선형 감쇠. 남은 시간이 곧 세기다
  const a = shake.amp * view.cell * k;
  return { x: a * Math.sin(shake.t * SHAKE_FX), y: a * Math.sin(shake.t * SHAKE_FY + 1.7) };
}

// 감쇠는 update 가 아니라 frame 이 돈다. update 에 넣으면 배속 x4 에서 흔들림이
// 4배 빨리 사라져서 "빠르게 돌리면 연출이 없어지는" 게임이 된다.
function decayShake(dt) {
  shakeCd -= dt;
  shake.t -= dt;
}

// 판을 갈아끼우거나 멈출 때 카메라를 원위치로 돌린다. 안 그러면 재개하는 순간
// 멈추기 직전의 흔들림이 남은 만큼 튀어 오른다.
function resetImpact() {
  shake.t = 0; shake.dur = 0; shake.amp = 0;
  shakeCd = 0;
  hitstopT = 0;
  leakWarnT = 0;
}

// 테스트에서만 쓰는 창(tools/sim.js EXPOSE). 게임 코드는 bumpHitstop 만 쓴다.
function hitstopState() { return hitstopT; }
function leakWarnState() { return leakWarnT; }
function setHitstop(v) { hitstopT = v; }

// 누수 경고. **화면 층**이라 보드 클립 밖·흔들림 변환 밖에서 그린다.
// 셀 좌표를 안 쓰고 파티클도 안 쓴다 — 그 둘이 2.6 이 누수에 금지한 것이다.
// 알파는 누적하지 않는다. leakWarnT 는 += 가 아니라 = 로 되살아나므로 누수가
// 몰려도 진하기가 이 값을 안 넘는다.
function drawLeakWarn() {
  if (leakWarnT <= 0) return;
  const k = Math.min(1, leakWarnT / LEAK_WARN_DUR);
  // createRadialGradient 는 안 쓴다. 이 파일은 그라디언트를 한 번도 안 쓰고,
  // 헤드리스 캔버스 스텁이 그리기 호출만 기록하므로 그라디언트 객체를 못 만든다.
  // 겹치지 않는 띠를 안쪽으로 옅어지게 깔면 같은 그림이 나온다(겹침이 없으니 누적도 없다).
  const depth = Math.min(view.w, view.h) * 0.20;
  const N = 10, s = depth / N;
  for (let i = 0; i < N; i++) {
    const o = i * s;
    const a = LEAK_WARN_A * k * Math.pow(1 - i / N, 1.6);
    ctx.fillStyle = `rgba(248,81,73,${a.toFixed(4)})`;
    ctx.fillRect(o, o, view.w - o * 2, s);                       // 위
    ctx.fillRect(o, view.h - o - s, view.w - o * 2, s);          // 아래
    ctx.fillRect(o, o + s, s, view.h - o * 2 - s * 2);           // 왼쪽
    ctx.fillRect(view.w - o - s, o + s, s, view.h - o * 2 - s * 2); // 오른쪽
  }
}

// ═════════════════════════════════════════════════════════════
// 2.9 사운드
// ═════════════════════════════════════════════════════════════
// 2.8 이 사건마다 등급을 매겼는데 그 등급이 눈에만 있었다. 화면을 안 보고 있으면
// 아무 일도 안 일어난 것과 같다. 그래서 같은 등급표를 귀로 한 벌 더 낸다.
// 등급표는 2.8 과 같은 것을 쓴다 — 새로 만들면 두 표가 조용히 갈린다.
//
// 이 절의 전부는 세 가지다.
//   ① 지연 개방 — 로드 시점에 AudioContext 를 만들지 않는다. 브라우저는 사용자
//      제스처 전에 만든 컨텍스트를 suspended 로 태우고, 헤드리스에는 AudioContext
//      자체가 없다. 그래서 pointerdown 에서만 연다(sfxUnlock).
//   ② 시계는 오디오 시계다 — 쿨다운을 게임 dt 로 재면 배속 x4 에서 쿨다운도 4배
//      빨리 풀리고, 히트스톱 프레임에는 dt 누적이 통째로 멈춘다. actx.currentTime 은
//      배속·히트스톱과 무관한 실시간 초다.
//   ③ 난수는 사운드 전용 스트림 — fxRand() 를 쓰면 음소거·미개방일 때 sfx() 가
//      조기 반환하므로 소리를 낸 판과 안 낸 판에서 fxSeed 가 갈린다. 그러면
//      파티클 각도가 달라져서 verify:build 의 두 페이지가 다른 그림을 그린다.
//      전역 Math.random 은 2.6 과 같은 이유로 금지다.

const SFX_MASTER = 0.6;      // 8보이스 x 피크 게인 합이 1.0 을 넘는다. 아래 컴프레서와 한 쌍이다
const SFX_VOICE_CAP = 8;     // 최악 동시 보이스가 약 4.0 이라 정상 플레이에서는 안 닿는다.
                             // 폭주할 때만 문 역할을 한다
const SFX_MASK_KILL = 0.30;  // 정예 처치음이 난 뒤 잡몹 처치음을 막는 시간(A-6)
const SFX_MUTE_RAMP = 0.02;  // 음소거 램프. 즉시 0 을 대입하면 울리던 소리가 딸깍 끊긴다
// onended 가 안 오는 환경(컨텍스트 close, 헤드리스 스텁)이 있다. voices 가 영영
// 안 줄면 상한에 막혀 소리가 통째로 죽으므로, stop() 예약 시각 + 이 여유를 지나면
// 강제로 회수한다. onended 가 정상으로 오면 그쪽이 먼저 줄이고 이건 빈 손이 된다.
const SFX_REAP_SLACK = 0.10;

let actx = null;
let sfxDead = false;         // 한 번 실패하면 다시 시도하지 않는다
let master = null, comp = null;
let voices = 0;
const sfxPlayed  = { shot: 0, blast: 0, kill: 0, killBig: 0, leak: 0 };
const sfxDropped = { shot: 0, blast: 0, kill: 0, killBig: 0, leak: 0 };
const sfxNextAt  = { shot: 0, blast: 0, kill: 0, killBig: 0, leak: 0 };
const sfxPending = [];       // { until, end } — 위 SFX_REAP_SLACK 참고
let soundToggleRect = null;  // 정지 화면의 소리 토글. drawPause 가 세우고 pointerdown 이 읽는다

// 기기 로컬 플래그다. shakeEnabled 와 같은 형태로 세이브 번들·클라우드에 안 넣고
// SAVE_VERSION 도 안 올린다. 기본값은 **켜짐**이다 — 대응할 미디어 쿼리가 없고,
// 첫 터치 전에는 AudioContext 가 안 열려서 예고 없이 소리가 날 창이 원리적으로 없다.
let soundEnabled = true;
try {
  const v = localStorage.getItem('cant-hold-sound');
  if (v !== null) soundEnabled = v === '1';
} catch { /* 무시 */ }

// 사운드 전용 LCG. fxRand() 와 **별개 시드**여야 한다(위 ③).
let sfxSeed = 0x2545f491;
function sfxRand() {
  sfxSeed = (sfxSeed * 1664525 + 1013904223) >>> 0;
  return sfxSeed / 4294967296;
}

// pointerdown 에서만 불린다. 멱등이다 — 탭 전환 후 복귀하면 컨텍스트가 백그라운드에서
// suspended 로 내려간 채 돌아오는데, 첫 터치 전용으로 만들면 그 뒤로 소리가 영영 안 난다.
function sfxUnlock() {
  if (sfxDead) return;
  if (!actx) {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { sfxDead = true; return; }        // 헤드리스 1차 방어
      actx = new AC();
      master = actx.createGain();
      master.gain.value = soundEnabled ? SFX_MASTER : 0;
      // 컴프레서 하나를 마스터 뒤에 문다. 없으면 8보이스가 겹칠 때 합이 1.0 을
      // 넘겨 클리핑으로 찢어진다 — 폰 스피커에서 특히 심하다.
      comp = actx.createDynamicsCompressor();
      master.connect(comp); comp.connect(actx.destination);
    } catch { sfxDead = true; actx = null; return; }   // 2차 방어
  }
  // iOS 는 AudioContext 가 suspended 로 태어난다. 탭 복귀 경로도 여기로 들어온다.
  if (actx.state === 'suspended') actx.resume?.();
}

// 전부 createOscillator + createGain 이다. 파일을 안 쓰는 이유는 2.5 와 같다 —
// 받는 시간이 없고 큐를 고칠 때 값만 만지면 된다.
// 감쇠는 exponentialRampToValueAtTime 인데 **목표가 0 이면 예외가 난다.**
// 그래서 0.0001 로 끝내고 stop() 한다.
function sfxTone(type, f0, f1, glide, atk, dec, peak, t) {
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t);
  // 하강 처프로 통일한다. 상승은 "얻음"으로 읽혀서 처치·발사에 안 맞는다.
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + glide);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + atk);
  g.gain.exponentialRampToValueAtTime(0.0001, t + atk + dec);
  o.connect(g); g.connect(master);
  o.start(t);
  o.stop(t + atk + dec);
  return o;
}

// 큐 테이블. 호출부는 이름만 안다 — 음색을 고치는 자리가 여기 하나여야
// "박격포 소리를 바꿨더니 처치음이 같이 바뀌는" 일이 안 생긴다.
//
// **파형이 큐마다 다른 게 핵심이다.** 같은 파형에 주파수만 다르면 겹쳤을 때
// 무엇이 무엇인지 안 갈린다. 길이는 항상 쿨다운보다 짧다 — 듀티가 100% 를 넘으면
// 자기 꼬리와 겹쳐서 그 자체로 하나의 톤이 된다(전 큐 듀티 <= 72%).
const SFX = {
  // 0.06s = 16.7Hz. 20Hz 를 넘기면 귀가 개별 사건이 아니라 하나의 버즈로 융합한다.
  // 통상 구간 상한(9발/초 = 111ms)의 절반보다 작아서 x1 통상 플레이에서는 드롭이 0 이다.
  shot: {
    cd: 0.06, spread: 0.06, len: 0.035,
    play(t, rate) { return sfxTone('square', 1800 * rate, 900 * rate, 0.030, 0.002, 0.033, 0.09, t); },
  },
  // 자체 쿨다운을 안 둔다(cd 0). 게이트는 updateShells 의 shakeCd 가 대신한다 —
  // 게이트를 공유하면 보이는 흔들림과 들리는 쿵이 항상 1:1 이라 "소리는 났는데
  // 안 흔들림"이 원리적으로 없다.
  blast: {
    cd: 0, spread: 0.04, len: 0.18,
    play(t, rate) {
      // ① 탁. 220Hz square 는 missing fundamental 로 저음을 암시하는 장치다.
      sfxTone('square', 220 * rate, 220 * rate, 0, 0.001, 0.028, 0.06, t);
      // ② 쿵. 하한이 70Hz 인 건 폰 스피커 때문이다 — 45Hz 까지 떨어뜨리면
      // 뒷부분이 통째로 안 들리고 "앞만 있고 끝이 없는" 소리가 된다.
      return sfxTone('sine', 150 * rate, 70 * rate, 0.16, 0.004, 0.176, 0.30, t);
    },
  },
  // 0.14s = 7.1Hz. 처치가 연쇄하는 구간의 간격(g=27~33ms)보다 훨씬 크다.
  kill: {
    cd: 0.14, spread: 0.05, len: 0.09,
    play(t, rate) { return sfxTone('triangle', 520 * rate, 260 * rate, 0.075, 0.001, 0.088, 0.07, t); },
  },
  // 판당 15회뿐이라(2.8) 길고 무겁게 낸다.
  killBig: {
    cd: 0.20, spread: 0.03, len: 0.30,
    play(t, rate) {
      sfxTone('square', 130 * rate, 130 * rate, 0, 0.002, 0.055, 0.05, t);   // ② 배음
      return sfxTone('triangle', 260 * rate, 90 * rate, 0.26, 0.002, 0.298, 0.16, t);  // ① 본체
    },
  },
  // **피치 스프레드가 0 인 유일한 큐다.** 경고음은 매번 같아야 경고로 읽힌다.
  // attack 도 혼자 10ms(다른 큐의 5~10배)다 — 느린 어택은 "타격"이 아니라 "상태"로
  // 읽힌다. sawtooth 는 거칠어서 불쾌한데, 누수는 불쾌해야 한다.
  leak: {
    cd: 0.35, spread: 0, len: 0.24,
    play(t, rate) { return sfxTone('sawtooth', 200 * rate, 130 * rate, 0.22, 0.010, 0.230, 0.13, t); },
  },
};

// 보이스 회수. 위 SFX_REAP_SLACK 참고.
function sfxReap(now) {
  for (let i = sfxPending.length - 1; i >= 0; i--) {
    if (sfxPending[i].until > now) continue;
    sfxPending[i].end();
    sfxPending.splice(i, 1);
  }
}

// 게이트 순서가 곧 명세다.
//   ① 컨텍스트·음소거 → ② 쿨다운 → ③ 보이스 상한 → ④ 계수 → ⑤ 재생
//
// **상한에 닿으면 드롭한다.** 2.6 의 파티클이 "막지 말고 덮어쓴다"인 것과 정반대인데,
// 이유가 정반대라서 그렇다 — 파편은 안 보이면 정보가 사라지지만 소리는 겹칠수록
// 나빠지므로 드롭이 곧 개선이다.
function sfx(name) {
  if (!actx || sfxDead || !soundEnabled) return false;
  const cue = SFX[name];
  const now = actx.currentTime;
  sfxReap(now);
  if (now < sfxNextAt[name]) { sfxDropped[name]++; return false; }
  if (voices >= SFX_VOICE_CAP) { sfxDropped[name]++; return false; }

  sfxNextAt[name] = now + cue.cd;
  sfxPlayed[name]++;
  // 등급 마스킹. 정예 처치 순간에 잡몹 처치음이 얹히면 2.8 이 흔들림으로 갈라 놓은
  // 등급이 귀에서 도로 뭉친다. 판당 15회뿐이라 비용이 없다.
  if (name === 'killBig') sfxNextAt.kill = now + SFX_MASK_KILL;

  voices++;
  let done = false;
  const end = () => { if (done) return; done = true; voices--; };
  try {
    const node = cue.play(now, 1 + (sfxRand() * 2 - 1) * cue.spread);
    if (node) node.onended = end;
  } catch { end(); return false; }
  sfxPending.push({ until: now + cue.len + SFX_REAP_SLACK, end });
  return true;
}

// 끄면 master.gain 을 램프로 내린다. 이후 sfx() 는 ①번 게이트에서 조기 반환하므로
// 노드를 아예 안 만든다 — 게인만 0 이면 안 들리는 소리를 계속 만들게 된다.
function setSoundEnabled(v) {
  soundEnabled = !!v;
  if (actx && master) {
    const now = actx.currentTime;
    master.gain.cancelScheduledValues(now);
    master.gain.setValueAtTime(master.gain.value, now);
    master.gain.linearRampToValueAtTime(soundEnabled ? SFX_MASTER : 0, now + SFX_MUTE_RAMP);
  }
  try { localStorage.setItem('cant-hold-sound', soundEnabled ? '1' : '0'); } catch { /* 저장 못 해도 됨 */ }
}
function toggleSound() { setSoundEnabled(!soundEnabled); }

// 헤드리스 검사 창(tools/sim.js EXPOSE). 2.6 의 draws 와 같은 취지지만 오디오에는
// 프록시 로그를 걸 자리가 없어서, 게임 코드 안의 큐별 카운터로 대신한다 —
// 2.8 이 hitstopState() 게터를 게임 코드에 둔 것과 같은 전례다.
function sfxStats() {
  return { played: { ...sfxPlayed }, dropped: { ...sfxDropped }, voices, open: !!actx, enabled: soundEnabled };
}

function update(dt) {
  if (state.paused) return;

  if (state.toast) {
    state.toast.t -= dt;
    if (state.toast.t <= 0) state.toast = null;
  }
  for (const t of state.towers) if (t.flash > 0) t.flash -= dt;
  decayEffects(dt);

  if (state.phase === 'deck' || state.phase === 'stage') return;

  // 분기 선택 중에는 판을 멈춘다. 웨이브 도중에 5성이 나올 수 있는데
  // 그때 뒤에서 적이 계속 흐르면 고를 수가 없다.
  if (state.choice) return;

  if (state.phase === 'build') {
    // 첫 웨이브는 자동으로 안 온다. 판을 둘러보고 시작하게 둔다.
    if (state.wave > 0) {
      state.timer -= dt;
      if (state.timer <= 0) startWave();
    }
    return;
  }

  if (state.phase !== 'wave') return;

  state.waveT += dt;
  while (state.spawnQueue.length && state.spawnQueue[0].at <= state.waveT) {
    spawnEnemy(state.spawnQueue.shift().kind);
  }

  updateCombat(dt);
  updateEnemies(dt);

  if (state.phase === 'wave' && !state.spawnQueue.length && !state.enemies.length) endWave();
}

// ═════════════════════════════════════════════════════════════
// 렌더
// ═════════════════════════════════════════════════════════════

// ── 관문 ──────────────────────────────────────────────────────
// 레인이 보드를 빠져나가는 자리다. **레인의 마지막 점 위에 그리면 안 된다** —
// 그 점은 정의상 보드 밖이고(거기가 「나가는 곳」이다) render() 는 보드 rect 로
// 클립한 뒤 drawBoard() 를 부르므로 통째로 잘린다. 셀 중심에서 0.4칸 물러나도
// 여전히 밖이라 아홉 판 어디서도 한 번도 안 보였다 — 그리는 코드가 있으니
// 아무도 없는 줄 몰랐고, 스크린샷 수용 기준에 「보인다」로 적히기까지 했다(#58).
//
// 그래서 **보드 경계 안쪽에 붙여** 그린다. 나가는 면 위에 얹되 굵기의 절반만큼
// 안으로 민다 — 면 위에 정확히 얹으면 절반이 클립 밖이라 반만 보인다.
// **클립을 넓히는 쪽은 안 된다** — 보드 밖은 HUD·버튼 자리다.
//
// 좌표를 px 로 돌려주는 함수로 뺀 이유는 하나다: 검사가 **어디에 그었는지**를
// 볼 수 있어야 한다. 그리는 코드 안에만 있으면 잘리는 자리에 그어도 검사가
// 전부 통과한다(tools/test.js 「관문」이 이 함수와 실제 그리기 호출을 대조한다).
const GATE_W = 4;              // 선 굵기. 절반이 밖으로 나가면 반만 보인다
function gateLines() {
  const { cell, ox, oy } = view;
  const h = GATE_W / 2;
  const out = [];
  const seen = new Set();
  for (const L of lanes) {
    const a = L.points[L.points.length - 2], b = L.points[L.points.length - 1];
    const dx = Math.sign(b.x - a.x), dy = Math.sign(b.y - a.y);
    // 보드 안에서 마지막으로 밟는 칸. b 는 거기서 딱 한 칸 밖이다.
    const gx = b.x - dx, gy = b.y - dy;
    // ③⑤⑥⑧ 은 두 레인이 **같은 점**에서 나간다. 접지 않으면 같은 선을 두 번 긋는다.
    const key = gx + ',' + gy + ',' + dx + ',' + dy;
    if (seen.has(key)) continue;
    seen.add(key);
    const half = cell * 0.4;
    if (dx) {   // 좌우로 나간다 (④ 역류의 둘째 레인)
      const x = ox + (gx + (dx > 0 ? 1 : 0)) * cell - dx * h;
      const cy = oy + (gy + 0.5) * cell;
      out.push({ x1: x, y1: cy - half, x2: x, y2: cy + half });
    } else {    // 위아래로 나간다
      const y = oy + (gy + (dy > 0 ? 1 : 0)) * cell - dy * h;
      const cx = ox + (gx + 0.5) * cell;
      out.push({ x1: cx - half, y1: y, x2: cx + half, y2: y });
    }
  }
  return out;
}

function drawBoard() {
  const { cell, ox, oy } = view;
  const open = firstOpenRow();
  const U = 16;                              // 칸 하나를 16 도트로 본다
  const px = cell / U;
  const dot = (x, y, i, j, w, h, c) => {
    ctx.fillStyle = c;
    ctx.fillRect(Math.round(x + i * px), Math.round(y + j * px),
      Math.ceil(w * px), Math.ceil(h * px));
  };
  // 같은 칸은 늘 같은 무늬가 나오도록 좌표에서 값을 뽑는다
  const hash = (gx, gy) => ((gx * 73856093) ^ (gy * 19349663) ^ 0x9e3779b9) >>> 0;

  for (let gy = 0; gy < CFG.BOARD_H; gy++) {
    for (let gx = 0; gx < CFG.BOARD_W; gx++) {
      if (isPath(gx, gy)) continue;
      const { x, y } = cellToPx(gx, gy);
      dot(x, y, 0, 0, U, U, (gx + gy) % 2 ? '#1a212e' : '#1d2533');
      const h = hash(gx, gy);
      for (let n = 0; n < 4; n++) {
        const v = (h >> (n * 8)) & 255;
        dot(x, y, v & 15, (v >> 4) & 15, 1, 1, n < 2 ? '#222b3a' : '#161c27');
      }
    }
  }

  // 경로. 모서리 타일을 따로 만들지 않고, 이웃이 경로가 아닌 면에만 테두리를
  // 넣는다. 갈래길이든 교차로든 이 규칙 하나로 맞는다.
  for (let gy = 0; gy < CFG.BOARD_H; gy++) {
    for (let gx = 0; gx < CFG.BOARD_W; gx++) {
      if (!isPath(gx, gy)) continue;
      const { x, y } = cellToPx(gx, gy);
      dot(x, y, 0, 0, U, U, '#46515f');

      const h = hash(gx, gy);
      for (let n = 0; n < 4; n++) {
        const v = (h >> (n * 8)) & 255;
        dot(x, y, v & 15, (v >> 4) & 15, 1, 1, n < 2 ? '#4d5867' : '#3e4855');
      }

      const N = isPath(gx, gy - 1), S = isPath(gx, gy + 1);
      const W = isPath(gx - 1, gy), E = isPath(gx + 1, gy);
      if (!N) dot(x, y, 0, 0, U, 1, '#5b6675');
      if (!S) dot(x, y, 0, U - 1, U, 1, '#2f3742');
      if (!W) dot(x, y, 0, 0, 1, U, '#535e6d');
      if (!E) dot(x, y, U - 1, 0, 1, U, '#343d49');

      // 진행 방향 점선. 통로가 어느 쪽으로 뻗는지 한눈에 보인다.
      if (W || E) { dot(x, y, 2, 7, 3, 1, '#697484'); dot(x, y, 9, 7, 3, 1, '#697484'); }
      else if (N || S) { dot(x, y, 7, 2, 1, 3, '#697484'); dot(x, y, 7, 9, 1, 3, '#697484'); }
    }
  }

  // 잠긴 행은 어둡게 덮는다
  if (open > 0) {
    ctx.fillStyle = 'rgba(13,17,23,0.62)';
    ctx.fillRect(ox, oy, cell * CFG.BOARD_W, cell * open);
  }

  // 잠긴 구역 경계와 안내.
  // 규칙이 있는데 안 보이면 그냥 못 쓰는 칸으로 읽힌다.
  if (open > 0) {
    ctx.strokeStyle = '#3d444d';
    ctx.setLineDash([5, 4]);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(ox, oy + open * cell - 0.5);
    ctx.lineTo(ox + cell * CFG.BOARD_W, oy + open * cell - 0.5);
    ctx.stroke();
    ctx.setLineDash([]);

    const next = nextUnlockWave();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#6e7681';
    ctx.font = '600 12px system-ui, sans-serif';
    ctx.fillText(
      next === null ? '잠김' : `웨이브 ${next} 클리어 시 개방`,
      ox + cell * CFG.BOARD_W / 2, oy + open * cell / 2);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
  }

  // 관문. 레인마다 하나씩이고, 겹치면 한 번만 그려진다(gateLines 가 접는다).
  ctx.strokeStyle = '#f85149';
  ctx.lineWidth = GATE_W;
  for (const ln of gateLines()) {
    ctx.beginPath();
    ctx.moveTo(ln.x1, ln.y1);
    ctx.lineTo(ln.x2, ln.y2);
    ctx.stroke();
  }
}

function drawTower(t) {
  const { cell } = view;
  const size = towerFootprint(t);
  const { x, y } = cellToPx(t.gx, t.gy);
  const w = cell * size - 2;
  const k = KINDS[t.kind];
  const sel = state.selected === t.id;

  ctx.fillStyle = '#22272e';
  ctx.strokeStyle = STAR_COLOR[t.star];
  ctx.lineWidth = sel ? 3 : 2;
  roundRect(x + 2, y + 2, w - 2, w - 2, 6);
  ctx.fill();
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const icx = x + 2 + (w - 2) / 2, icy = y + 2 + (w - 2) / 2 - cell * 0.08;
  // 5성은 2x2 라 그림도 두 배다(size 가 2). 방향은 크기와 무관하다 — 같은 한 장을
  // 같은 규칙으로 뒤집으므로 여기서 갈릴 것이 없다.
  const isz = cell * 0.82 * size;
  if (!drawSprite(t.kind, k.color, icx, icy, isz, isz, towerFacing(t))) {
    ctx.fillStyle = k.color;
    ctx.font = `700 ${Math.round(cell * 0.42 * size)}px system-ui, sans-serif`;
    ctx.fillText(k.tag, icx, icy);
  }

  ctx.fillStyle = STAR_COLOR[t.star];
  ctx.font = `700 ${Math.round(cell * 0.26)}px system-ui, sans-serif`;
  ctx.fillText('★' + t.star, x + 2 + (w - 2) / 2, y + w - cell * 0.18);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
}

// 사거리는 숫자로 적어봐야 어디까지 닿는지 모른다. 그래서 원으로 그린다.
// 오라 타워는 그 안이 상시 효과 범위라서 실선 + 진한 채움,
// 공격만 하는 타워는 점선 + 옅은 채움으로 구분한다.
function drawRange(t, alpha) {
  const { cell } = view;
  const size = towerFootprint(t);
  const { x, y } = cellToPx(t.gx, t.gy);
  const cx = x + cell * size / 2, cy = y + cell * size / 2;
  const r = towerRange(t) * cell;   // 분기 보정까지 반영된 실제 사거리
  const k = KINDS[t.kind];
  const aura = AURA_KINDS.has(t.kind);

  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;

  roundRect(cx - r, cy - r, r * 2, r * 2, 6);
  ctx.fillStyle = k.color + (aura ? '2e' : '14');
  ctx.fill();
  ctx.strokeStyle = k.color;
  ctx.lineWidth = 2;
  if (!aura) ctx.setLineDash([7, 5]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

// 오라는 눈에 안 보이면 없는 것과 같다. 선택하지 않아도 범위를 깔아 두면
// 적이 그 안에 들어온 순간이 그대로 읽힌다.
function drawAuraFields() {
  const { cell } = view;
  for (const t of state.towers) {
    if (!AURA_KINDS.has(t.kind)) continue;
    const size = towerFootprint(t);
    const { x, y } = cellToPx(t.gx, t.gy);
    const r = towerRange(t) * cell;
    const cx = x + cell * size / 2, cy = y + cell * size / 2;
    ctx.fillStyle = KINDS[t.kind].color + '16';
    roundRect(cx - r, cy - r, r * 2, r * 2, 6);
    ctx.fill();
  }
}

function drawEffects() {
  const { cell, ox, oy } = view;
  const P = (gx, gy) => ({ x: ox + gx * cell, y: oy + gy * cell });

  for (const p of state.patches) {
    const c = P(p.x, p.y);
    ctx.fillStyle = 'rgba(210,153,34,0.18)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, p.r * cell, 0, Math.PI * 2);
    ctx.fill();
  }

  // 빔은 두 겹이다. 한 겹이면 굵기를 어떻게 잡아도 "선"이지 "빛"이 아니다.
  // 넓고 흐린 글로우 위에 얇고 흰 코어를 같은 두 점에 겹쳐 긋는다.
  // lineCap 은 건드리지 않는다 — ctx 전역이라 복구를 한 번 빠뜨리면
  // 그 뒤의 모든 stroke(디버프 막대·블라스트 링)로 새어 나간다.
  for (const b of state.beams) {
    const a = P(b.x1, b.y1), c = P(b.x2, b.y2);
    const al = Math.min(1, b.t * 8);
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(c.x, c.y);
    ctx.strokeStyle = b.color || '#db61a2';
    ctx.globalAlpha = al * 0.45;
    ctx.lineWidth = b.wide ? 12 : 5;
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.globalAlpha = al;
    ctx.lineWidth = b.wide ? 3.5 : 1.6;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 총구 화염. 빔 뒤에 그려야 빔 위에 얹혀서 "여기서 나갔다"로 읽힌다.
  // 게이트는 둘이다 — 아직 살아 있거나(flash), 살아 있던 적이 없더라도 이 프레임에
  // 태어난 것(mzShown === false). 두 번째가 없으면 배속에서 화염이 update 사이에
  // 통째로 죽어 한 번도 안 그려진다. 방향 필드가 없는 타워(세이브 복원, 테스트
  // 리터럴)는 muzzle() 을 거친 적이 없어 두 조건 다 거짓이므로 못 들어온다.
  for (const t of state.towers) {
    const live = t.flash > 0;
    if (!live && t.mzShown !== false) continue;
    const c = towerCenter(t);
    // 발밑이 아니라 몸 바깥 끝이다. 상수로 박으면 5성 2x2 의 몸 안에서 빛난다.
    const off = towerFootprint(t) * 0.45;
    const p = P(c.x + t.mzDx * off, c.y + t.mzDy * off);
    // 래치로 들어온 프레임은 수명이 이미 다 탔다. 알파를 수명으로 계산하면
    // 0 이 되어 게이트만 통과하고 아무것도 안 보인다 — 그 한 프레임은 최대로 낸다.
    const a = live ? Math.min(1, t.flash / MUZZLE_LIFE) : 1;
    t.mzShown = true;
    ctx.fillStyle = KINDS[t.kind].color;
    ctx.globalAlpha = a * 0.5;
    ctx.beginPath();
    ctx.arc(p.x, p.y, cell * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.arc(p.x, p.y, cell * 0.07, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  for (const s of state.shells) {
    const k = s.t / s.tt;
    const x = s.x + (s.tx - s.x) * k, y = s.y + (s.ty - s.y) * k;
    const c = P(x, y);
    const arc = Math.sin(k * Math.PI) * cell * 0.7;
    ctx.fillStyle = '#d29922';
    ctx.beginPath();
    ctx.arc(c.x, c.y - arc, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const b of state.blasts) {
    const c = P(b.x, b.y);
    ctx.strokeStyle = 'rgba(210,153,34,' + (b.t * 4).toFixed(2) + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(c.x, c.y, b.r * cell * (1.4 - b.t * 1.6), 0, Math.PI * 2);
    ctx.stroke();
  }
}

// 두 색을 섞는다. 디버프 강도를 색 농도로 보여주는 데 쓴다.
function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  const m = (x, y) => Math.round(x + (y - x) * t).toString(16).padStart(2, '0');
  return '#' + m(r1, r2) + m(g1, g2) + m(b1, b2);
}

function drawEnemies() {
  const { cell, ox, oy } = view;
  for (const e of state.enemies) {
    const d = ENEMY[e.kind];
    const cx = ox + (e.x + 0.5) * cell;
    const cy = oy + (e.y + 0.5) * cell;
    const r = d.r * cell;

    // 디버프는 적 색으로 읽힌다. 테두리보다 눈에 잘 들어온다.
    // 디버프는 적 색으로 읽힌다. 스프라이트 전체가 그 색으로 구워진다.
    const tint = e.hitFlash > 0 ? '#ffffff'
      : e.frozen > 0 ? '#79c0ff'
      : e.slowAmt > 0 ? mixHex(d.color, '#79c0ff', Math.min(1, e.slowAmt / CFG.SLOW_CAP) * 0.75)
      : d.color;
    if (!drawSprite(e.kind, tint, cx, cy, r * 2.3, r * 2.3, enemyFacing(e))) {
      ctx.fillStyle = tint;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    // 디버프 막대. 방깎은 주황, 마방깎·마법취약은 보라.
    // 수치가 안 보이면 디버프 타워가 일하는지 알 수가 없다.
    let bar = cy + r + 2;
    const drawBar = (ratio, color) => {
      ctx.fillStyle = '#0006';
      ctx.fillRect(cx - r, bar, r * 2, 2);
      ctx.fillStyle = color;
      ctx.fillRect(cx - r, bar, r * 2 * Math.min(1, ratio), 2);
      bar += 3;
    };
    if (e.armorStacks > 0 && e.armorCap > 0) drawBar(e.armorStacks / e.armorCap, '#f0883e');
    const mag = (e.mresCut || 0) + (e.magicVuln || 0);
    if (mag > 0) drawBar(mag / 0.5, '#a371f7');

    if (e.hp < e.maxHp) {
      const bw = r * 2.2, bh = 3;
      // 최상단 행에서는 위로 그리면 보드 밖으로 잘린다
      const by = cy - r - 7 < oy + 2 ? cy + r + 4 : cy - r - 7;
      ctx.fillStyle = '#000a';
      ctx.fillRect(cx - bw / 2, by, bw, bh);
      ctx.fillStyle = '#3fb950';
      ctx.fillRect(cx - bw / 2, by, bw * (e.hp / e.maxHp), bh);
    }
  }
}

// 처치 잔상. 자리는 drawEnemies() 뒤, drawParticles() 앞이다 — 잔상은 적 그림이라
// 살아있는 적과 같은 층이어야 하고, 파편은 그 위에 얹혀야 "터졌다"로 읽힌다.
// 순서를 뒤집으면 파편이 잔상 밑에 깔려서 죽는 순간이 오히려 흐려진다.
function drawCorpses() {
  const arr = state.corpses;
  if (!arr.length) return;
  const { cell, ox, oy } = view;

  for (const c of arr) {
    if (!c.alive) continue;
    const { sx, sy, alpha } = corpseScale(c);
    // drawEnemies 와 같은 표시 배율(셀의 r*2.3)이다. 다르게 잡으면 죽는 순간
    // 크기가 한 번 튀어서 "다른 것으로 바뀌었다"로 읽힌다.
    const base = ENEMY[c.kind].r * 2.3 * cell;
    const cx = ox + c.x * cell;
    // 세로가 줄 때 중심을 고정하면 위아래로 동시에 오므라들어 "작아진다"가 된다.
    // 아랫변을 고정해야 바닥에 눌린 그림이 된다.
    const cy = oy + c.y * cell + base * (1 - sy) / 2;
    ctx.globalAlpha = alpha;
    // 색은 spawnCorpse 가 구운 고정값 그대로다. 흐려지는 건 globalAlpha 가 맡는다 —
    // 여기서 색을 섞으면 프레임마다 sprCache 에 새 캔버스가 구워진다.
    // 스프라이트가 없으면 그냥 안 그린다. 잔상은 실루엣이 전부라 원형 대체 도형으로
    // 그리면 무엇이 죽었는지가 오히려 안 읽히고, drawParticles 의 "도형 1개당 파편
    // 1개" 집계에도 fill 이 하나 섞여 들어간다.
    // 방향도 죽는 순간 그대로 굳는다(spawnCorpse 가 베껴 둔다). 여기서 다시 안 재는
    // 것은 색과 같은 이유고, 안 물려주면 옆으로 걷던 놈이 죽는 순간 정면으로 홱 돈다.
    drawSprite(c.kind, c.color, cx, cy, base * sx, base * sy, c.face);
  }
  ctx.globalAlpha = 1;
}

// 처치 파편. drawEffects 안에 넣으면 살아있는 적 밑에 깔려서 안 읽힌다 —
// 죽는 순간의 그림이라 적 위에 있어야 한다. 보드 클립 안에서 부른다.
function drawParticles() {
  const arr = state.particles;
  if (!arr.length) return;
  const { cell, ox, oy } = view;

  for (const p of arr) {
    if (!p.alive) continue;
    const k = p.t / p.life;                  // 1 → 0
    const x = ox + p.x * cell, y = oy + p.y * cell;
    ctx.globalAlpha = Math.min(1, k * 1.6);  // 끝에서만 흐려진다

    if (p.shape === 'ring') {
      // 확장하는 링. 마법 처치라는 걸 한 장으로 알리는 부분이다.
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, p.size * cell * (0.4 + (1 - k) * 2.6), 0, Math.PI * 2);
      ctx.stroke();
      continue;
    }

    if (p.shape === 'spark') {
      // 착탄 여파. 진행 방향으로 누운 짧은 선 하나다 — 점으로 그리면 처치 파편과
      // 구분이 안 되고, 각진 도형으로 그리면 크기가 작아서 그냥 얼룩이 된다.
      const s = p.size * cell;
      const dx = Math.cos(p.rot) * s, dy = Math.sin(p.rot) * s;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x - dx, y - dy);
      ctx.lineTo(x + dx, y + dy);
      ctx.stroke();
      continue;
    }

    if (p.shape === 'glow') {
      // 마법 잔광은 원형이고 오므라들며 사라진다
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, p.size * cell * (0.4 + k * 0.6), 0, Math.PI * 2);
      ctx.fill();
      continue;
    }

    // shard(물리·순수) / ice(빙결). 각지고 돌아야 파편으로 읽힌다.
    const s = p.size * cell;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    if (p.shape === 'ice') {
      ctx.moveTo(0, -s * 1.2);
      ctx.lineTo(s * 0.9, s * 0.8);
      ctx.lineTo(-s * 0.9, s * 0.8);
    } else {
      ctx.moveTo(-s, -s * 0.7);
      ctx.lineTo(s, -s);
      ctx.lineTo(s * 0.8, s);
      ctx.lineTo(-s * 0.9, s * 0.8);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// 3웨이브 앞까지 예고. 지금 최적인 빌드가 곧 무력화된다는 걸
// 미리 보여주는 게 이 게임의 결정 구조라서 항상 화면에 띄운다.
function drawForecast() {
  const start = state.wave + 1;
  const colW = view.w / 3;
  ctx.textBaseline = 'top';

  for (let i = 0; i < 3; i++) {
    const w = start + i;
    if (w > CFG.WAVE_MAX) break;
    const groups = waveGroups(w);
    const x = colW * i + 12;

    ctx.fillStyle = i === 0 ? '#e6edf3' : '#6e7681';
    ctx.font = `${i === 0 ? '700 ' : ''}11px system-ui, sans-serif`;
    ctx.fillText(`w${w}`, x, 66);

    let gx = x + 26;
    for (const [kind, count] of groups) {
      const d = ENEMY[kind];
      ctx.fillStyle = i === 0 ? d.color : d.color + '99';
      ctx.font = '700 12px system-ui, sans-serif';
      ctx.fillText(d.tag, gx, 65);
      gx += 13;
      ctx.fillStyle = i === 0 ? '#8b949e' : '#484f58';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText(String(count), gx, 66);
      gx += ctx.measureText(String(count)).width + 7;
